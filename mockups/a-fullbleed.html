<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mockup A — Full-bleed pitch</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="mock.css?v=4">
<style>
  body { display: flex; flex-direction: column; height: 100dvh; }

  /* ── Score strip: deliberately thin. Everything else is overlaid on the
       pitch, so the pitch itself gets the entire remaining screen. ── */
  .score {
    flex-shrink: 0; display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 8px; padding: 7px 12px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .score .side { display: flex; align-items: baseline; gap: 8px; }
  .score .side.right { justify-content: flex-end; }
  .score .nm  { font-size: 0.78rem; color: var(--text-muted); font-weight: 700; }
  .score .nm.has { color: var(--text); }
  .score .sc  { font-size: 1.5rem; font-weight: 800; line-height: 1; }
  .score .clk { text-align: center; font-variant-numeric: tabular-nums; }
  .score .clk b { display: block; font-size: 1.05rem; font-weight: 700; letter-spacing: 0.02em; }
  .score .clk span { font-size: 0.6rem; color: var(--text-dim); }

  .pitch-wrap { flex: 1; min-height: 0; }

  /* ── Overlays ──────────────────────────────────────────────── */
  .ov { position: absolute; z-index: 5; }

  /* Who has the ball + which way they're going. Sits on the try band, because
     that's the end they're attacking. */
  .attacking {
    top: calc(11.54% + 62px); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 7px;
    background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.16); border-radius: 99px;
    padding: 4px 12px; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.04em;
  }
  .attacking .arrow { color: var(--green); font-size: 0.8rem; }

  /* Penalties: floated just under the try band, thumb-reachable at the top of
     a two-handed grip and never confused with a pitch tap. */
  .pens { top: calc(11.54% + 7px); left: 8px; right: 8px; display: flex; gap: 6px; }
  .pens .btn {
    flex: 1; padding: 9px 4px; font-size: 0.74rem; border-radius: 9px;
    background: rgba(10,14,20,0.72); backdrop-filter: blur(6px);
    border-color: rgba(255,255,255,0.18);
  }
  .pens .btn small { display: block; font-size: 0.56rem; font-weight: 600; color: var(--text-dim); margin-top: 1px; }
  .pens .btn.armed { background: var(--yellow); border-color: var(--yellow); color: #17130a; }
  .pens .btn.armed small { color: rgba(0,0,0,0.55); }

  /* Touch counter runs up the left edge, in the direction of play. */
  .touches { left: 7px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column-reverse; gap: 9px; }
  .touches .tdot { width: 13px; height: 13px; }

  /* Game controls tucked on the right edge, out of the tap path. */
  .side-rail { right: 7px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; }
  .side-rail .btn {
    width: 42px; height: 42px; border-radius: 12px; font-size: 0.58rem; line-height: 1.1;
    background: rgba(10,14,20,0.72); backdrop-filter: blur(6px); border-color: rgba(255,255,255,0.16);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  }
  .side-rail .btn i { font-style: normal; font-size: 0.95rem; }

  /* ── Last four, as a chip strip along the bottom ────────────── */
  .recent {
    left: 0; right: 0; bottom: 0; padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(11,14,20,0.95) 55%, transparent);
    display: flex; gap: 6px; align-items: stretch;
  }
  .chips { flex: 1; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; min-width: 82px; text-align: left;
    background: rgba(30,36,51,0.92); border: 1px solid var(--border);
    border-radius: 9px; padding: 6px 9px; cursor: pointer;
  }
  .chip .l { font-size: 0.72rem; font-weight: 700; white-space: nowrap; }
  .chip .m { font-size: 0.58rem; color: var(--text-dim); font-variant-numeric: tabular-nums; margin-top: 1px; }
  .chip.k-try      { border-color: var(--green);  background: rgba(34,197,94,0.14); }
  .chip.k-turnover { border-color: var(--red);    background: rgba(239,68,68,0.13); }
  .chip.k-pen      { border-color: var(--yellow); background: rgba(245,158,11,0.13); }
  .undo { flex: 0 0 auto; width: 46px; border-radius: 9px; font-size: 0.95rem; }
</style>
</head>
<body>

<div class="mock-tag">MOCKUP A · full-bleed &nbsp;<a href="index.html">all three →</a></div>

<div class="score">
  <div class="side"><span class="nm has" id="n1">FRA</span><span class="sc" id="s1">3</span></div>
  <div class="clk"><b id="clk">12:22</b><span>1st half</span></div>
  <div class="side right"><span class="sc" id="s2">2</span><span class="nm has" id="n2">ENG</span></div>
</div>

<div class="pitch-wrap" id="wrap">
  <div class="ov attacking"><span class="arrow">▲</span><span id="attTeam">FRA</span><span style="color:var(--text-dim);font-weight:600">attacking</span></div>

  <div class="ov pens" id="pens">
    <button class="btn" data-pen="Pen Atk">Pen Atk<small>we won it</small></button>
    <button class="btn" data-pen="Pen Def">Pen Def<small>we gave it</small></button>
    <button class="btn" data-pen="6 Again">6 Again<small>keep ball</small></button>
  </div>

  <div class="ov touches dot-row" id="touches"></div>

  <div class="ov side-rail">
    <button class="btn"><i>▶</i>Live</button>
    <button class="btn"><i>±</i>Drive</button>
    <button class="btn"><i>⚑</i>Review</button>
  </div>

  <div class="ov recent">
    <div class="chips" id="chips"></div>
    <button class="btn undo" id="undo">↩</button>
  </div>
</div>


<script src="mock.js?v=4"></script>
<script>
  const st = Mock.makeState();
  const wrap = document.getElementById('wrap');
  wrap.insertAdjacentHTML('afterbegin', Mock.pitchSVG());
  const svg = wrap.querySelector('svg.pitch');
  wrap.insertAdjacentHTML('beforeend', '<div class="pin-layer" id="pinLayer"></div>');
  const pinLayer = document.getElementById('pinLayer');

  pinLayer.addEventListener('click', ev => {
    const pinEl = ev.target.closest('.pin');
    if (!pinEl) return;
    // Tapping a pin promotes that touch to a turnover — the "tap it again"
    // gesture, so losing the ball never needs a separate button.
    if (Mock.promote(st, +pinEl.dataset.i)) render();
  });

  svg.addEventListener('click', ev => {
    Mock.tap(st, Mock.pointAt(svg, ev));
    render();
  });

  document.getElementById('pens').addEventListener('click', ev => {
    const b = ev.target.closest('[data-pen]');
    if (!b) return;
    const pen = b.dataset.pen;
    // Tapping an already-armed penalty drops it at the last known ball position,
    // so a penalty never costs two taps unless you want the placement.
    if (st.armed === pen) {
      const last = st.pins[st.pins.length - 1] || { x: 50, y: 50 };
      Mock.tap(st, { x: last.x, y: last.y });
    } else {
      st.armed = pen;
    }
    render();
  });

  document.getElementById('undo').addEventListener('click', () => { Mock.undo(st); render(); });

  function render() {
    Mock.renderPins(pinLayer, st);
    document.getElementById('attTeam').textContent = st.possession;
    document.getElementById('s1').textContent = st.score.FRA;
    document.getElementById('s2').textContent = st.score.ENG;
    document.getElementById('clk').textContent = Mock.fmt(st.clock);
    document.getElementById('touches').innerHTML = [1,2,3,4,5,6]
      .map(n => `<span class="tdot ${n <= st.touch ? (n === 6 ? 'last' : 'on') : ''}"></span>`).join('');
    document.querySelectorAll('#pens .btn')
      .forEach(b => b.classList.toggle('armed', st.armed === b.dataset.pen));
    document.getElementById('chips').innerHTML = st.log.slice(0, 4).map(e =>
      `<div class="chip k-${e.kind}"><div class="l">${e.label}</div><div class="m">${e.t} · ${e.team}</div></div>`
    ).join('') || '<div class="chip" style="opacity:.4"><div class="l">no events yet</div><div class="m">tap the pitch</div></div>';
  }
  render();
</script>
</body>
</html>
