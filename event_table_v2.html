<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Viewer — Touch Rugby Analyzer</title>
<style>
  :root {
    --bg:           #0f1117;
    --surface:      #1a1d27;
    --surface-2:    #22253a;
    --border:       #2a2d3a;
    --border-light: #1f2230;
    --text:         #e0e0e0;
    --text-muted:   #888;
    --text-dim:     #555;
    --accent:       #3b82f6;
    --accent-hover: #2563eb;
    --vp-w:         420px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ───────────────────────────────────────────────── */
  header { background: var(--surface); padding: 10px 20px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
  .logo span { font-size: 1rem; font-weight: 600; color: #fff; white-space: nowrap; }
  .header-nav { display: flex; gap: 4px; margin-left: auto; }
  .header-nav a { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; padding: 5px 10px; border-radius: 6px; transition: background 0.15s, color 0.15s; }
  .header-nav a:hover { background: var(--surface-2); color: var(--text); }
  .header-nav a.active { background: var(--surface-2); color: var(--accent); }
  #rowCount { font-size: 0.78rem; color: var(--text-muted); }

  /* ── Split layout ─────────────────────────────────────────── */
  .split { display: flex; flex: 1; overflow: hidden; min-height: 0; }

  .video-panel { width: var(--vp-w); min-width: 260px; max-width: 70vw; display: flex; flex-direction: column; border-right: 1px solid var(--border); flex-shrink: 0; }

  .resize-handle { width: 5px; cursor: col-resize; background: var(--border); flex-shrink: 0; transition: background 0.15s; user-select: none; }
  .resize-handle:hover, .resize-handle.dragging { background: var(--accent); }

  .table-panel { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }

  /* ── Video area ───────────────────────────────────────────── */
  .video-area { flex: 1; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #ytContainer { width: 100%; height: 100%; display: none; }
  .no-video-msg { color: #555; font-size: 0.8rem; text-align: center; padding: 24px 16px; line-height: 1.8; }
  .no-video-msg svg { opacity: 0.2; display: block; margin: 0 auto 10px; }

  /* ── Video controls ───────────────────────────────────────── */
  .video-controls { background: var(--surface); border-top: 1px solid var(--border); padding: 7px 10px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .vc-row { display: flex; align-items: center; gap: 5px; }

  .btn { border: none; border-radius: 5px; padding: 4px 10px; font-size: 0.75rem; cursor: pointer; font-weight: 600; transition: background 0.15s; white-space: nowrap; }
  .btn-ghost { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
  .btn-ghost:hover { background: #2e3245; color: var(--text); }
  .btn-ghost:disabled { opacity: 0.4; cursor: default; }
  .btn-primary { background: var(--accent); color: #fff; border: none; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; }
  .btn-nav { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); border-radius: 5px; padding: 4px 9px; font-size: 0.73rem; cursor: pointer; font-weight: 700; }
  .btn-nav:hover { background: #2e3245; color: var(--text); }
  .btn-nav:disabled { opacity: 0.35; cursor: default; }

  .seekbar-wrap { position: relative; height: 5px; background: var(--surface-2); border-radius: 3px; cursor: pointer; flex: 1; }
  .seekbar-fill { height: 100%; background: var(--accent); border-radius: 3px; pointer-events: none; }
  .seekbar-thumb { position: absolute; top: 50%; transform: translate(-50%,-50%); width: 12px; height: 12px; background: #fff; border-radius: 50%; pointer-events: none; box-shadow: 0 0 4px rgba(0,0,0,0.5); }
  .time-display { font-family: monospace; font-size: 0.8rem; color: #fff; background: var(--bg); padding: 3px 7px; border-radius: 4px; white-space: nowrap; }
  .speed-sel { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); border-radius: 5px; padding: 3px 5px; font-size: 0.73rem; cursor: pointer; }

  /* ── Now-playing card ─────────────────────────────────────── */
  .now-playing { background: var(--surface); border-top: 1px solid var(--border); padding: 8px 10px; flex-shrink: 0; min-height: 48px; display: flex; flex-direction: column; gap: 3px; }
  .np-label { font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-dim); }
  .np-empty { font-size: 0.78rem; color: var(--text-dim); font-style: italic; }
  .np-info { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .np-time { font-family: monospace; font-size: 0.73rem; color: var(--text-muted); background: var(--bg); padding: 2px 6px; border-radius: 3px; }
  .np-game { font-size: 0.7rem; color: var(--text-muted); background: var(--surface-2); padding: 2px 7px; border-radius: 4px; border: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .np-comment { font-size: 0.72rem; color: #f97316; font-style: italic; white-space: pre-wrap; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }

  /* ── Table controls ───────────────────────────────────────── */
  .controls { background: var(--surface); border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; flex-direction: column; gap: 7px; flex-shrink: 0; }
  .top-row { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .search-group { display: flex; flex-grow: 1; min-width: 180px; }
  .col-select { padding: 6px 8px; background: var(--surface-2); border: 1px solid var(--border); border-right: none; border-radius: 6px 0 0 6px; color: var(--text-muted); font-size: 0.78rem; cursor: pointer; outline: none; max-width: 120px; }
  .search-input { flex-grow: 1; padding: 6px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 0 6px 6px 0; color: var(--text); font-size: 0.8rem; outline: none; }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--text-dim); }
  .filter-row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; }
  .filter-wrap { position: relative; }
  .filter-btn { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-size: 0.77rem; cursor: pointer; user-select: none; white-space: nowrap; }
  .filter-btn::after { content: '▾'; font-size: 0.7em; opacity: 0.6; }
  .filter-btn:hover { border-color: #3a3d4a; color: var(--text); }
  .filter-btn.active { border-color: var(--accent); color: var(--accent); }
  .filter-dropdown { position: absolute; top: calc(100% + 4px); left: 0; min-width: 160px; max-height: 260px; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 100; display: none; padding: 4px 0; }
  .filter-dropdown.open { display: block; }
  .filter-dropdown label { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 0.79rem; color: var(--text-muted); cursor: pointer; }
  .filter-dropdown label:hover { background: var(--surface-2); color: var(--text); }
  .filter-dropdown input[type=checkbox] { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }

  /* ── Table ────────────────────────────────────────────────── */
  .table-wrap { flex: 1; overflow: auto; min-height: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  thead { position: sticky; top: 0; z-index: 10; }
  th { background: var(--surface); color: var(--text-muted); padding: 8px 10px; text-align: left; font-weight: 600; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: var(--text); }
  th.sort-asc::after  { content: ' ▲'; font-size: 0.65em; color: var(--accent); }
  th.sort-desc::after { content: ' ▼'; font-size: 0.65em; color: var(--accent); }
  td { padding: 6px 10px; border-bottom: 1px solid var(--border-light); color: #ccc; vertical-align: middle; }
  tr.playable { cursor: pointer; }
  tr.playable:hover td { background: var(--surface-2); }
  tr.active-row td { background: rgba(59,130,246,0.13) !important; }
  tr.active-row { outline: none; }

  /* Type badges */
  .badge { padding: 2px 7px; border-radius: 10px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .badge-try      { background: rgba(0,200,83,0.15);   color: #00c853; }
  .badge-penalty  { background: rgba(244,67,54,0.15);  color: #f44336; }
  .badge-turnover { background: rgba(255,152,0,0.15);  color: #ff9800; }
  .badge-toreview { background: rgba(249,115,22,0.15); color: #f97316; }

  .team-badge { padding: 2px 7px; border-radius: 10px; font-size: 0.7rem; font-weight: 600; background: rgba(59,130,246,0.12); color: #93c5fd; border: 1px solid rgba(59,130,246,0.2); }
  .yt-link { display: inline-flex; align-items: center; gap: 4px; color: #f44336; text-decoration: none; font-size: 0.73rem; font-weight: 600; background: rgba(244,67,54,0.1); padding: 2px 7px; border-radius: 4px; }
  .yt-link:hover { background: rgba(244,67,54,0.2); }
  .game-tag { font-size: 0.7rem; color: var(--text-muted); background: var(--surface-2); padding: 2px 6px; border-radius: 4px; border: 1px solid var(--border); }

  /* Comment expand */
  .comment-cell { font-size: 0.78rem; color: #f97316; font-style: italic; }
  .comment-rest { display: none; white-space: pre-wrap; margin-top: 3px; }
  .comment-rest.open { display: block; }
  .comment-toggle { background: none; border: none; color: #888; cursor: pointer; font-size: 0.66rem; padding: 2px 0; display: inline-flex; align-items: center; gap: 2px; }
  .comment-toggle:hover { color: #f97316; }

  /* Play icon on hover */
  .play-icon { opacity: 0; font-size: 0.75rem; color: var(--accent); margin-right: 4px; transition: opacity 0.1s; }
  tr.playable:hover .play-icon { opacity: 1; }
  tr.active-row .play-icon { opacity: 1; color: #22c55e; }

  .empty { text-align: center; padding: 40px; color: var(--text-dim); font-size: 0.85rem; }
  #loadingMsg { text-align: center; padding: 50px 24px; color: #888; font-size: 0.88rem; display: none; }
  #errorMsg   { color: #ef4444; font-size: 0.8rem; padding: 10px 16px; display: none; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #2a2d3a; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Pagination ───────────────────────────────────────────── */
  .pagination { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; gap: 7px; }
  .pagination-info { font-size: 0.77rem; color: var(--text-muted); }
  .pagination-actions { display: flex; align-items: center; gap: 7px; }
  .page-select { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; font-size: 0.77rem; cursor: pointer; }
  #pageIndicator { font-size: 0.77rem; color: var(--text-muted); min-width: 80px; text-align: center; }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      <path d="M2 12h20"/>
    </svg>
    <span>Touch Rugby Analyzer</span>
  </a>
  <span id="rowCount"></span>
  <nav class="header-nav">
    <a href="games.html">Games</a>
    <a href="event_table.html">Events</a>
    <a href="event_table_v2.html" class="active">Event Viewer</a>
    <a href="viewer.html" id="annotatorLink" style="display:none">Annotator</a>
  </nav>
  <script>if (sessionStorage.getItem('accessLevel') === 'staff') document.getElementById('annotatorLink').style.display = '';</script>
</header>

<div id="errorMsg"></div>

<div class="split" id="split">

  <!-- ── Video panel ──────────────────────────────────────── -->
  <div class="video-panel" id="videoPanel">

    <div class="video-area" id="videoArea">
      <div class="no-video-msg" id="noVideoMsg">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="7" width="16" height="12" rx="2"/>
          <path d="m18 10 4-2v8l-4-2"/>
        </svg>
        Click any row to start watching
      </div>
      <div id="ytContainer"></div>
    </div>

    <div class="video-controls">
      <div class="vc-row">
        <div class="seekbar-wrap" id="seekbar">
          <div class="seekbar-fill" id="seekFill" style="width:0%"></div>
          <div class="seekbar-thumb" id="seekThumb" style="left:0%"></div>
        </div>
      </div>
      <div class="vc-row">
        <button class="btn-nav" id="prevRowBtn" disabled onclick="navigateRow(-1)">◀ Prev</button>
        <button class="btn btn-primary" id="playBtn" disabled onclick="togglePlay()">▶ Play</button>
        <button class="btn btn-ghost" id="skipBk" disabled onclick="skip(-5)">−5s</button>
        <button class="btn btn-ghost" id="skipFw" disabled onclick="skip(5)">+5s</button>
        <span class="time-display" id="timeCurrent">0:00:00</span>
        <span style="color:var(--text-dim);font-size:0.8rem">/</span>
        <span class="time-display" id="timeDuration">0:00:00</span>
        <select class="speed-sel" id="speedSel" disabled onchange="setSpeed()">
          <option value="0.25">0.25×</option>
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="1.5">1.5×</option>
          <option value="2">2×</option>
        </select>
        <button class="btn-nav" id="nextRowBtn" disabled onclick="navigateRow(1)">Next ▶</button>
      </div>
    </div>

    <div class="now-playing" id="nowPlaying">
      <span class="np-label">Now Playing</span>
      <span class="np-empty" id="npEmpty">No annotation selected</span>
      <div class="np-info" id="npInfo" style="display:none"></div>
      <div class="np-comment" id="npComment" style="display:none"></div>
    </div>

  </div>

  <!-- ── Resize handle ────────────────────────────────────── -->
  <div class="resize-handle" id="resizeHandle"></div>

  <!-- ── Table panel ──────────────────────────────────────── -->
  <div class="table-panel">

    <div class="controls" id="controls" style="display:none">
      <div class="top-row">
        <div class="search-group">
          <select id="searchCol" class="col-select"></select>
          <input id="searchInput" class="search-input" type="text" placeholder="Search…">
        </div>
        <button class="btn btn-ghost" onclick="resetFilters()">↺ Reset</button>
      </div>
      <div class="filter-row" id="filterRow"></div>
    </div>

    <div id="loadingMsg"><span class="spinner"></span>Loading events…</div>

    <div class="table-wrap">
      <table id="dataTable">
        <thead></thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="emptyState" style="display:none">No matching records found.</div>
    </div>

    <div class="pagination" id="pagination" style="display:none">
      <div class="pagination-info">
        Showing <span id="rangeStart">0</span>–<span id="rangeEnd">0</span> of <span id="totalRows">0</span>
      </div>
      <div class="pagination-actions">
        <label style="font-size:0.77rem;color:var(--text-muted)">Rows:
          <select id="rowsPerPage" class="page-select">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="250">250</option>
          </select>
        </label>
        <button id="prevBtn" class="btn btn-ghost" disabled>‹ Prev</button>
        <span id="pageIndicator">Page 1</span>
        <button id="nextBtn" class="btn btn-ghost" disabled>Next ›</button>
      </div>
    </div>

  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────────
const APPS_SCRIPT_URL    = 'https://script.google.com/macros/s/AKfycbzhMw4nQr2nVW0MLfPWVXRPXsvImerpzshQ5GnJ3873qQkGMz0bcJQdmTRXCxwygfFm/exec';
const APPS_SCRIPT_SECRET = 'm30-test-key';

const LS = {
  get(k)    { try { return JSON.parse(localStorage.getItem('trl_' + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('trl_' + k, JSON.stringify(v)); } catch {} },
};

const FILTERABLE  = ['Type', 'Name', 'Possession Owner', 'Action Owner', 'Game'];
const HIDDEN_COLS = new Set(['Team 1', 'Team 2', 'Video Name', 'To Review']);
const TYPE_BADGE  = { 'try':'badge-try', 'penalty':'badge-penalty', 'turnover':'badge-turnover', 'to review':'badge-toreview' };

// ── Table state ─────────────────────────────────────────────────
let allData      = [];
let filtered     = [];
let headers      = [];
let sortCol      = -1;
let sortAsc      = true;
let currentPage  = 1;
let rowsPerPage  = 50;
let activeFilters = {};

// Column indices (resolved after headers load)
let colTime = -1, colYt = -1, colType = -1, colName = -1, colGame = -1, colComment = -1, colPoss = -1;

// ── Video state ─────────────────────────────────────────────────
let ytPlayer          = null;
let ytProgressInterval = null;
let currentVideoId    = null;
let pendingSeekTime   = null;
let videoReady        = false;
let activeRowIdx      = -1;   // index in `filtered`

// ── Bootstrap ───────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  setupSeekbar();
  setupResizeHandle();
  fetchAll();
});

// ── Data fetching ───────────────────────────────────────────────
async function fetchAll() {
  const cached = LS.get('all');
  if (cached) {
    processRows(cached.rows);
  } else {
    document.getElementById('loadingMsg').style.display = 'block';
  }
  try {
    const resp   = await fetch(`${APPS_SCRIPT_URL}?secret=${enc(APPS_SCRIPT_SECRET)}&action=all`);
    const result = await resp.json();
    if (!result.ok) throw new Error(result.error);
    LS.set('all', result);
    processRows(result.rows);
  } catch (err) {
    if (!cached) {
      document.getElementById('loadingMsg').style.display = 'none';
      const el = document.getElementById('errorMsg');
      el.textContent = 'Failed to load events: ' + err.message;
      el.style.display = 'block';
    }
  }
}

function processRows(rows) {
  document.getElementById('loadingMsg').style.display = 'none';
  if (!rows || rows.length < 2) return;

  headers = rows[0].map(h => h.trim());
  allData = rows.slice(1).filter(r => r.some(c => c !== ''));

  // Substitute Team 1/Team 2 placeholders
  const hi      = h => headers.findIndex(x => x.toLowerCase() === h);
  const possIdx = hi('possession owner'), actionIdx = hi('action owner');
  const t1Idx   = hi('team 1'), t2Idx = hi('team 2');
  if (t1Idx >= 0 && t2Idx >= 0) {
    allData.forEach(row => {
      const t1 = row[t1Idx], t2 = row[t2Idx];
      for (const idx of [possIdx, actionIdx]) {
        if (idx < 0) continue;
        if (row[idx] === 'Team 1') row[idx] = t1;
        else if (row[idx] === 'Team 2') row[idx] = t2;
      }
    });
  }

  // Drop hidden columns
  const keepIdx = headers.map((h, i) => HIDDEN_COLS.has(h) ? -1 : i).filter(i => i >= 0);
  headers = keepIdx.map(i => headers[i]);
  allData = allData.map(row => keepIdx.map(i => row[i]));

  // Exclude Game Event rows
  const typeColIdx = headers.findIndex(h => h.toLowerCase() === 'type');
  if (typeColIdx >= 0) allData = allData.filter(row => row[typeColIdx] !== 'Game Event');

  // Resolve column indices
  const hli   = h => headers.findIndex(x => x.toLowerCase() === h);
  colTime    = hli('time');
  colYt      = hli('youtube link');
  colType    = hli('type');
  colName    = hli('name');
  colGame    = hli('game');
  colComment = hli('comment');
  colPoss    = hli('possession owner');

  filtered = [...allData];
  buildSearchColSelect();
  buildFilterDropdowns();
  renderHeaders();
  applyFilters();

  document.getElementById('controls').style.display  = '';
  document.getElementById('pagination').style.display = '';
}

// ── Search / Filter ─────────────────────────────────────────────
function buildSearchColSelect() {
  const sel = document.getElementById('searchCol');
  sel.innerHTML = '<option value="-1">All Columns</option>';
  headers.forEach((h, i) => {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = h || '#';
    sel.appendChild(opt);
  });
}

function buildFilterDropdowns() {
  const row = document.getElementById('filterRow');
  row.innerHTML = '';
  activeFilters = {};
  FILTERABLE.forEach(col => {
    const idx = headers.findIndex(h => h.toLowerCase() === col.toLowerCase());
    if (idx === -1) return;
    activeFilters[col] = new Set();
    const vals = [...new Set(allData.map(r => r[idx]).filter(Boolean))].sort();
    if (!vals.length) return;
    const wrap = document.createElement('div');
    wrap.className = 'filter-wrap';
    const btn = document.createElement('div');
    btn.className = 'filter-btn';
    btn.innerHTML = `<span>${col}</span>`;
    const drop = document.createElement('div');
    drop.className = 'filter-dropdown';
    drop.dataset.col = col;
    vals.forEach(val => {
      const label = document.createElement('label');
      const cb    = document.createElement('input');
      cb.type = 'checkbox'; cb.value = val;
      cb.addEventListener('change', () => {
        cb.checked ? activeFilters[col].add(val) : activeFilters[col].delete(val);
        const has = activeFilters[col].size > 0;
        btn.classList.toggle('active', has);
        btn.querySelector('span').textContent = has ? `${col} (${activeFilters[col].size})` : col;
        applyFilters();
      });
      label.append(cb, document.createTextNode(' ' + val));
      drop.appendChild(label);
    });
    btn.addEventListener('click', e => {
      e.stopPropagation();
      document.querySelectorAll('.filter-dropdown.open').forEach(d => { if (d !== drop) d.classList.remove('open'); });
      drop.classList.toggle('open');
    });
    wrap.append(btn, drop);
    row.appendChild(wrap);
  });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.filter-dropdown.open').forEach(d => d.classList.remove('open'));
});

function applyFilters() {
  const query  = document.getElementById('searchInput').value.toLowerCase();
  const colIdx = parseInt(document.getElementById('searchCol').value);
  filtered = allData.filter(row => {
    const match = colIdx === -1
      ? row.some(c => String(c).toLowerCase().includes(query))
      : String(row[colIdx]).toLowerCase().includes(query);
    if (!match) return false;
    for (const col of FILTERABLE) {
      const set = activeFilters[col];
      if (!set || !set.size) continue;
      const idx = headers.findIndex(h => h.toLowerCase() === col.toLowerCase());
      if (!set.has(row[idx])) return false;
    }
    return true;
  });
  currentPage = 1;
  sortFiltered();
  // Re-find the active row in the new filtered set
  if (activeRowIdx >= 0) {
    // activeRowIdx is now stale — we'll just clear the highlight since filtered changed
    // (keeping it would be complex; user can re-click)
  }
  updatePagination();
  updateFilterOptions();
}

function updateFilterOptions() {
  const query  = document.getElementById('searchInput').value.toLowerCase();
  const colIdx = parseInt(document.getElementById('searchCol').value);
  FILTERABLE.forEach(col => {
    const drop = document.querySelector(`.filter-dropdown[data-col="${col}"]`);
    if (!drop) return;
    const idx = headers.findIndex(h => h.toLowerCase() === col.toLowerCase());
    if (idx === -1) return;
    const candidates = allData.filter(row => {
      const match = colIdx === -1
        ? row.some(c => String(c).toLowerCase().includes(query))
        : String(row[colIdx]).toLowerCase().includes(query);
      if (!match) return false;
      for (const otherCol of FILTERABLE) {
        if (otherCol === col) continue;
        const set = activeFilters[otherCol];
        if (!set || !set.size) continue;
        const oIdx = headers.findIndex(h => h.toLowerCase() === otherCol.toLowerCase());
        if (!set.has(row[oIdx])) return false;
      }
      return true;
    });
    const available = new Set(candidates.map(r => r[idx]).filter(Boolean));
    drop.querySelectorAll('label').forEach(label => {
      const cb = label.querySelector('input[type=checkbox]');
      label.style.display = (available.has(cb.value) || cb.checked) ? '' : 'none';
    });
  });
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.filter-dropdown input[type=checkbox]').forEach(cb => { cb.checked = false; });
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
    btn.querySelector('span').textContent = btn.querySelector('span').textContent.replace(/ \(\d+\)$/, '');
  });
  document.querySelectorAll('.filter-dropdown label').forEach(l => l.style.display = '');
  FILTERABLE.forEach(col => { if (activeFilters[col]) activeFilters[col].clear(); });
  applyFilters();
}

// ── Table rendering ─────────────────────────────────────────────
function renderHeaders() {
  const thead = document.querySelector('#dataTable thead');
  thead.innerHTML = '';
  const tr = document.createElement('tr');
  headers.forEach((h, i) => {
    const th = document.createElement('th');
    th.textContent = h || '#';
    th.onclick = () => sortBy(i);
    if (i === sortCol) th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
    tr.appendChild(th);
  });
  thead.appendChild(tr);
}

function renderRows(rows) {
  const tbody = document.querySelector('#dataTable tbody');
  const empty = document.getElementById('emptyState');
  tbody.innerHTML = '';
  empty.style.display = rows.length ? 'none' : 'block';

  // Offset of this page in filtered[]
  const pageOffset = (currentPage - 1) * rowsPerPage;

  rows.forEach((row, pageIdx) => {
    const filteredIdx = pageOffset + pageIdx;
    const tr = document.createElement('tr');
    const hasYt = colYt >= 0 && row[colYt] && String(row[colYt]).includes('youtu');
    if (hasYt) tr.classList.add('playable');
    if (filteredIdx === activeRowIdx) tr.classList.add('active-row');
    tr.dataset.filteredIdx = filteredIdx;

    row.forEach((cell, i) => {
      const td  = document.createElement('td');
      const col = (headers[i] || '').toLowerCase();

      if (i === colTime && hasYt) {
        // Time cell: show play icon + time
        td.innerHTML = `<span class="play-icon">▶</span>${cell || ''}`;
      } else if ((col.includes('youtube') || col.includes('link')) && cell && String(cell).startsWith('http')) {
        const a = document.createElement('a');
        a.href = cell; a.target = '_blank'; a.rel = 'noopener';
        a.className = 'yt-link';
        a.innerHTML = '▶ Watch';
        a.onclick = e => e.stopPropagation();
        td.appendChild(a);
      } else if (col === 'type' && cell) {
        const span = document.createElement('span');
        span.textContent = cell;
        span.className = 'badge ' + (TYPE_BADGE[cell.toLowerCase()] || '');
        td.appendChild(span);
      } else if ((col === 'possession owner' || col === 'action owner') && cell) {
        const span = document.createElement('span');
        span.textContent = cell;
        span.className = 'team-badge';
        td.appendChild(span);
      } else if (col === 'game' && cell) {
        const span = document.createElement('span');
        span.textContent = cell;
        span.className = 'game-tag';
        td.appendChild(span);
      } else if (col === 'comment' && cell) {
        const lines = cell.split('\n');
        const wrapper = document.createElement('div');
        wrapper.className = 'comment-cell';
        const preview = document.createElement('span');
        preview.textContent = lines[0];
        wrapper.appendChild(preview);
        if (lines.length > 1) {
          const rest = document.createElement('div');
          rest.className = 'comment-rest';
          rest.textContent = lines.slice(1).join('\n');
          const toggle = document.createElement('button');
          toggle.className = 'comment-toggle';
          toggle.textContent = '▾ more';
          toggle.onclick = e => {
            e.stopPropagation();
            const open = rest.classList.toggle('open');
            toggle.textContent = open ? '▴ less' : '▾ more';
          };
          wrapper.append(toggle, rest);
        }
        td.appendChild(wrapper);
      } else {
        td.textContent = cell;
      }
      tr.appendChild(td);
    });

    if (hasYt) {
      tr.onclick = () => playFilteredRow(filteredIdx);
    }
    tbody.appendChild(tr);
  });

  document.querySelector('.table-wrap').scrollTop = 0;
}

// ── Sort ────────────────────────────────────────────────────────
function sortBy(col) {
  sortAsc = (sortCol === col) ? !sortAsc : true;
  sortCol = col;
  sortFiltered();
  renderHeaders();
  updatePagination();
}

function sortFiltered() {
  if (sortCol === -1) return;
  const sample = filtered.find(r => r[sortCol] !== '')?.[sortCol];
  const numeric = sample !== undefined && !isNaN(parseFloat(sample)) && isFinite(sample);
  filtered.sort((a, b) => {
    const va = a[sortCol], vb = b[sortCol];
    if (numeric) return sortAsc ? va - vb : vb - va;
    const sa = (va || '').toLowerCase(), sb = (vb || '').toLowerCase();
    return sortAsc ? sa.localeCompare(sb) : sb.localeCompare(sa);
  });
}

// ── Pagination ──────────────────────────────────────────────────
function updatePagination() {
  const total      = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / rowsPerPage));
  if (currentPage > totalPages) currentPage = totalPages;
  const start = (currentPage - 1) * rowsPerPage;
  const end   = Math.min(start + rowsPerPage, total);
  document.getElementById('rangeStart').textContent   = total ? start + 1 : 0;
  document.getElementById('rangeEnd').textContent     = end;
  document.getElementById('totalRows').textContent    = total;
  document.getElementById('pageIndicator').textContent = `Page ${currentPage} of ${totalPages}`;
  document.getElementById('rowCount').textContent     = `${total} rows`;
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= totalPages;
  renderRows(filtered.slice(start, end));
  updateNavButtons();
}

document.getElementById('rowsPerPage').addEventListener('change', e => { rowsPerPage = +e.target.value; currentPage = 1; updatePagination(); });
document.getElementById('prevBtn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; updatePagination(); } });
document.getElementById('nextBtn').addEventListener('click', () => { const t = Math.ceil(filtered.length / rowsPerPage); if (currentPage < t) { currentPage++; updatePagination(); } });
document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('searchCol').addEventListener('change', applyFilters);

// ── Row playback ─────────────────────────────────────────────────
function playFilteredRow(filteredIdx) {
  const row = filtered[filteredIdx];
  if (!row) return;

  activeRowIdx = filteredIdx;

  // Highlight row
  document.querySelectorAll('#dataTable tbody tr').forEach(tr => {
    tr.classList.toggle('active-row', parseInt(tr.dataset.filteredIdx) === filteredIdx);
  });

  // Parse time
  const timeStr = colTime >= 0 ? (row[colTime] || '') : '';
  const parts   = timeStr.split(':').map(Number);
  const secs    = parts.length === 3 ? parts[0]*3600 + parts[1]*60 + parts[2]
                : parts.length === 2 ? parts[0]*60 + parts[1] : 0;
  const seekTo  = Math.max(0, secs - 5);

  // Extract YouTube video ID
  const ytUrl  = colYt >= 0 ? (row[colYt] || '') : '';
  const m      = ytUrl.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  const videoId = m ? m[1] : null;

  if (videoId) {
    if (videoId !== currentVideoId) {
      currentVideoId  = videoId;
      pendingSeekTime = seekTo;
      loadYTPlayer(videoId, seekTo);
    } else if (ytPlayer && videoReady) {
      ytPlayer.seekTo(seekTo, true);
      ytPlayer.playVideo();
    }
  }

  // Update now-playing card
  updateNowPlaying(row);
  updateNavButtons();
}

function navigateRow(delta) {
  if (filtered.length === 0) return;
  let next = activeRowIdx + delta;
  if (next < 0) next = 0;
  if (next >= filtered.length) next = filtered.length - 1;
  if (next === activeRowIdx) return;

  // Navigate to the correct page if needed
  const targetPage = Math.floor(next / rowsPerPage) + 1;
  if (targetPage !== currentPage) {
    currentPage = targetPage;
    updatePagination(); // re-renders the table
  }

  playFilteredRow(next);

  // Scroll active row into view
  const activeEl = document.querySelector('#dataTable tbody tr.active-row');
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
}

function updateNavButtons() {
  document.getElementById('prevRowBtn').disabled = activeRowIdx <= 0;
  document.getElementById('nextRowBtn').disabled = activeRowIdx < 0 || activeRowIdx >= filtered.length - 1;
}

function updateNowPlaying(row) {
  const empty  = document.getElementById('npEmpty');
  const info   = document.getElementById('npInfo');
  const comment = document.getElementById('npComment');

  empty.style.display = 'none';
  info.style.display  = '';

  const type    = colType    >= 0 ? (row[colType]    || '') : '';
  const name    = colName    >= 0 ? (row[colName]    || '') : '';
  const game    = colGame    >= 0 ? (row[colGame]    || '') : '';
  const time    = colTime    >= 0 ? (row[colTime]    || '') : '';
  const cmmt    = colComment >= 0 ? (row[colComment] || '') : '';
  const poss    = colPoss    >= 0 ? (row[colPoss]    || '') : '';

  info.innerHTML = '';
  if (type) {
    const badge = document.createElement('span');
    badge.className = 'badge ' + (TYPE_BADGE[type.toLowerCase()] || '');
    badge.textContent = type;
    info.appendChild(badge);
  }
  if (name) {
    const s = document.createElement('span');
    s.style.cssText = 'font-size:0.82rem;color:var(--text)';
    s.textContent = name;
    info.appendChild(s);
  }
  if (poss) {
    const s = document.createElement('span');
    s.className = 'team-badge';
    s.style.fontSize = '0.7rem';
    s.textContent = poss;
    info.appendChild(s);
  }
  if (time) {
    const s = document.createElement('span');
    s.className = 'np-time';
    s.textContent = time;
    info.appendChild(s);
  }
  if (game) {
    const s = document.createElement('span');
    s.className = 'np-game';
    s.textContent = game;
    info.appendChild(s);
  }

  if (cmmt) {
    comment.textContent = cmmt;
    comment.style.display = '';
  } else {
    comment.style.display = 'none';
  }
}

// ── YouTube player ───────────────────────────────────────────────
function loadYTPlayer(videoId, seekTime = 0) {
  document.getElementById('noVideoMsg').style.display = 'none';
  document.getElementById('ytContainer').style.display = 'block';
  videoReady = false;
  pendingSeekTime = seekTime;
  if (ytProgressInterval) { clearInterval(ytProgressInterval); ytProgressInterval = null; }

  if (window.YT && YT.Player) {
    createYTPlayer(videoId);
  } else {
    window._ytPendingId = videoId;
    if (!document.getElementById('ytApiScript')) {
      const tag = document.createElement('script');
      tag.id  = 'ytApiScript';
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }
  }
}

window.onYouTubeIframeAPIReady = function() {
  if (window._ytPendingId) { createYTPlayer(window._ytPendingId); window._ytPendingId = null; }
};

function createYTPlayer(videoId) {
  if (ytPlayer) { ytPlayer.destroy(); ytPlayer = null; }
  const container = document.getElementById('ytContainer');
  container.innerHTML = '<div id="ytInner"></div>';
  ytPlayer = new YT.Player('ytInner', {
    videoId,
    width: '100%',
    height: '100%',
    playerVars: { rel: 0, modestbranding: 1 },
    events: {
      onReady: () => {
        videoReady = true;
        const dur = ytPlayer.getDuration();
        document.getElementById('timeDuration').textContent = fmt(dur);
        ['playBtn','skipBk','skipFw','speedSel'].forEach(id => document.getElementById(id).removeAttribute('disabled'));
        if (pendingSeekTime !== null) {
          ytPlayer.seekTo(pendingSeekTime, true);
          ytPlayer.playVideo();
          pendingSeekTime = null;
        }
        ytProgressInterval = setInterval(updateProgress, 250);
      },
      onStateChange: ev => {
        const btn = document.getElementById('playBtn');
        if (ev.data === YT.PlayerState.PLAYING)      btn.textContent = '⏸ Pause';
        else if (ev.data === YT.PlayerState.PAUSED ||
                 ev.data === YT.PlayerState.ENDED)   btn.textContent = '▶ Play';
      }
    }
  });
}

// ── Playback helpers ─────────────────────────────────────────────
function fmt(s) {
  if (!s || isNaN(s)) return '0:00:00';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function togglePlay() {
  if (!ytPlayer || !videoReady) return;
  if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
    ytPlayer.pauseVideo();
  } else {
    ytPlayer.playVideo();
  }
}

function skip(s) {
  if (!ytPlayer || !videoReady) return;
  ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() + s), true);
}

function setSpeed() {
  if (ytPlayer && videoReady) ytPlayer.setPlaybackRate(parseFloat(document.getElementById('speedSel').value));
}

function updateProgress() {
  if (!ytPlayer || !videoReady) return;
  const cur = ytPlayer.getCurrentTime(), dur = ytPlayer.getDuration();
  const pct = dur ? (cur / dur * 100) : 0;
  document.getElementById('seekFill').style.width  = pct + '%';
  document.getElementById('seekThumb').style.left  = pct + '%';
  document.getElementById('timeCurrent').textContent = fmt(cur);
}

// ── Seekbar ──────────────────────────────────────────────────────
function setupSeekbar() {
  const bar = document.getElementById('seekbar');
  let seeking = false;
  function doSeek(e) {
    if (!ytPlayer || !videoReady) return;
    const r   = bar.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    ytPlayer.seekTo(pct * ytPlayer.getDuration(), true);
  }
  bar.addEventListener('mousedown', e => {
    seeking = true; doSeek(e);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', () => {
      seeking = false;
      document.removeEventListener('mousemove', onMove);
    }, { once: true });
  });
  function onMove(e) { if (seeking) doSeek(e); }
}

// ── Resize handle ────────────────────────────────────────────────
function setupResizeHandle() {
  const handle = document.getElementById('resizeHandle');
  const panel  = document.getElementById('videoPanel');
  const split  = document.getElementById('split');
  let dragging = false, startX = 0, startW = 0;

  handle.addEventListener('mousedown', e => {
    dragging = true;
    startX   = e.clientX;
    startW   = panel.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const splitW = split.getBoundingClientRect().width;
    const newW   = Math.max(260, Math.min(splitW * 0.70, startW + (e.clientX - startX)));
    document.documentElement.style.setProperty('--vp-w', newW + 'px');
  });

  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });
}

// ── Keyboard shortcuts ────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === ' ')            { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowLeft')   { skip(-5); }
  if (e.key === 'ArrowRight')  { skip(5); }
  if (e.key === 'ArrowUp')     { e.preventDefault(); navigateRow(-1); }
  if (e.key === 'ArrowDown')   { e.preventDefault(); navigateRow(1); }
});

function enc(s) { return encodeURIComponent(s); }
