<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewer Game — Touch Rugby Analyzer</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="css/theme.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 20px; display: flex; align-items: center; gap: 14px; }
  header .title { font-size: 0.9rem; color: var(--text-muted); }
  header .progress { margin-left: auto; font-size: 0.85rem; color: var(--text-muted); }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h2 { font-size: 1.15rem; margin-bottom: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px; }
  .row { display: flex; align-items: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  .row label { cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .row .count { color: var(--text-dim); font-size: 0.8rem; }
  input[type=number] { width: 80px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 6px 8px; font-size: 0.95rem; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
  .btn { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); cursor: pointer; font-size: 0.95rem; padding: 10px 18px; font-family: inherit; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; font-weight: 600; }
  .note { color: var(--text-muted); font-size: 0.85rem; margin-top: 10px; }
  .note.warn { color: var(--orange); }

  .stage { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; }
  .stage #yt { position: absolute; inset: 0; }
  .stage #yt iframe { width: 100%; height: 100%; border: 0; }
  /* Covers the player so wheel / pinch zoom and drag can be caught (a cross-origin iframe would
     swallow them). A tap on it plays / pauses through the API; YouTube's own controls and seek
     bar are switched off, and the bottom-right corner is left open so "Skip ad" can be clicked. */
  .shield { position: absolute; inset: 0; z-index: 2; touch-action: none; cursor: grab;
            clip-path: polygon(evenodd, 0 0, 100% 0, 100% 100%, 0 100%, 0 0, 62% 50%, 100% 50%, 100% 100%, 62% 100%, 62% 50%); }
  .shield.off { display: none; }
  .overlay { position: absolute; inset: 0; z-index: 3; background: var(--bg); display: flex; flex-direction: column; justify-content: center; padding: 18px; overflow: auto; }
  .overlay[hidden] { display: none; }
  .q { font-size: 1.05rem; font-weight: 600; margin-bottom: 12px; }
  .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 720px) { .opts { grid-template-columns: repeat(2, 1fr); } }
  /* Narrow portrait: the 16:9 box is too short to hold the options, so let it grow. */
  @media (max-width: 720px) and (orientation: portrait) { .stage { aspect-ratio: auto; min-height: 420px; } }
  /* Phone on its side: the video takes most of the screen — as large as the height allows —
     with the buttons in a column beside it and the header reduced to the progress count. */
  @media (orientation: landscape) and (max-height: 520px) {
    main { max-width: none; padding: 6px 8px 4px; }
    header { position: fixed; top: 4px; right: 8px; z-index: 5; padding: 0; background: none; border: 0; }
    header tr-logo, header .title { display: none; }
    #quiz { display: flex; gap: 8px; align-items: flex-start; }
    .vwrap { flex: 1 1 auto; min-width: 0; }
    .stage { width: min(100%, calc((100dvh - 44px) * 16 / 9)); }
    .side { flex: 0 0 112px; }
    .side .actions { flex-direction: column; }
    .side .status { margin: 18px 0 4px; }
    .opts { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .opt { padding: 8px 4px; font-size: 0.85rem; }
    .overlay { padding: 8px 12px; }
    .q { margin-bottom: 6px; font-size: 0.95rem; }
    .feedback { margin-top: 6px; }
    .btn { padding: 6px 10px; font-size: 0.82rem; }
  }
  /* Grip under the video: drag to make it larger or smaller (double-click to reset). */
  .grip { width: 100%; height: 26px; display: flex; justify-content: flex-end; touch-action: none; }
  .grip span { width: 64px; height: 100%; cursor: nwse-resize; color: var(--text-dim); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; user-select: none; }
  .grip span:hover { color: var(--text); }
  .opt { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); cursor: pointer; font-size: 0.95rem; padding: 14px 8px; font-family: inherit; }
  .opt:hover:not(:disabled) { border-color: var(--accent); background: var(--surface-3); }
  .opt:disabled { cursor: default; }
  .opt.right { background: rgba(34,197,94,0.2); border-color: var(--good); }
  .opt.wrong { background: rgba(239,68,68,0.2); border-color: var(--bad); }
  .feedback { margin-top: 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .feedback .msg { font-weight: 600; }
  .feedback .msg.ok { color: var(--good); }
  .feedback .msg.ko { color: var(--bad); }
  .actions { display: flex; gap: 10px; margin-top: 12px; }
  .status { margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); min-height: 1.2em; }

  .score { font-size: 2.4rem; font-weight: 700; margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 0.88rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border-light); vertical-align: top; }
  th { color: var(--text-muted); font-weight: 500; }
  td.bad { color: var(--bad); }
  td.good { color: var(--good); }
  a { color: var(--accent); }
  .view[hidden] { display: none; }
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal[hidden] { display: none; }
  .modal .card { width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; }
  .modal label.radio { display: flex; gap: 8px; align-items: center; margin: 8px 0; cursor: pointer; }
  select, textarea { width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 8px; font-size: 0.95rem; font-family: inherit; margin-top: 6px; }
  textarea { min-height: 80px; resize: vertical; }
  .field-label { display: block; margin-top: 12px; color: var(--text-muted); font-size: 0.85rem; }
  .err { color: var(--bad); font-size: 0.85rem; margin-top: 8px; min-height: 1.1em; }
  .badge { display: inline-block; border-radius: 10px; padding: 1px 8px; font-size: 0.75rem; border: 1px solid var(--border); }
  .badge.open { color: var(--orange); border-color: var(--orange); }
  .badge.resolved { color: var(--good); border-color: var(--good); }
  .badge.dismissed { color: var(--text-dim); }
  tr.click { cursor: pointer; }
  tr.click:hover td { background: var(--surface-2); }
  tr.sel td { background: var(--accent-soft); }
  .fstage { position: relative; width: 100%; max-width: 720px; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; margin: 14px 0; }
  .fstage > div, .fstage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 0.92rem; margin: 6px 0; }
  .kv dt { color: var(--text-muted); }
</style>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/events.js"></script>
<script src="js/player.js"></script>
</head>
<body>
<header>
  <tr-logo></tr-logo>
  <span class="title">Viewer Game</span>
  <span class="progress" id="progress"></span>
</header>

<main>
  <!-- ── Setup ─────────────────────────────────────────── -->
  <section id="setup" class="view card">
    <h2>What do you want to guess?</h2>
    <div class="row">
      <label><input type="checkbox" id="typeTry" checked> Try <span class="count" id="cntTry"></span></label>
      <label><input type="checkbox" id="typePen"> Penalty <span class="count" id="cntPen"></span></label>
      <label title="A touch or turnover that was tagged with the move being run"><input type="checkbox" id="typeMove"> Touch / turnover (move) <span class="count" id="cntMove"></span></label>
    </div>
    <div class="row">
      <label for="nVideos">Number of videos</label>
      <input type="number" id="nVideos" min="1" max="100" value="10">
    </div>
    <div class="row">
      <label for="preSecs">Seconds before</label>
      <input type="number" id="preSecs" min="0" max="120" value="15">
      <label for="postSecs" style="margin-left:14px">after</label>
      <input type="number" id="postSecs" min="0" max="120" value="5">
    </div>
    <div class="row">
      <label><input type="checkbox" id="sound" checked> Sound on</label>
    </div>
    <div class="row">
      <label><input type="checkbox" id="allowReplay" checked> Allow replay before answering</label>
    </div>
    <div class="actions"><button class="btn btn-primary" id="startBtn" disabled>Loading events…</button>
      <button class="btn" id="flagsBtn" hidden>🚩 View flags</button></div>
    <p class="note" id="setupNote"></p>
    <p class="note">Each clip plays once, around the event. Then pick what it was — the move for a try, the reason for a penalty.</p>
  </section>

  <!-- ── Quiz ──────────────────────────────────────────── -->
  <section id="quiz" class="view" hidden>
   <div class="vwrap">
    <div class="stage">
      <div id="yt"></div>
      <div class="shield" id="shield"></div>
      <div class="overlay" id="overlay" hidden>
        <div class="q" id="question"></div>
        <div class="opts" id="opts"></div>
        <div class="feedback" id="feedback" hidden>
          <span class="msg" id="fbMsg"></span>
          <button class="btn btn-primary" id="nextBtn">Next →</button>
        </div>
        <div class="actions" id="replayRow"><button class="btn" id="replayBtn">↺ Review the clip</button></div>
      </div>
    </div>
    <div class="grip" id="gripRow"><span id="grip" title="Drag to resize the video · double-click to reset" aria-label="Resize video">⇲</span></div>
   </div>
   <div class="side">
    <div class="status" id="status"></div>
    <div class="actions">
      <button class="btn" id="skipBtn">Skip clip ⏭</button>
      <button class="btn" id="swapBtn" title="Poor quality or unusable? Swap in a different clip">🔄 Replace clip</button>
      <button class="btn" id="flagBtn" title="Report an unusable clip or a wrong answer">🚩 Flag</button>
    </div>
   </div>
  </section>

  <!-- ── Result ────────────────────────────────────────── -->
  <section id="result" class="view card" hidden>
    <div class="score" id="scoreLine"></div>
    <p class="note" id="scoreNote"></p>
    <div id="wrongWrap"></div>
    <div class="actions" style="margin-top:18px">
      <button class="btn btn-primary" id="againBtn">Play again</button>
      <a class="btn" href="index.html" style="text-decoration:none">Menu</a>
    </div>
  </section>

  <!-- ── Flags (admin) ─────────────────────────────────── -->
  <section id="flags" class="view card" hidden>
    <h2>Flags</h2>
    <div class="row">
      <label for="flagFilter">Show</label>
      <select id="flagFilter" style="width:auto"><option value="open">Open</option><option value="all">All</option><option value="resolved">Resolved</option><option value="dismissed">Dismissed</option></select>
      <button class="btn" id="flagsRefresh">↻ Refresh</button>
      <button class="btn" id="flagsBack">← Back</button>
    </div>
    <p class="note" id="flagsNote"></p>
    <div id="flagsTable"></div>
    <div id="flagDetail" hidden>
      <div class="fstage"><div id="fyt"></div></div>
      <dl class="kv" id="flagKv"></dl>
      <div class="actions" id="flagActions"></div>
    </div>
  </section>
</main>

<!-- ── Flag dialog ───────────────────────────────────── -->
<div class="modal" id="flagModal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="flagTitle">
    <h2 id="flagTitle">Flag this clip</h2>
    <label class="radio"><input type="radio" name="flagReason" value="unusable" checked> Unusable video <span class="count">(wrong footage, poor quality…)</span></label>
    <label class="radio"><input type="radio" name="flagReason" value="wrong_answer"> Wrong answer <span class="count">(the recorded answer is not what happens)</span></label>
    <div id="flagProposeWrap" hidden>
      <label class="field-label" for="flagPropose">What is the right answer?</label>
      <select id="flagPropose"></select>
      <p class="note" id="flagCurrent"></p>
    </div>
    <label class="field-label" for="flagComment">Comment (optional)</label>
    <textarea id="flagComment" maxlength="500" placeholder="What is wrong with it?"></textarea>
    <div class="err" id="flagErr"></div>
    <div class="actions"><button class="btn btn-primary" id="flagSend">Send flag</button><button class="btn" id="flagCancel">Cancel</button></div>
  </div>
</div>

<script>
TR.auth('admin', { allow: ['tester'] });

let PRE = 15, POST = 5;               // seconds of footage before / after the event (set at start)
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem('trl2_' + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('trl2_' + k, JSON.stringify(v)); return true; } catch { return false; } },
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const toSecs = s => { const p = String(s || '').split(':').map(Number); return p.some(isNaN) ? NaN : p.length === 3 ? p[0] * 3600 + p[1] * 60 + p[2] : p.length === 2 ? p[0] * 60 + p[1] : NaN; };

// ── Data ────────────────────────────────────────────────────────
let meta = {};            // game name → list entry (youtubelink, videoOffset…)
let pool = [];            // every event that can be asked about

// What can be asked: a Try is guessed by its move (its Name), a penalty by its
// Name. Anything we couldn't offer as one of the choices is left out.
const TRY_MOVES = () => TR.STRIKE_MOVES.filter(m => !TR.EXCLUDED_MOVES.includes(m));
const PEN_TYPES = ['Penalty Attack', 'Penalty Defence'];
// kind: 'try' (guess the move), 'pen' (guess the reason), 'move' (a touch or
// turnover tagged with the move it was running — guess that move).
const MOVE_TYPES = ['Touch', 'Turnover'];
function choicesFor(ev) {
  if (ev.kind === 'pen') return (TR.MENU[ev.type] || []).slice();
  return TRY_MOVES();
}

function ingest(rows) {
  pool = [];
  if (!rows || rows.length < 2) return;
  const h = rows[0].map(x => String(x).trim().toLowerCase()), I = n => h.indexOf(n);
  const c = { t: I('time'), ty: I('type'), nm: I('name'), g: I('game'), sm: I('strike move') };
  rows.slice(1).forEach(r => {
    const game = r[c.g], type = (r[c.ty] || '').trim(), name = (r[c.nm] || '').trim();
    if (!game) return;
    const kind = type === 'Try' ? 'try' : PEN_TYPES.includes(type) ? 'pen' : MOVE_TYPES.includes(type) ? 'move' : null;
    if (!kind) return;
    const m = meta[game];
    if (!m || !TR.extractVideoId(m.youtubelink)) return;
    const secs = toSecs(r[c.t]);
    if (isNaN(secs)) return;
    // What the viewer is asked to name: a try's move is its Name, a penalty's
    // reason is its Name, a touch or turnover carries the move in Strike Move.
    const answer = kind === 'move' ? (c.sm >= 0 ? (r[c.sm] || '').trim() : '') : name;
    const ev = { game, type, name, kind, answer, secs, timeStr: r[c.t] };
    if (!choicesFor(ev).includes(answer) || answer === 'Other') return;
    if (!TR.player.hasVideoAt(m, secs)) return;
    pool.push(ev);
  });
}

function eligible() {
  const on = { try: $('typeTry').checked, pen: $('typePen').checked, move: $('typeMove').checked };
  return pool.filter(e => on[e.kind]);
}
function refreshSetup() {
  $('cntTry').textContent = `(${pool.filter(e => e.kind === 'try').length} with video)`;
  $('cntPen').textContent = `(${pool.filter(e => e.kind === 'pen').length} with video)`;
  $('cntMove').textContent = `(${pool.filter(e => e.kind === 'move').length} with video)`;
  const n = eligible().length, btn = $('startBtn');
  btn.disabled = n === 0;
  btn.textContent = n ? 'Start' : (pool.length ? 'Pick at least one type' : 'No events with video');
  const want = parseInt($('nVideos').value, 10) || 0;
  $('setupNote').textContent = n && want > n ? `Only ${n} available — you'll get ${n}.` : '';
  $('setupNote').className = 'note' + (n && want > n ? ' warn' : '');
}

async function load() {
  const ca = LS.get('all'), cl = LS.get('list');
  if (cl) cl.sheets.forEach(s => { meta[s.name] = s; });
  if (ca) { ingest(ca.rows); refreshSetup(); }
  try {
    const have = c => c && c.version != null ? `&have=${TR.enc(String(c.version))}` : '';
    const api = q => fetch(`${TR.APPS_SCRIPT_URL}?secret=${TR.enc(TR.secret())}&${q}`, { cache: 'no-store' }).then(r => r.json());
    const [ar, lr] = await Promise.all([api('action=all' + have(ca)), api('action=list' + have(cl))]);
    if (!ar.ok) throw new Error(ar.error);
    if (lr.ok && !lr.unchanged) { LS.set('list', lr); meta = {}; lr.sheets.forEach(s => { meta[s.name] = s; }); }
    if (!ar.unchanged) { if (!LS.set('all', ar)) try { localStorage.removeItem('trl2_all'); } catch {} }
    const rows = ar.unchanged ? (ca && ca.rows) : ar.rows;
    ingest(rows); refreshSetup();
  } catch (err) {
    if (!ca) { $('startBtn').textContent = 'Could not load events'; $('setupNote').textContent = err.message; $('setupNote').className = 'note warn'; }
    else { $('setupNote').textContent = 'Couldn’t refresh — using saved data.'; }
  }
}

// ── Quiz state ──────────────────────────────────────────────────
let sound = true;
let skipped = new Set();   // events swapped out as unusable — never offered again
let clips = [], idx = 0, results = [], allowReplay = true;
let player = null, curVideo = null, poll = null, answered = false;

function show(view) { ['setup', 'quiz', 'result', 'flags'].forEach(v => $(v).hidden = v !== view); }

function start() {
  const want = Math.max(1, parseInt($('nVideos').value, 10) || 10);
  clips = shuffle(eligible()).slice(0, want);
  allowReplay = $('allowReplay').checked;
  PRE  = TR.player.clampWindow($('preSecs').value, 15);
  POST = TR.player.clampWindow($('postSecs').value, 5);
  skipped = new Set();
  sound = $('sound').checked;
  idx = 0; results = [];
  show('quiz');
  playClip();
}

function stopPoll() { if (poll) { clearInterval(poll); poll = null; } }

// Plays the current event's footage once, then hands over to the question.
function playClip(isReplay) {
  const ev = clips[idx], m = meta[ev.game];
  const vt = TR.player.videoTimeAt(m, ev.secs);
  const from = Math.max(0, vt - PRE), to = vt + POST;
  $('progress').textContent = `${idx + 1} / ${clips.length}`;
  if (!isReplay && window.resetZoom) resetZoom();
  $('overlay').hidden = true;
  $('shield').classList.remove('off');
  $('status').textContent = isReplay ? 'Replaying…' : 'Watch carefully…';
  answered = false;
  $('skipBtn').hidden = false;
  $('swapBtn').hidden = false;
  stopPoll();

  let armed = false, begun = Date.now();
  const startPoll = () => {
    stopPoll();
    poll = setInterval(() => {
      if (!player || !player.ready) return;
      const t = player.getTime();
      // Armed once the player has actually landed in the window — a replay
      // starts with the clock still past the end from last time.
      // Unarmed for 4 s while paused means autoplay was blocked.
      if (!armed) {
        if (t >= from - 2 && t < to) armed = true;
        else if (Date.now() - begun > 4000 && player.isPaused()) $('status').textContent = 'Click the video to start the clip.';
        return;
      }
      if (t < from - 1.5) { player.seek(from); return; }   // rewound past the start of the clip
      if (t >= to) finishClip();
    }, 200);
  };
  const go = () => { if (player.setMuted) player.setMuted(!sound);   // absent on a stale cached player.js
     player.seek(from); player.play(); startPoll(); };

  const vid = TR.extractVideoId(m.youtubelink);
  if (player && vid === curVideo && player.ready) go();
  else {
    if (player) { player.destroy(); player = null; }
    curVideo = vid;
    player = TR.player.create({ provider: 'youtube', container: $('yt'), videoId: vid, onReady: go,
      // No seek bar or controls, no keyboard seeking, no fullscreen: nothing to rewind with or copy a link from.
      playerVars: { controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3 },
      onStateChange: s => { if (s === 'ended') finishClip(); } });
  }
}

let finishing = false;
function finishClip() {
  stopPoll();
  if (finishing) return; finishing = true;
  try { player && player.pause(); } catch (e) {}
  $('shield').classList.remove('off');
  $('skipBtn').hidden = true;
  $('status').textContent = '';
  askQuestion();
  finishing = false;
}

function askQuestion() {
  const ev = clips[idx];
  answered = false;
  // Try: the right move plus 7 others. Penalty: its full list of 8 reasons.
  // The set is drawn once per clip; a review shows the same set, reshuffled.
  if (!ev.optSet) ev.optSet = ev.kind !== 'pen'
    ? [ev.answer, ...shuffle(TRY_MOVES().filter(m => m !== ev.answer)).slice(0, 7)]
    : choicesFor(ev);
  const opts = shuffle(ev.optSet);
  $('question').textContent = ev.kind === 'try' ? 'Which move was this try scored from?'
    : ev.kind === 'move' ? `Which move was being run when this ended in a ${ev.type === 'Touch' ? 'touch' : 'turnover'}?`
    : `What was the ${ev.type === 'Penalty Attack' ? 'attack' : 'defence'} penalty for?`;
  const box = $('opts');
  box.innerHTML = opts.map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('');
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b.dataset.v));
  $('feedback').hidden = true;
  $('replayRow').hidden = !allowReplay;
  $('overlay').hidden = false;
}

function answer(choice) {
  if (answered) return;
  answered = true;
  $('swapBtn').hidden = true;
  const ev = clips[idx], ok = choice === ev.answer;
  results.push({ ev, choice, ok });
  document.querySelectorAll('#opts .opt').forEach(b => {
    b.disabled = true;
    if (b.dataset.v === ev.answer) b.classList.add('right');
    else if (b.dataset.v === choice) b.classList.add('wrong');
  });
  $('replayRow').hidden = true;
  const msg = $('fbMsg');
  msg.className = 'msg ' + (ok ? 'ok' : 'ko');
  msg.textContent = ok ? '✓ Correct!' : `✗ It was: ${ev.answer}`;
  $('nextBtn').textContent = idx + 1 < clips.length ? 'Next →' : 'See score';
  $('feedback').hidden = false;
}

// Swaps the current clip for an unseen one of the chosen types. It leaves no
// trace in the score. With nothing left to swap in, the clip is just dropped.
function replaceClip() {
  if (answered) return;
  dropCurrent();
}

// Takes the current clip out of the quiz (and its score, if already answered)
// and puts an unseen one in its place — or just shortens the quiz if none is left.
function dropCurrent() {
  stopPoll();
  try { player && player.pause(); } catch (e) {}
  const gone = clips[idx];
  results = results.filter(r => r.ev !== gone);
  skipped.add(gone);
  const fresh = shuffle(eligible().filter(e => !clips.includes(e) && !skipped.has(e)))[0];
  if (fresh) clips[idx] = fresh;
  else {
    clips.splice(idx, 1);
    if (idx >= clips.length) { showResult(); return; }
  }
  playClip();
}

function next() {
  idx++;
  if (idx < clips.length) playClip(); else showResult();
}

function showResult() {
  stopPoll();
  if (player) { player.destroy(); player = null; curVideo = null; }
  $('progress').textContent = '';
  const good = results.filter(r => r.ok).length, wrong = results.filter(r => !r.ok);
  $('scoreLine').textContent = `${good} / ${results.length}`;
  $('scoreNote').textContent = wrong.length ? 'Here is what you missed:' : 'Perfect score!';
  $('wrongWrap').innerHTML = wrong.length ? `<table><thead><tr><th>Game</th><th>Time</th><th>Your answer</th><th>Right answer</th><th></th></tr></thead><tbody>` +
    wrong.map(r => {
      const m = meta[r.ev.game] || { name: r.ev.game };
      const link = TR.player.seekLink(m, r.ev.secs);
      return `<tr><td>${esc(TR.sheetNameToLabel(m))}<br><span class="count">${esc(r.ev.type)}${r.ev.kind === 'move' ? ' (move)' : ''}</span></td><td>${esc(r.ev.timeStr)}</td>` +
        `<td class="bad">${esc(r.choice)}</td><td class="good">${esc(r.ev.answer)}</td>` +
        `<td>${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">Watch</a>` : ''}</td></tr>`;
    }).join('') + '</tbody></table>' : '';
  show('result');
}


// ── Flagging ────────────────────────────────────────────────────
// A flag is a report, not an edit: it goes to the _flags sheet and the admin
// decides. Either way the clip leaves this quiz and a fresh one takes its place.
const allAnswersFor = ev => ev.kind === 'pen' ? (TR.MENU[ev.type] || []).slice() : TR.STRIKE_MOVES.slice();
const questionOf = ev => ev.kind === 'try' ? 'Which move was this try scored from?'
  : ev.kind === 'move' ? `Which move was being run when this ended in a ${ev.type === 'Touch' ? 'touch' : 'turnover'}?`
  : `What was the ${ev.type === 'Penalty Attack' ? 'attack' : 'defence'} penalty for?`;
let flagResume = false;

function openFlag() {
  const ev = clips[idx]; if (!ev) return;
  // Pause a clip that is still playing; Cancel picks it up again.
  flagResume = !answered && $('overlay').hidden && player && player.ready && !player.isPaused();
  if (flagResume) player.pause();
  document.querySelector('input[name=flagReason][value=unusable]').checked = true;
  $('flagPropose').innerHTML = '<option value="">— pick the right answer —</option>' + allAnswersFor(ev).map(a => `<option>${esc(a)}</option>`).join('');
  // The recorded answer is only shown once the player has answered, or flagging would give it away.
  $('flagCurrent').textContent = answered ? `Recorded answer: ${ev.answer}` : '';
  $('flagProposeWrap').hidden = true; $('flagComment').value = ''; $('flagErr').textContent = '';
  $('flagSend').disabled = false; $('flagSend').textContent = 'Send flag';
  $('flagModal').hidden = false;
}
function closeFlag(resume) {
  $('flagModal').hidden = true;
  if (resume && flagResume && player) player.play();
  flagResume = false;
}
async function sendFlag() {
  const ev = clips[idx], reason = document.querySelector('input[name=flagReason]:checked').value;
  const proposed = $('flagPropose').value;
  if (reason === 'wrong_answer' && !proposed) { $('flagErr').textContent = 'Pick the answer you think is right.'; return; }
  $('flagSend').disabled = true; $('flagSend').textContent = 'Sending…'; $('flagErr').textContent = '';
  try {
    const res = await TR.postJson(TR.APPS_SCRIPT_URL, {
      secret: TR.secret(), action: 'save_flag', reason, game: ev.game, time: ev.timeStr, gameSecs: ev.secs,
      eventType: ev.type, eventName: ev.name, question: questionOf(ev), currentAnswer: ev.answer,
      proposedAnswer: reason === 'wrong_answer' ? proposed : '', comment: $('flagComment').value,
    });
    if (!res.ok) throw new Error(res.error || 'The server refused the flag.');
  } catch (err) {
    $('flagErr').textContent = 'Could not send the flag: ' + err.message;
    $('flagSend').disabled = false; $('flagSend').textContent = 'Try again';
    return;
  }
  flagResume = false; closeFlag(false);
  dropCurrent();
}

// ── Flags view (admin) ──────────────────────────────────────────
let flagList = [], fplayer = null, selFlag = null;
const flagKey = f => `${f['Game']}|${f['Game Secs']}|${f['Event Type']}`;
const flagLabel = f => TR.sheetNameToLabel(meta[f['Game']] || { name: f['Game'] });

async function loadFlags() {
  $('flagsNote').textContent = 'Loading…';
  try {
    const r = await fetch(`${TR.APPS_SCRIPT_URL}?secret=${TR.enc(TR.secret())}&action=list_flags`, { cache: 'no-store' }).then(x => x.json());
    if (!r.ok) throw new Error(r.error);
    flagList = r.flags; $('flagsNote').textContent = '';
  } catch (err) { flagList = []; $('flagsNote').textContent = 'Could not load flags: ' + err.message; }
  renderFlags();
}
function renderFlags() {
  const want = $('flagFilter').value, counts = {};
  flagList.forEach(f => { counts[flagKey(f)] = (counts[flagKey(f)] || 0) + 1; });
  const rows = flagList.filter(f => want === 'all' || f['Status'] === want).slice().reverse();
  $('flagsTable').innerHTML = rows.length ? `<table><thead><tr><th>When</th><th>Game / event</th><th>Reason</th><th>Recorded → proposed</th><th>By</th><th>Status</th></tr></thead><tbody>` +
    rows.map(f => `<tr class="click${selFlag === f['Flag Id'] ? ' sel' : ''}" data-id="${esc(f['Flag Id'])}">` +
      `<td>${esc(f['Flagged At'].slice(0, 16).replace('T', ' '))}</td>` +
      `<td>${esc(flagLabel(f))}<br><span class="count">${esc(f['Event Type'])} · ${esc(f['Time'])}${counts[flagKey(f)] > 1 ? ` · ×${counts[flagKey(f)]} flags` : ''}</span></td>` +
      `<td>${f['Reason'] === 'unusable' ? 'Unusable' : 'Wrong answer'}${f['Comment'] ? ' 💬' : ''}</td>` +
      `<td>${f['Reason'] === 'wrong_answer' ? `<span style="color:var(--bad)">${esc(f['Current Answer'])}</span> → <span style="color:var(--good)">${esc(f['Proposed Answer'])}</span>` : '—'}</td>` +
      `<td>${esc(f['Flagged By'] || f['Role'])}</td><td><span class="badge ${esc(f['Status'])}">${esc(f['Status'])}</span></td></tr>`).join('') + '</tbody></table>'
    : '<p class="note">No flags to show.</p>';
  $('flagsTable').querySelectorAll('tr.click').forEach(tr => tr.onclick = () => openFlagDetail(tr.dataset.id));
}
function closeFlagPlayer() { if (fplayer) { fplayer.destroy(); fplayer = null; } }
function openFlagDetail(id) {
  const f = flagList.find(x => x['Flag Id'] === id); if (!f) return;
  selFlag = id; renderFlags();
  const m = meta[f['Game']], pre = TR.player.clampWindow($('preSecs').value, 15), post = TR.player.clampWindow($('postSecs').value, 5);
  $('flagDetail').hidden = false;
  closeFlagPlayer();
  if (m && TR.extractVideoId(m.youtubelink)) {
    const vt = TR.player.videoTimeAt(m, Number(f['Game Secs'])), from = Math.max(0, vt - pre);
    fplayer = TR.player.create({ provider: 'youtube', container: $('fyt'), videoId: TR.extractVideoId(m.youtubelink),
      onReady: () => { fplayer.seek(from); fplayer.play(); } });
  } else $('fyt').innerHTML = '<p class="note" style="padding:20px">No video for this game.</p>';
  const kv = [['Game', flagLabel(f)], ['Event', `${f['Event Type']} · ${f['Time']}`], ['Question', f['Question']],
    ['Old answer', f['Current Answer']], ['Proposed answer', f['Reason'] === 'wrong_answer' ? f['Proposed Answer'] : '(video flagged as unusable)'],
    ['Comment', f['Comment'] || '—'], ['Flagged', `${f['Flagged At'].slice(0, 16).replace('T', ' ')} by ${f['Flagged By'] || f['Role']}`], ['Status', f['Status']]];
  $('flagKv').innerHTML = kv.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  $('flagActions').innerHTML = ['resolved', 'dismissed', 'open'].filter(st => st !== f['Status'])
    .map(st => `<button class="btn" data-st="${st}">${st === 'open' ? 'Reopen' : st === 'resolved' ? '✓ Mark resolved' : 'Dismiss'}</button>`).join('');
  $('flagActions').querySelectorAll('button').forEach(b => b.onclick = () => setFlagStatus(f, b.dataset.st, b));
  $('flagDetail').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
async function setFlagStatus(f, status, btn) {
  btn.disabled = true;
  try {
    const r = await TR.postJson(TR.APPS_SCRIPT_URL, { secret: TR.secret(), action: 'update_flag_status', id: f['Flag Id'], status });
    if (!r.ok) throw new Error(r.error);
    f['Status'] = status; renderFlags(); openFlagDetail(f['Flag Id']);
  } catch (err) { $('flagsNote').textContent = 'Could not update: ' + err.message; btn.disabled = false; }
}

// ── Resize: drag the grip under the video ───────────────────────
// Sets the stage width in px (height follows from 16:9) and remembers it. With
// nothing stored the CSS default applies — full width, or on a phone held
// sideways as large as the screen's height allows.
(function setupResize() {
  const stage = document.querySelector('.stage'), grip = $('grip'), KEY = 'tr.vg.stageW';
  const maxW = () => stage.parentElement.clientWidth;
  const setW = w => { stage.style.width = Math.round(Math.min(maxW(), Math.max(240, w))) + 'px'; };
  try { const w = +localStorage.getItem(KEY); if (w >= 240) { stage.style.width = w + 'px'; } } catch (e) {}
  let drag = null;
  grip.addEventListener('pointerdown', e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    drag = { x: e.clientX, y: e.clientY, w: r.width };
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener('pointermove', e => {
    if (!drag) return;
    // How far it moved: across, or down (a pixel down is 16/9 pixels of width). The bigger move wins.
    const dx = e.clientX - drag.x, dy = (e.clientY - drag.y) * 16 / 9;
    setW(drag.w + (Math.abs(dx) >= Math.abs(dy) ? dx : dy));
  });
  const end = () => {
    if (!drag) return; drag = null;
    try { localStorage.setItem(KEY, String(stage.clientWidth)); } catch (e) {}
    if (window.resetZoom) resetZoom();
  };
  grip.addEventListener('pointerup', end); grip.addEventListener('pointercancel', end);
  grip.addEventListener('dblclick', () => {
    stage.style.width = ''; try { localStorage.removeItem(KEY); } catch (e) {}
  });
  window.addEventListener('resize', () => { if (stage.style.width && stage.clientWidth > maxW()) stage.style.width = ''; });
})();

// ── Zoom: wheel / pinch, drag to pan, double-click to reset ─────
// Scales the video inside the stage; the stage clips it. Only while a clip is
// on screen — the question overlay sits above and takes the pointer itself.
(function setupZoom() {
  const stage = document.querySelector('.stage'), yt = $('yt'), pts = new Map();
  let k = 1, x = 0, y = 0, pinch = null;
  const apply = () => { yt.style.transform = `translate(${x}px,${y}px) scale(${k})`; };
  const clamp = () => {
    const w = stage.clientWidth, h = stage.clientHeight;
    x = Math.min(0, Math.max(w - w * k, x)); y = Math.min(0, Math.max(h - h * k, y));
  };
  // Zoom to scale nk keeping the stage point (cx, cy) fixed under the finger/cursor.
  const zoomAt = (nk, cx, cy) => {
    nk = Math.min(6, Math.max(1, nk));
    x = cx - (cx - x) * nk / k; y = cy - (cy - y) * nk / k; k = nk;
    if (k === 1) { x = 0; y = 0; }
    clamp(); apply();
  };
  window.resetZoom = () => { k = 1; x = 0; y = 0; pts.clear(); pinch = null; apply(); };
  const local = e => { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const live = () => $('overlay').hidden;
  stage.addEventListener('wheel', e => {
    if (!live()) return;
    e.preventDefault();
    const [cx, cy] = local(e);
    zoomAt(k * Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0025)), cx, cy);   // ctrl = trackpad pinch
  }, { passive: false });
  stage.addEventListener('pointerdown', e => {
    if (!live()) return;
    pts.set(e.pointerId, local(e));
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), k }; }
  });
  stage.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const [nx, ny] = local(e), [ox, oy] = pts.get(e.pointerId);
    pts.set(e.pointerId, [nx, ny]);
    if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()];
      zoomAt(pinch.k * Math.hypot(a[0] - b[0], a[1] - b[1]) / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2);
    } else if (pts.size === 1 && k > 1) { x += nx - ox; y += ny - oy; clamp(); apply(); }
  });
  // A tap (one finger or click, hardly moved, quick) plays / pauses the clip.
  let tap = null;
  stage.addEventListener('pointerdown', e => { tap = pts.size === 1 && live() ? { t: Date.now(), x: e.clientX, y: e.clientY } : null; });
  const up = e => {
    if (tap && pts.size === 1 && e.type === 'pointerup' && Date.now() - tap.t < 300 &&
        Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 8 && player && player.ready) {
      if (player.isPaused()) player.play(); else player.pause();
    }
    tap = null; pts.delete(e.pointerId); pinch = null;
  };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('dblclick', () => { if (live()) resetZoom(); });
})();

$('startBtn').onclick = start;
$('nextBtn').onclick = next;
$('replayBtn').onclick = () => playClip(true);
$('skipBtn').onclick = finishClip;
$('swapBtn').onclick = replaceClip;
$('flagBtn').onclick = openFlag;
$('flagCancel').onclick = () => closeFlag(true);
$('flagSend').onclick = sendFlag;
document.querySelectorAll('input[name=flagReason]').forEach(r => r.onchange = () => { $('flagProposeWrap').hidden = r.value !== 'wrong_answer' || !r.checked; });
if (TR.role() === 'admin') $('flagsBtn').hidden = false;
$('flagsBtn').onclick = () => { show('flags'); $('flagDetail').hidden = true; selFlag = null; loadFlags(); };
$('flagsBack').onclick = () => { closeFlagPlayer(); show('setup'); };
$('flagsRefresh').onclick = loadFlags;
$('flagFilter').onchange = renderFlags;
$('againBtn').onclick = () => { show('setup'); refreshSetup(); };
['typeTry', 'typePen', 'typeMove', 'nVideos'].forEach(id => $(id).addEventListener('input', refreshSetup));
load();
</script>
</body>
</html>
