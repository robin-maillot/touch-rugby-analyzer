<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Replay — Touch Rugby Analyzer</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Touch Rugby">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="cb7fd4f2-fcd5-44d7-a8e4-70e9068870bb" data-auto-track="false"></script>
  <link rel="stylesheet" href="css/theme.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
    .header-sep { width: 1px; height: 22px; background: var(--border); }
    #gameSelect { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 0.85rem; max-width: min(420px, 100%); flex: 1 1 220px; }
    #status { font-size: 0.78rem; color: var(--text-muted); }
    #status.warn { color: var(--yellow); }

    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .empty { color: var(--text-muted); text-align: center; padding: 60px 16px; font-size: 0.95rem; }
    .stage { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }

    .pitch { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; }
    .pitch svg { display: block; width: 100%; max-height: calc(100vh - 210px); }
    .attack-key { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-muted); padding: 2px 4px 8px; }
    .attack-key i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }

    .panel { display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
    .score .team { font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
    .score .team span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .score .team.r { justify-content: flex-end; text-align: right; }
    .score .team i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .score .nums { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .clock { text-align: center; font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; font-variant-numeric: tabular-nums; }

    .set-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 0.8rem; color: var(--text-muted); }
    .set-head b { color: var(--text); font-size: 0.95rem; }
    .touch-dots { display: flex; gap: 5px; margin: 10px 0 6px; }
    .touch-dots span { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-3); }
    .touch-dots span.on { background: var(--accent); }
    .outcome { font-size: 0.82rem; font-weight: 600; min-height: 1.2em; }
    .outcome.try { color: var(--green); } .outcome.error { color: var(--orange); }
    .outcome.pen { color: var(--yellow); } .outcome.sixth { color: var(--text-muted); }

    .steps { list-style: none; max-height: 220px; overflow-y: auto; font-size: 0.78rem; margin-top: 8px; border-top: 1px solid var(--border-light); }
    .steps li { display: flex; gap: 8px; padding: 4px 2px; border-bottom: 1px solid var(--border-light); color: var(--text-dim); }
    .steps li.done { color: var(--text-muted); }
    .steps li.now { color: var(--text); font-weight: 600; }
    .steps .t { width: 44px; font-variant-numeric: tabular-nums; flex: none; }
    .steps .m { margin-left: auto; font-variant-numeric: tabular-nums; }

    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .controls button { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; height: 38px; min-width: 42px; padding: 0 12px; font-size: 0.95rem; cursor: pointer; touch-action: manipulation; }
    .controls button:hover { border-color: var(--accent); }
    .controls button.play { min-width: 64px; background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
    .speeds { display: flex; gap: 4px; margin-left: auto; }
    .speeds button { min-width: 38px; height: 30px; font-size: 0.75rem; padding: 0 6px; }
    .speeds button.on { border-color: var(--accent); color: #fff; background: var(--accent-soft); }
    .scrub { width: 100%; margin-top: 10px; accent-color: var(--accent); }
    .hint { font-size: 0.7rem; color: var(--text-dim); margin-top: 6px; }
    @media (max-width: 820px) {
      .stage { grid-template-columns: 1fr; gap: 10px; }
      .pitch svg { max-height: 46vh; }
      main { padding: 10px; }
      #status { display: none; }
      header { gap: 8px; padding: 8px 10px; }
      .card.ctl { order: -1; }            /* controls straight under the field */
      .steps { max-height: 150px; }
    }
  </style>
  <script src="js/config.js"></script>
  <script src="js/events.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/replay.js"></script>
</head>
<body>
<header>
  <tr-logo></tr-logo>
  <div class="header-sep"></div>
  <select id="gameSelect" onchange="pickGame(this.value)" aria-label="Game to replay"><option value="">Loading games…</option></select>
  <span id="status"></span>
  <button id="navToggle" class="nav-toggle" onclick="toggleNavMenu()" aria-label="Open page menu" aria-expanded="false" aria-controls="headerNav" aria-haspopup="true">☰</button>
  <nav class="header-nav" id="headerNav">
    <a href="games.html">Games</a>
    <a href="game.html">Events</a>
    <a href="replay.html" class="active">Replay</a>
    <a href="analytics.html">Analytics</a>
  </nav>
</header>

<main>
  <div id="empty" class="empty">Loading games…</div>
  <div id="stage" class="stage" style="display:none">
    <div class="pitch">
      <div class="attack-key"><span id="keyUp"></span><span id="keyDown"></span></div>
      <svg id="field" viewBox="-4 -18 108 176" preserveAspectRatio="xMidYMid meet" aria-label="Field replay"></svg>
    </div>
    <div class="panel">
      <div class="card">
        <div class="score">
          <div class="team"><i style="background:var(--t1)"></i><span id="name1"></span></div>
          <div class="nums" id="score">0 – 0</div>
          <div class="team r"><span id="name2"></span><i style="background:var(--t2)"></i></div>
        </div>
        <div class="clock" id="clock"></div>
      </div>
      <div class="card">
        <div class="set-head"><b id="setTeam"></b><span id="setNo"></span></div>
        <div class="touch-dots" id="dots"></div>
        <div class="outcome" id="outcome"></div>
        <ol class="steps" id="steps"></ol>
      </div>
      <div class="card ctl">
        <div class="controls">
          <button onclick="stepSet(-1)" title="Previous set (←)" aria-label="Previous set">⏮</button>
          <button class="play" id="playBtn" onclick="togglePlay()" title="Play / pause (space)">▶</button>
          <button onclick="stepSet(1)" title="Next set (→)" aria-label="Next set">⏭</button>
          <div class="speeds" id="speeds"></div>
        </div>
        <input type="range" class="scrub" id="scrub" min="0" max="1" step="0.1" value="0" oninput="seek(+this.value)" aria-label="Game time">
        <div class="hint">Space play / pause · ← → previous / next set · the ball's path between tagged touches is estimated from their times</div>
      </div>
    </div>
  </div>
</main>

<script src="js/nav.js"></script>
<script>
TR.auth('viewer');
const R = TR.Replay;
document.documentElement.style.setProperty('--t1', '#3b82f6');
document.documentElement.style.setProperty('--t2', '#f59e0b');
const COLOR = { 'Team 1': '#3b82f6', 'Team 2': '#f59e0b' };
const SPEEDS = [1, 2, 4, 8];
const LEN = 140;                         // 70 m × 50 m → 140 × 100 units
const vy = y => (100 - y) / 100 * LEN;   // y 100 (Team 1's attack) at the top
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mmss = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

const LS = {
  get(k) { try { return JSON.parse(localStorage.getItem('trl2_' + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('trl2_' + k, JSON.stringify(v)); return true; } catch { return false; } },
};

// ── Data ───────────────────────────────────────────────────────
let byGame = {};          // game name → its events, from action=all
let meta = {};            // game name → list entry
let order = [];           // playable game names, newest first
let game = null, tl = null, T = 0, playing = false, speed = 1, lastFrame = 0, lastSetIdx = -2;
try { speed = SPEEDS.includes(+localStorage.getItem('tr.replay.speed')) ? +localStorage.getItem('tr.replay.speed') : 1; } catch {}

function ingest(rows) {
  byGame = {};
  if (!rows || rows.length < 2) return;
  const h = rows[0].map(x => String(x).trim().toLowerCase()), I = n => h.indexOf(n);
  const c = { t: I('time'), ty: I('type'), nm: I('name'), po: I('possession owner'), ao: I('action owner'),
              cm: I('comment'), dt: I('detail'), g: I('game') };
  rows.slice(1).forEach(r => {
    const g = r[c.g]; if (!g) return;
    const p = TR.detailPos(c.dt >= 0 ? r[c.dt] : '', c.cm >= 0 ? r[c.cm] : '');
    (byGame[g] = byGame[g] || []).push({ t: R.toSecs(r[c.t]), type: (r[c.ty] || '').trim(), name: (r[c.nm] || '').trim(),
      owner: (r[c.po] || '').trim(), actor: (r[c.ao] || '').trim(), x: p ? p.x : null, y: p ? p.y : null });
  });
}

// A game can be replayed when it was tagged with positions: enough of them to
// draw sets, and a Game Start to put them on a clock.
const PLAYABLE_MIN = 20;
const playable = g => {
  const evs = byGame[g] || [];
  return evs.filter(e => e.x != null).length >= PLAYABLE_MIN && evs.some(e => e.type === 'Game Event' && e.name === 'Game Start');
};

function buildPicker() {
  const listed = Object.keys(meta);
  const names = [...new Set([...listed.slice().reverse(), ...Object.keys(byGame)])];
  order = names.filter(playable);
  const sel = document.getElementById('gameSelect');
  const cur = game || new URLSearchParams(location.search).get('game') || '';
  sel.innerHTML = '<option value="">— Pick a game to replay —</option>' +
    order.map(g => `<option value="${esc(g)}">${esc(TR.sheetNameToLabel(meta[g] || { name: g }))}</option>`).join('');
  if (order.includes(cur)) sel.value = cur;
  document.getElementById('status').textContent = `${order.length} game${order.length === 1 ? '' : 's'} with touch positions`;
  if (!game) {
    if (order.includes(cur)) pickGame(cur);
    else showEmpty(order.length ? 'Pick a game to replay. Only games tagged with touch positions can be replayed.' : 'No games with touch positions yet.');
  }
}

async function load() {
  const ca = LS.get('all'), cl = LS.get('list');
  if (cl) cl.sheets.forEach(s => { meta[s.name] = s; });
  if (ca) { ingest(ca.rows); buildPicker(); }
  try {
    const have = c => c && c.version != null ? `&have=${TR.enc(String(c.version))}` : '';
    const api = q => fetch(`${TR.APPS_SCRIPT_URL}?secret=${TR.enc(TR.secret())}&${q}`, { cache: 'no-store' }).then(r => r.json());
    const [ar, lr] = await Promise.all([api('action=all' + have(ca)), api('action=list' + have(cl))]);
    if (!ar.ok) throw new Error(ar.error);
    if (lr.ok && !lr.unchanged) { LS.set('list', lr); meta = {}; lr.sheets.forEach(s => { meta[s.name] = s; }); }
    if (!ar.unchanged) { ingest(ar.rows); if (!LS.set('all', ar)) try { localStorage.removeItem('trl2_all'); } catch {} }
    if (!ar.unchanged || (lr.ok && !lr.unchanged) || !ca) buildPicker();
  } catch (err) {
    const st = document.getElementById('status');
    st.textContent = ca ? 'Couldn’t refresh — showing saved games' : 'Could not load games: ' + err.message;
    st.classList.add('warn');
    if (!ca) showEmpty('Could not load games: ' + err.message);
  }
}

function showEmpty(msg) {
  document.getElementById('stage').style.display = 'none';
  const e = document.getElementById('empty'); e.style.display = ''; e.textContent = msg;
}

// ── Game ───────────────────────────────────────────────────────
function teamName(k) { const m = meta[game] || {}; return (k === 'Team 1' ? m.team1 : m.team2) || k; }

function pickGame(g) {
  pause();
  if (!g || !byGame[g]) { game = null; history.replaceState(null, '', 'replay.html'); showEmpty('Pick a game to replay.'); return; }
  game = g;
  history.replaceState(null, '', `?game=${TR.enc(g)}`);
  tl = R.buildTimeline(byGame[g]);
  document.getElementById('empty').style.display = 'none';
  document.getElementById('stage').style.display = '';
  document.getElementById('name1').textContent = teamName('Team 1');
  document.getElementById('name2').textContent = teamName('Team 2');
  document.getElementById('keyUp').innerHTML = `<i style="background:${COLOR['Team 1']}"></i>${esc(teamName('Team 1'))} attack ↑`;
  document.getElementById('keyDown').innerHTML = `${esc(teamName('Team 2'))} attack ↓<i style="background:${COLOR['Team 2']};margin:0 0 0 5px"></i>`;
  const sc = document.getElementById('scrub');
  sc.min = tl.start; sc.max = tl.end;
  lastSetIdx = -2;
  T = tl.sets.length ? tl.sets[0].start : tl.start;
  render();
}

// ── Drawing ────────────────────────────────────────────────────
function fieldSVG() {
  const line = (y, o, dash) => `<line x1="0" y1="${vy(y)}" x2="100" y2="${vy(y)}" stroke="rgba(255,255,255,${o})" stroke-width="${dash ? 0.5 : 0.8}"${dash ? ' stroke-dasharray="2 2"' : ''}/>`;
  const ten = 10 / 70 * 100, seven = 7 / 70 * 100;
  return `<rect x="0" y="${-seven * 1.4}" width="100" height="${LEN + seven * 2.8}" fill="#0f2a1b"/>
    <rect x="0" y="0" width="100" height="${LEN}" fill="#12301f" stroke="rgba(255,255,255,0.5)" stroke-width="0.6"/>
    ${line(100, 0.75)}${line(0, 0.75)}${line(50, 0.5)}
    ${line(50 + ten, 0.28, true)}${line(50 - ten, 0.28, true)}${line(100 - seven, 0.22, true)}${line(seven, 0.22, true)}
    <text x="50" y="-6" text-anchor="middle" font-size="3.2" fill="rgba(255,255,255,0.4)">${esc(teamName('Team 1'))} score here</text>
    <text x="50" y="${LEN + 10}" text-anchor="middle" font-size="3.2" fill="rgba(255,255,255,0.4)">${esc(teamName('Team 2'))} score here</text>`;
}

function endMarker(o, p, color) {
  const x = p.x, y = vy(p.y);
  if (o === 'try') return `<circle cx="${x}" cy="${y}" r="4.2" fill="var(--green)" stroke="#fff" stroke-width="0.8"/><text x="${x}" y="${y + 1.6}" text-anchor="middle" font-size="4.4" font-weight="700" fill="#06210f">T</text>`;
  if (o === 'error') return `<path d="M${x - 3} ${y - 3}L${x + 3} ${y + 3}M${x + 3} ${y - 3}L${x - 3} ${y + 3}" stroke="var(--orange)" stroke-width="1.6"/>`;
  if (o === 'pen') return `<rect x="${x - 3}" y="${y - 3}" width="6" height="6" rx="1" fill="var(--yellow)"/><text x="${x}" y="${y + 1.6}" text-anchor="middle" font-size="4.2" font-weight="700" fill="#2a1a00">P</text>`;
  if (o === 'sixth') return `<rect x="${x - 2.6}" y="${y - 2.6}" width="5.2" height="5.2" rx="1" fill="none" stroke="${color}" stroke-width="1.2"/>`;
  return '';
}

function setSVG(set) {
  const color = COLOR[set.owner] || '#fff';
  const pts = set.steps.map(s => R.screenPos(set.owner, s.x, s.y));
  const ball = R.ballAt(set, T), b = R.screenPos(set.owner, ball.x, ball.y);
  const poly = arr => arr.map(p => `${p.x.toFixed(2)},${vy(p.y).toFixed(2)}`).join(' ');
  const played = pts.slice(0, ball.step + 1).concat(ball.done ? [] : [b]);
  const nodes = set.steps.map((s, i) => {
    if (i > ball.step) return '';
    const p = pts[i], m = /Touch (\d)/.exec(s.name || '');
    if (s.origin) return `<circle cx="${p.x}" cy="${vy(p.y)}" r="2.3" fill="#0b0e14" stroke="${color}" stroke-width="1"/>`;
    return `<circle cx="${p.x}" cy="${vy(p.y)}" r="2.3" fill="${color}" stroke="#0b0e14" stroke-width="0.5"/>` +
      (m ? `<text x="${p.x}" y="${vy(p.y) + 1.4}" text-anchor="middle" font-size="3.2" font-weight="700" fill="#0b0e14">${m[1]}</text>` : '');
  }).join('');
  const end = ball.done ? endMarker(set.outcome.key, pts[pts.length - 1], color) : '';
  return `<polyline points="${poly(pts)}" fill="none" stroke="${color}" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="2 1.5"/>
    <polyline points="${poly(played)}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round"/>
    ${nodes}${end}
    ${ball.done && set.outcome.key !== 'none' ? '' : `<circle cx="${b.x}" cy="${vy(b.y)}" r="3" fill="#fff" stroke="${color}" stroke-width="1.4"/>`}`;
}

function render() {
  if (!tl) return;
  const idx = R.setIndexAt(tl, T), set = tl.sets[Math.max(0, idx)];
  const svg = document.getElementById('field');
  svg.innerHTML = fieldSVG() + (set && idx >= 0 ? setSVG(set) : '');

  const sc = R.scoreAt(tl, T);
  document.getElementById('score').textContent = `${sc['Team 1']} – ${sc['Team 2']}`;
  const h = R.halfAt(tl, T);
  document.getElementById('clock').textContent = `${h ? (h === 1 ? '1st' : h === 2 ? '2nd' : h + 'th') + ' half · ' : ''}${mmss(T)}`;
  document.getElementById('scrub').value = T;

  if (!set || idx < 0) return;
  document.getElementById('setTeam').textContent = teamName(set.owner);
  document.getElementById('setTeam').style.color = COLOR[set.owner];
  document.getElementById('setNo').textContent = `Set ${idx + 1} of ${tl.sets.length}`;
  const n = R.touchAt(set, T);
  document.getElementById('dots').innerHTML = [1, 2, 3, 4, 5, 6].map(i => `<span class="${i <= n ? 'on' : ''}" style="${i <= n ? 'background:' + COLOR[set.owner] : ''}"></span>`).join('');
  const ball = R.ballAt(set, T);
  const oc = document.getElementById('outcome');
  oc.className = 'outcome ' + (ball.done ? set.outcome.key : '');
  oc.textContent = ball.done ? set.outcome.label : (n ? `Touch ${n}` : 'Set starts');
  // The set's steps, the one just reached highlighted.
  if (idx !== lastSetIdx) {
    document.getElementById('steps').innerHTML = set.steps.map((s, i) =>
      `<li data-i="${i}"><span class="t">${mmss(s.t)}</span><span>${esc(s.name || s.type)}</span><span class="m">${Math.round(s.y * 0.7)} m</span></li>`).join('');
    lastSetIdx = idx;
  }
  document.querySelectorAll('#steps li').forEach(li => {
    const i = +li.dataset.i;
    li.className = i === ball.step ? 'now' : i < ball.step ? 'done' : '';
  });
  const now = document.querySelector('#steps li.now');
  if (now && playing) now.scrollIntoView({ block: 'nearest' });
}

// ── Playback ───────────────────────────────────────────────────
function frame(ts) {
  if (!playing) return;
  const dt = lastFrame ? Math.min(0.25, (ts - lastFrame) / 1000) : 0;
  lastFrame = ts;
  T = R.skipDead(tl, T + dt * speed);
  if (T >= tl.end) { T = tl.end; render(); pause(); return; }
  render();
  requestAnimationFrame(frame);
}
function play() {
  if (!tl || playing) return;
  if (T >= tl.end) T = tl.sets.length ? tl.sets[0].start : tl.start;
  playing = true; lastFrame = 0;
  document.getElementById('playBtn').textContent = '⏸';
  requestAnimationFrame(frame);
}
function pause() {
  playing = false;
  const b = document.getElementById('playBtn'); if (b) b.textContent = '▶';
}
function togglePlay() { playing ? pause() : play(); }
function seek(t) { T = t; render(); }

// Previous goes to the start of this set, or of the one before when already
// at (or within a second of) its start.
function stepSet(dir) {
  if (!tl || !tl.sets.length) return;
  let idx = R.setIndexAt(tl, T);
  if (dir > 0) idx = Math.min(tl.sets.length - 1, idx + 1);
  else if (idx >= 0 && T - tl.sets[idx].start <= 1) idx = Math.max(0, idx - 1);
  T = tl.sets[Math.max(0, idx)].start;
  render();
}

function renderSpeeds() {
  document.getElementById('speeds').innerHTML = SPEEDS.map(s =>
    `<button class="${s === speed ? 'on' : ''}" onclick="setSpeed(${s})" aria-pressed="${s === speed}">${s}×</button>`).join('');
}
function setSpeed(s) { speed = s; try { localStorage.setItem('tr.replay.speed', String(s)); } catch {} renderSpeeds(); }

document.addEventListener('keydown', e => {
  if (!tl || e.target.closest('select, input, textarea')) return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); stepSet(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stepSet(-1); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

renderSpeeds();
load();
</script>
</body>
</html>
