<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Table — Touch Rugby Analyzer</title>
  <style>
    /* ── Shared theme ─────────────────────────────────────────── */
    :root {
      --bg:           #0f1117;
      --surface:      #1a1d27;
      --surface-2:    #22253a;
      --border:       #2a2d3a;
      --border-light: #1f2230;
      --text:         #e0e0e0;
      --text-muted:   #888;
      --text-dim:     #555;
      --accent:       #3b82f6;
      --accent-hover: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* ── Shared header ────────────────────────────────────────── */
    header { background: var(--surface); padding: 10px 20px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .logo  { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo span { font-size: 1rem; font-weight: 600; color: #fff; white-space: nowrap; }
    .header-nav { display: flex; gap: 4px; margin-left: auto; }
    .header-nav a { color: var(--text-muted); text-decoration: none; font-size: 0.8rem; padding: 5px 10px; border-radius: 6px; transition: background 0.15s, color 0.15s; }
    .header-nav a:hover { background: var(--surface-2); color: var(--text); }
    .header-nav a.active { background: var(--surface-2); color: var(--accent); }
    #rowCount { font-size: 0.78rem; color: var(--text-muted); margin-left: 8px; }

    /* ── Controls ─────────────────────────────────────────────── */
    .controls { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }

    .top-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    .search-group { display: flex; flex-grow: 1; min-width: 200px; }
    .col-select { padding: 7px 10px; background: var(--surface-2); border: 1px solid var(--border); border-right: none; border-radius: 6px 0 0 6px; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; outline: none; max-width: 130px; }
    .search-input { flex-grow: 1; padding: 7px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 0 6px 6px 0; color: var(--text); font-size: 0.82rem; outline: none; }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-dim); }

    .btn { border: none; border-radius: 6px; padding: 6px 14px; font-size: 0.78rem; cursor: pointer; font-weight: 600; transition: background 0.15s; }
    .btn-ghost   { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: #2e3245; color: var(--text); }
    .btn-ghost:disabled { opacity: 0.4; cursor: default; }

    /* Filter chips */
    .filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .filter-wrap { position: relative; }
    .filter-btn { display: flex; align-items: center; gap: 6px; padding: 5px 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-size: 0.78rem; cursor: pointer; user-select: none; white-space: nowrap; }
    .filter-btn::after { content: '▾'; font-size: 0.7em; opacity: 0.6; }
    .filter-btn:hover { border-color: #3a3d4a; color: var(--text); }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); }

    .filter-dropdown { position: absolute; top: calc(100% + 4px); left: 0; min-width: 160px; max-height: 260px; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 100; display: none; padding: 4px 0; }
    .filter-dropdown.open { display: block; }
    .filter-dropdown label { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; }
    .filter-dropdown label:hover { background: var(--surface-2); color: var(--text); }
    .filter-dropdown input[type=checkbox] { accent-color: var(--accent); width: 13px; height: 13px; cursor: pointer; }

    /* ── Table ────────────────────────────────────────────────── */
    .table-wrap { flex: 1; overflow: auto; min-height: 0; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    thead { position: sticky; top: 0; z-index: 10; }
    th { background: var(--surface); color: var(--text-muted); padding: 9px 12px; text-align: left; font-weight: 600; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
    th:hover { color: var(--text); }
    th.sort-asc::after  { content: ' ▲'; font-size: 0.65em; color: var(--accent); }
    th.sort-desc::after { content: ' ▼'; font-size: 0.65em; color: var(--accent); }
    td { padding: 7px 12px; border-bottom: 1px solid var(--border-light); color: #ccc; vertical-align: middle; }
    tr:hover td { background: var(--surface-2); }

    /* Type badges */
    .badge { padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-try        { background: rgba(0,200,83,0.15);  color: #00c853; }
    .badge-penalty    { background: rgba(244,67,54,0.15); color: #f44336; }
    .badge-turnover   { background: rgba(255,152,0,0.15); color: #ff9800; }
    .badge-gameevent  { background: rgba(16,185,129,0.15);color: #10b981; }
    .badge-toreview   { background: rgba(249,115,22,0.15);color: #f97316; }

    /* Team badge */
    .team-badge { padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; background: rgba(59,130,246,0.12); color: #93c5fd; border: 1px solid rgba(59,130,246,0.2); }

    /* YT link */
    .yt-link { display: inline-flex; align-items: center; gap: 4px; color: #f44336; text-decoration: none; font-size: 0.75rem; font-weight: 600; background: rgba(244,67,54,0.1); padding: 3px 8px; border-radius: 4px; }
    .yt-link:hover { background: rgba(244,67,54,0.2); }

    /* Game tag */
    .game-tag { font-size: 0.72rem; color: var(--text-muted); background: var(--surface-2); padding: 2px 7px; border-radius: 4px; border: 1px solid var(--border); }

    .empty { text-align: center; padding: 48px; color: var(--text-dim); font-size: 0.88rem; }
    #loadingMsg { text-align: center; padding: 48px; color: var(--text-dim); font-size: 0.88rem; display: none; }
    #errorMsg   { color: #ef4444; font-size: 0.82rem; padding: 10px 16px; display: none; }

    /* ── Pagination ───────────────────────────────────────────── */
    .pagination { display: flex; justify-content: space-between; align-items: center; padding: 9px 16px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; gap: 8px; }
    .pagination-info { font-size: 0.78rem; color: var(--text-muted); }
    .pagination-actions { display: flex; align-items: center; gap: 8px; }
    .page-select { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); border-radius: 5px; padding: 4px 8px; font-size: 0.78rem; cursor: pointer; }
    #pageIndicator { font-size: 0.78rem; color: var(--text-muted); min-width: 80px; text-align: center; }
  </style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      <path d="M2 12h20"/>
    </svg>
    <span>Touch Rugby Analyzer</span>
  </a>
  <span id="rowCount"></span>
  <nav class="header-nav">
    <a href="games.html">Games</a>
    <a href="event_table.html" class="active">Events</a>
    <a href="viewer.html" id="annotatorLink" style="display:none">Annotator</a>
  </nav>
  <script>if (sessionStorage.getItem('accessLevel') === 'staff') document.getElementById('annotatorLink').style.display = '';</script>
</header>

<div id="errorMsg"></div>
<div id="loadingMsg">⏳ Loading events…</div>

<div class="controls" id="controls" style="display:none">
  <div class="top-row">
    <div class="search-group">
      <select id="searchCol" class="col-select"></select>
      <input id="searchInput" class="search-input" type="text" placeholder="Search…">
    </div>
    <button class="btn btn-ghost" onclick="resetFilters()">↺ Reset</button>
  </div>
  <div class="filter-row" id="filterRow"></div>
</div>

<div class="table-wrap">
  <table id="dataTable">
    <thead></thead>
    <tbody></tbody>
  </table>
  <div class="empty" id="emptyState" style="display:none">No matching records found.</div>
</div>

<div class="pagination" id="pagination" style="display:none">
  <div class="pagination-info">
    Showing <span id="rangeStart">0</span>–<span id="rangeEnd">0</span> of <span id="totalRows">0</span>
  </div>
  <div class="pagination-actions">
    <label style="font-size:0.78rem;color:var(--text-muted)">Rows:
      <select id="rowsPerPage" class="page-select">
        <option value="25">25</option>
        <option value="50" selected>50</option>
        <option value="100">100</option>
        <option value="250">250</option>
      </select>
    </label>
    <button id="prevBtn" class="btn btn-ghost" disabled>‹ Prev</button>
    <span id="pageIndicator">Page 1</span>
    <button id="nextBtn" class="btn btn-ghost" disabled>Next ›</button>
  </div>
</div>

<script>
// ── Config ─────────────────────────────────────────────────────
const APPS_SCRIPT_URL    = 'https://script.google.com/macros/s/AKfycbzhMw4nQr2nVW0MLfPWVXRPXsvImerpzshQ5GnJ3873qQkGMz0bcJQdmTRXCxwygfFm/exec';
const APPS_SCRIPT_SECRET = 'm30-test-key';

const FILTERABLE = ['Type', 'Name', 'Possession Owner', 'Game'];

// ── State ──────────────────────────────────────────────────────
let allData      = [];
let filtered     = [];
let headers      = [];
let sortCol      = -1;
let sortAsc      = true;
let currentPage  = 1;
let rowsPerPage  = 50;
let activeFilters = {};

// ── Bootstrap ──────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', fetchAll);

async function fetchAll() {
  document.getElementById('loadingMsg').style.display = 'block';
  try {
    const resp   = await fetch(`${APPS_SCRIPT_URL}?secret=${enc(APPS_SCRIPT_SECRET)}&action=all`);
    const result = await resp.json();
    if (!result.ok) throw new Error(result.error);
    processRows(result.rows);
  } catch (err) {
    document.getElementById('loadingMsg').style.display = 'none';
    const el = document.getElementById('errorMsg');
    el.textContent = 'Failed to load events: ' + err.message;
    el.style.display = 'block';
  }
}

// ── Data processing ────────────────────────────────────────────
function processRows(rows) {
  document.getElementById('loadingMsg').style.display = 'none';
  if (!rows || rows.length < 2) return;

  headers  = rows[0].map(h => h.trim());
  allData  = rows.slice(1).filter(r => r.some(c => c !== ''));
  filtered = [...allData];

  buildSearchColSelect();
  buildFilterDropdowns();
  renderHeaders();
  applyFilters();

  document.getElementById('controls').style.display   = '';
  document.getElementById('pagination').style.display = '';
}

// ── Search column select ───────────────────────────────────────
function buildSearchColSelect() {
  const sel = document.getElementById('searchCol');
  sel.innerHTML = '<option value="-1">All Columns</option>';
  headers.forEach((h, i) => {
    const opt = document.createElement('option');
    opt.value = i; opt.textContent = h || '#';
    sel.appendChild(opt);
  });
}

// ── Filter dropdowns ───────────────────────────────────────────
function buildFilterDropdowns() {
  const row = document.getElementById('filterRow');
  row.innerHTML = '';
  activeFilters = {};

  FILTERABLE.forEach(col => {
    const idx = headers.findIndex(h => h.toLowerCase() === col.toLowerCase());
    if (idx === -1) return;

    activeFilters[col] = new Set();
    const vals = [...new Set(allData.map(r => r[idx]).filter(Boolean))].sort();
    if (!vals.length) return;

    const wrap = document.createElement('div');
    wrap.className = 'filter-wrap';

    const btn = document.createElement('div');
    btn.className = 'filter-btn';
    btn.innerHTML = `<span>${col}</span>`;

    const drop = document.createElement('div');
    drop.className = 'filter-dropdown';

    vals.forEach(val => {
      const label = document.createElement('label');
      const cb    = document.createElement('input');
      cb.type = 'checkbox'; cb.value = val;
      cb.addEventListener('change', () => {
        cb.checked ? activeFilters[col].add(val) : activeFilters[col].delete(val);
        const hasActive = activeFilters[col].size > 0;
        btn.classList.toggle('active', hasActive);
        btn.querySelector('span').textContent = hasActive ? `${col} (${activeFilters[col].size})` : col;
        applyFilters();
      });
      label.append(cb, document.createTextNode(' ' + val));
      drop.appendChild(label);
    });

    btn.addEventListener('click', e => {
      e.stopPropagation();
      document.querySelectorAll('.filter-dropdown.open').forEach(d => { if (d !== drop) d.classList.remove('open'); });
      drop.classList.toggle('open');
    });

    wrap.append(btn, drop);
    row.appendChild(wrap);
  });
}

document.addEventListener('click', () => {
  document.querySelectorAll('.filter-dropdown.open').forEach(d => d.classList.remove('open'));
});

// ── Headers ────────────────────────────────────────────────────
function renderHeaders() {
  const thead = document.querySelector('#dataTable thead');
  thead.innerHTML = '';
  const tr = document.createElement('tr');
  headers.forEach((h, i) => {
    const th = document.createElement('th');
    th.textContent = h || '#';
    th.onclick = () => sortBy(i);
    if (i === sortCol) th.classList.add(sortAsc ? 'sort-asc' : 'sort-desc');
    tr.appendChild(th);
  });
  thead.appendChild(tr);
}

// ── Render rows ────────────────────────────────────────────────
const TYPE_BADGE = {
  'try':        'badge-try',
  'penalty':    'badge-penalty',
  'turnover':   'badge-turnover',
  'game event': 'badge-gameevent',
  'to review':  'badge-toreview',
};

function renderRows(rows) {
  const tbody = document.querySelector('#dataTable tbody');
  const empty = document.getElementById('emptyState');
  tbody.innerHTML = '';
  empty.style.display = rows.length ? 'none' : 'block';

  rows.forEach(row => {
    const tr = document.createElement('tr');
    row.forEach((cell, i) => {
      const td  = document.createElement('td');
      const col = (headers[i] || '').toLowerCase();

      if ((col.includes('youtube') || col.includes('link')) && cell.startsWith('http')) {
        const a = document.createElement('a');
        a.href = cell; a.target = '_blank'; a.rel = 'noopener';
        a.className = 'yt-link';
        a.innerHTML = '▶ Watch';
        td.appendChild(a);
      } else if (col === 'type' && cell) {
        const span = document.createElement('span');
        span.textContent = cell;
        span.className = 'badge ' + (TYPE_BADGE[cell.toLowerCase()] || '');
        td.appendChild(span);
      } else if (col === 'possession owner' && cell) {
        const span = document.createElement('span');
        span.textContent = cell;
        span.className = 'team-badge';
        td.appendChild(span);
      } else if (col === 'game' && cell) {
        const span = document.createElement('span');
        span.textContent = cell;
        span.className = 'game-tag';
        td.appendChild(span);
      } else {
        td.textContent = cell;
      }

      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  document.querySelector('.table-wrap').scrollTop = 0;
}

// ── Sort ───────────────────────────────────────────────────────
function sortBy(col) {
  sortAsc = (sortCol === col) ? !sortAsc : true;
  sortCol = col;
  sortFiltered();
  renderHeaders();
  updatePagination();
}

function sortFiltered() {
  if (sortCol === -1) return;
  const sample = filtered.find(r => r[sortCol] !== '')?.[sortCol];
  const numeric = sample !== undefined && !isNaN(parseFloat(sample)) && isFinite(sample);
  filtered.sort((a, b) => {
    const va = a[sortCol], vb = b[sortCol];
    if (numeric) return sortAsc ? va - vb : vb - va;
    const sa = (va || '').toLowerCase(), sb = (vb || '').toLowerCase();
    return sortAsc ? sa.localeCompare(sb) : sb.localeCompare(sa);
  });
}

// ── Filter + search ────────────────────────────────────────────
function applyFilters() {
  const query    = document.getElementById('searchInput').value.toLowerCase();
  const colIdx   = parseInt(document.getElementById('searchCol').value);

  filtered = allData.filter(row => {
    // Text search
    const match = colIdx === -1
      ? row.some(c => String(c).toLowerCase().includes(query))
      : String(row[colIdx]).toLowerCase().includes(query);
    if (!match) return false;

    // Dropdown filters
    for (const col of FILTERABLE) {
      const set = activeFilters[col];
      if (!set || !set.size) continue;
      const idx = headers.findIndex(h => h.toLowerCase() === col.toLowerCase());
      if (!set.has(row[idx])) return false;
    }
    return true;
  });

  currentPage = 1;
  sortFiltered();
  updatePagination();
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  // Uncheck all checkboxes
  document.querySelectorAll('.filter-dropdown input[type=checkbox]').forEach(cb => { cb.checked = false; });
  // Reset active filters state and button styles
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
    btn.querySelector('span').textContent = btn.querySelector('span').textContent.replace(/ \(\d+\)$/, '');
  });
  FILTERABLE.forEach(col => { if (activeFilters[col]) activeFilters[col].clear(); });
  applyFilters();
}

// ── Pagination ─────────────────────────────────────────────────
function updatePagination() {
  const total      = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / rowsPerPage));
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * rowsPerPage;
  const end   = Math.min(start + rowsPerPage, total);

  document.getElementById('rangeStart').textContent  = total ? start + 1 : 0;
  document.getElementById('rangeEnd').textContent    = end;
  document.getElementById('totalRows').textContent   = total;
  document.getElementById('pageIndicator').textContent = `Page ${currentPage} of ${totalPages}`;
  document.getElementById('rowCount').textContent    = `${total} rows`;
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= totalPages;

  renderRows(filtered.slice(start, end));
}

document.getElementById('rowsPerPage').addEventListener('change', e => { rowsPerPage = +e.target.value; currentPage = 1; updatePagination(); });
document.getElementById('prevBtn').addEventListener('click', () => { if (currentPage > 1) { currentPage--; updatePagination(); } });
document.getElementById('nextBtn').addEventListener('click', () => { const t = Math.ceil(filtered.length / rowsPerPage); if (currentPage < t) { currentPage++; updatePagination(); } });
document.getElementById('searchInput').addEventListener('input', applyFilters);
document.getElementById('searchCol').addEventListener('change', applyFilters);

function enc(s) { return encodeURIComponent(s); }
</script>
</body>
</html>
