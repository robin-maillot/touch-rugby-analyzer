<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Touch Rugby Analyzer (alpha version)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    /* --- Login Screen Styles --- */
    #login-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #2c3e50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      color: white;
    }
    #login-box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      max-width: 90%;
      width: 300px;
    }
    #login-box h2 {
      margin-top: 0;
      color: #333;
    }
    #password-input {
      width: 100%;
      padding: 10px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
    }
    #login-btn {
      width: 100%;
      padding: 10px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    #login-btn:hover { background: #2980b9; }
    #error-msg {
      color: #e74c3c;
      margin-top: 10px;
      display: none;
      font-size: 14px;
    }

    /* --- Main Content (Hidden Initially) --- */
    #app-content { display: none; background: #0f1117; min-height: 100vh; }

    #app-content header { background: #1a1d27; border-bottom: 1px solid #2a2d3a; padding: 10px 20px; display: flex; align-items: center; gap: 14px; }
    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .logo span { font-size: 1rem; font-weight: 600; color: #fff; }

    .nav-cards { display: flex; gap: 16px; padding: 48px 24px; justify-content: center; flex-wrap: wrap; }
    .nav-card { display: block; background: #1a1d27; border: 1px solid #2a2d3a; border-radius: 12px; padding: 32px 40px; text-decoration: none; text-align: center; color: #e0e0e0; min-width: 200px; transition: border-color 0.15s, background 0.15s; }
    .nav-card:hover { background: #22253a; border-color: #3b82f6; }
    .nav-card .card-icon  { font-size: 2rem; margin-bottom: 10px; }
    .nav-card .card-title { font-size: 1rem; font-weight: 700; color: #fff; }
    .nav-card .card-desc  { font-size: 0.78rem; color: #888; margin-top: 4px; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div id="login-box">
      <h2>Restricted Access</h2>
      <input type="password" id="password-input" placeholder="Enter Password" />
      <button id="login-btn">Login</button>
      <div id="error-msg">Incorrect Password</div>
    </div>
  </div>

  <div id="app-content">
    <header>
      <a class="logo" href="index.html">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          <path d="M2 12h20"/>
        </svg>
        <span>Touch Rugby Analyzer</span>
      </a>
    </header>
    <div class="nav-cards">
      <a class="nav-card" href="games.html">
        <div class="card-icon">📊</div>
        <div class="card-title">Game Analysis</div>
        <div class="card-desc">Charts &amp; stats per game</div>
      </a>
      <a class="nav-card" href="event_table.html">
        <div class="card-icon">📋</div>
        <div class="card-title">Event Table</div>
        <div class="card-desc">Browse all tagged events</div>
      </a>
      <a class="nav-card" href="viewer.html" id="annotatorCard" style="display:none">
        <div class="card-icon">🎬</div>
        <div class="card-title">Annotator</div>
        <div class="card-desc">Tag events on video</div>
      </a>
    </div>
  </div>

<script>
  // --- PASSWORD LOGIC ---
  const PASSWORDS = { 'm30': 'basic', 'm30-staff': 'staff' };

  const loginScreen = document.getElementById('login-screen');
  const appContent  = document.getElementById('app-content');
  const passInput   = document.getElementById('password-input');
  const loginBtn    = document.getElementById('login-btn');
  const errorMsg    = document.getElementById('error-msg');

  function checkPassword() {
    const level = PASSWORDS[passInput.value];
    if (level) {
      initApp(level);
    } else {
      errorMsg.style.display = 'block';
      passInput.value = '';
      passInput.focus();
    }
  }

  loginBtn.addEventListener('click', checkPassword);
  passInput.addEventListener('keypress', e => { if (e.key === 'Enter') checkPassword(); });

  // --- APP LOGIC ---
  function initApp(level) {
    sessionStorage.setItem('accessLevel', level);
    if (level === 'staff') {
      document.getElementById('annotatorCard').style.display = '';
    }
    loginScreen.style.display = 'none';
    appContent.style.display  = 'block';
  }
</script>
</body>
</html>
