<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Touch Rugby Analyzer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header {
      text-align: center;
      padding: 18px;
      background: #2c3e50;
      color: white;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 12px;
      background: #ecf0f1;
      flex-wrap: wrap;
    }
    nav button {
      padding: 10px 18px;
      border: none;
      background: #3498db;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      margin: 4px 0;
    }
    nav button.active,
    nav button:hover {
      background: #2980b9;
    }

    #iframe-container {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 12px;
    }

    iframe {
      width: 100%;
      height: 2000px;  /* adjust to fit your pages */
      border: none;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
      background: white;
      overflow: hidden;
    }

    @media (max-width: 800px) {
      iframe { height: 2500px; }
      nav { flex-direction: column; align-items: center; }
      nav button { width: 100%; max-width: 340px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Touch Rugby Analyzer</h1>
  </header>

<nav id="nav">
  <!-- Static link for the Event Table -->
  <button data-src="event_table.html">Event Table</button>
</nav>

<div id="iframe-container">
  <iframe id="gameFrame" scrolling="no"></iframe>
</div>

<script>
  const nav = document.getElementById('nav');
  const frame = document.getElementById('gameFrame');

  fetch('./games.json?_=' + Date.now()) // cache-bust JSON too
    .then(res => res.json())
    .then(files => {
      files.forEach((entry, idx) => {
        // entry.name and entry.file come from JSON
        const btn = document.createElement('button');
        btn.textContent = entry.name;
        btn.dataset.src = entry.file;

        if (idx === 0) btn.classList.add('active');

        btn.addEventListener('click', () => {
          const forced = entry.file + (entry.file.includes('?') ? '&' : '?') + '_=' + Date.now();
          frame.src = forced;

          // remove active from others
          document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          frame.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        nav.appendChild(btn);
      });

      // load first game automatically
      if (files.length) frame.src = files[0].file;
    })
    .catch(err => {
      console.error('Error loading games.json:', err);
    });
</script>
