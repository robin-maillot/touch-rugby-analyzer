<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Touch Rugby Games — Touch Rugby Analyzer</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Touch Rugby">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="cb7fd4f2-fcd5-44d7-a8e4-70e9068870bb" data-auto-track="false"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #181b26;
      --surface-2: #22253a;
      --border:    #2a2d3a;
      --text:      #e0e0e0;
      --text-muted:#888;
      --accent:    #3b82f6;
    }

    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1rem; font-weight: 600; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; animation: pulse 1.4s ease-in-out infinite; flex-shrink: 0; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .refresh-info { font-size: 0.75rem; color: var(--text-muted); }
    .refresh-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.15s, border-color 0.15s;
    }
    .refresh-btn:hover { color: var(--text); border-color: var(--accent); }
    .refresh-btn svg { width: 12px; height: 12px; flex-shrink: 0; }
    .refresh-btn.spinning svg { animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    main { padding: 32px 24px; max-width: 900px; margin: 0 auto; }

    #empty {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }
    #empty p { margin-top: 8px; font-size: 0.8rem; }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 100px 24px;
      gap: 18px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; align-items: start; }

    .live-count {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #ef4444;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 4px;
      padding: 3px 8px;
    }

    @keyframes scoreFlash {
      0%   { transform: scale(1);    color: var(--text); text-shadow: none; }
      25%  { transform: scale(1.22); color: #22c55e;     text-shadow: 0 0 14px rgba(34,197,94,0.55); }
      100% { transform: scale(1);    color: var(--text); text-shadow: none; }
    }
    .score.bump { animation: scoreFlash 0.9s ease-out; }

    .section-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 36px 0 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .card-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .live-badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #ef4444;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 4px;
      padding: 2px 7px;
    }
    .ended-badge {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 7px;
    }
    .game-time { margin-left: auto; font-size: 0.78rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }

    .scoreboard {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .team { flex: 1; text-align: center; }
    .team-name { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score { font-size: 2.8rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .divider { font-size: 1.4rem; color: var(--border); flex-shrink: 0; }

    .stats-panel { display: none; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
    .stats-panel.open { display: block; }
    .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; margin-bottom: 6px; font-size: 0.8rem; align-items: center; }
    .stats-row:last-child { margin-bottom: 0; }
    .stats-label { color: var(--text-muted); }
    .stats-val { text-align: center; font-variant-numeric: tabular-nums; font-weight: 500; }

    .ev-section { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .ev-section-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .ev-row { display: grid; grid-template-columns: 44px 1fr auto 1fr; gap: 6px; align-items: center; font-size: 0.78rem; padding: 3px 0; }
    .ev-time { color: var(--text-muted); font-variant-numeric: tabular-nums; }
    .ev-left { text-align: right; }
    .ev-right { text-align: left; }
    .ev-score { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 38px; text-align: center; }
    .ev-row.ev-try .ev-score { color: #22c55e; }
    .ev-row.ev-try .ev-left,
    .ev-row.ev-try .ev-right { color: #22c55e; }
    .ev-tag { font-size: 0.66rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; vertical-align: 1px; }
    .ev-tag.pen-atk { color: #ef4444; background: rgba(239,68,68,0.12); }
    .ev-tag.pen-def { color: #f59e0b; background: rgba(245,158,11,0.12); }
    .ev-marker { grid-template-columns: 44px 1fr; color: var(--text-muted); font-size: 0.72rem; font-style: italic; }
    .ev-marker-label { text-align: center; }

    /* Expand-to-theater affordance — only rendered when a game has a video */
    .expand-btn {
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.3);
      color: #ef4444;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }
    .expand-btn:hover { background: rgba(239,68,68,0.22); }

    /* Theater overlay: large video + scoreboard/stats beside it (desktop) or above it (mobile) */
    .theater {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0,0,0,0.92);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .theater.open { display: flex; }
    .theater-inner {
      display: flex;
      gap: 18px;
      width: 100%;
      max-width: 1500px;
      max-height: 100%;
      align-items: stretch;
    }
    .theater-video { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
    .video-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }
    .video-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .theater-side {
      flex: 0 0 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      overflow-y: auto;
    }
    .theater-side .scoreboard { margin-top: 4px; }
    .theater-stats { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
    .theater-close {
      position: absolute;
      top: 16px;
      right: 18px;
      z-index: 1;
      width: 36px;
      height: 36px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
    }
    .theater-close:hover { border-color: var(--accent); }

    @media (max-width: 820px) {
      .theater { padding: 0; }
      .theater-inner { flex-direction: column; gap: 0; }
      .theater-side {
        flex: 0 0 auto;
        max-height: 42vh;
        border: none;
        border-bottom: 1px solid var(--border);
        border-radius: 0;
      }
    }
  </style>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
</head>
<body>

<header>
  <tr-logo compact></tr-logo>
  <div class="dot"></div>
  <h1>Live Touch Rugby Games</h1>
  <span class="live-count" id="liveCount" style="display:none">0 live</span>
  <div class="header-right">
    <span class="refresh-info" id="refreshInfo">refresh in 30s</span>
    <button class="refresh-btn" id="pauseBtn" onclick="togglePause()" title="Pause auto-refresh">
      <svg id="pauseIcon" viewBox="0 0 16 16" fill="currentColor">
        <rect x="4" y="3" width="3" height="10" rx="0.5"/>
        <rect x="9" y="3" width="3" height="10" rx="0.5"/>
      </svg>
      <svg id="playIcon" viewBox="0 0 16 16" fill="currentColor" style="display:none">
        <path d="M4 3v10l9-5z"/>
      </svg>
      <span id="pauseLabel">Pause</span>
    </button>
    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13.5 2.5A7 7 0 1 0 14.5 9"/>
        <polyline points="14.5 2 14.5 6 10.5 6"/>
      </svg>
      <span id="refreshLabel">Refresh</span>
    </button>
  </div>
</header>

<main>
  <div id="loading">
    <div class="spinner"></div>
    <div>Loading live games…</div>
  </div>
  <div id="empty" style="display:none">
    No live games right now
    <p>Games appear here when an annotator enables live mode.</p>
  </div>
  <div class="grid" id="grid"></div>
  <div id="recent-section" style="display:none">
    <div class="section-label">Recent</div>
    <div class="grid" id="recent-grid"></div>
  </div>
</main>

<div class="theater" id="theater">
  <button class="theater-close" onclick="closeTheater()" title="Close (Esc)">✕</button>
  <div class="theater-inner">
    <div class="theater-video"><div class="video-frame" id="theaterFrame"></div></div>
    <aside class="theater-side" id="theaterSide"></aside>
  </div>
</div>

<script>
const STALE_MS           = 2 * 60 * 1000;

function isGameLive(g) {
  if (g.finished) return false;
  if (!g.updatedAt) return true;
  return (Date.now() - new Date(g.updatedAt).getTime()) < STALE_MS;
}

function fmtTime(seconds) {
  const s = Math.floor(seconds);
  const m = Math.floor(s / 60);
  const h = Math.floor(m / 60);
  if (h > 0) return `${h}:${String(m % 60).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;
  return `${m}:${String(s % 60).padStart(2,'0')}`;
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

// Derive the game start clock time from when the row was last written and the
// elapsed in-game seconds. Approximate (drifts a little for finished games that
// stopped writing) but accurate enough for a card label.
function fmtStartTime(iso, elapsedSeconds) {
  if (!iso) return '';
  const d = new Date(new Date(iso).getTime() - (Number(elapsedSeconds) || 0) * 1000);
  if (Number.isNaN(d.getTime())) return '';
  return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function eventTimeline(g) {
  if (!g.tries || !g.tries.length) return '';
  let s1 = 0, s2 = 0, halves = 0;
  const rows = g.tries.map(t => {
    const type    = t.type || 'Try';
    const isT1    = t.scorer === 'Team 1';
    const isT2    = t.scorer === 'Team 2';
    const team    = isT1 ? (g.team1 || 'Team 1') : isT2 ? (g.team2 || 'Team 2') : '';
    const time    = `<span class="ev-time">${fmtTime(t.time)}</span>`;

    if (type === 'Try') {
      if (isT1) s1++; else if (isT2) s2++;
      const score = `<span class="ev-score">${s1}–${s2}</span>`;
      if (isT1) return `<div class="ev-row ev-try">${time}<span class="ev-left">${team}</span>${score}<span></span></div>`;
      if (isT2) return `<div class="ev-row ev-try">${time}<span></span>${score}<span class="ev-right">${team}</span></div>`;
      return '';
    }

    if (type === 'Penalty Attack' || type === 'Penalty Defence') {
      const cls   = type === 'Penalty Attack' ? 'pen-atk' : 'pen-def';
      const label = type === 'Penalty Attack' ? 'Pen ↑' : 'Pen ↓';
      const tag   = `<span class="ev-score ev-tag ${cls}">${label}</span>`;
      if (isT1) return `<div class="ev-row">${time}<span class="ev-left">${team}</span>${tag}<span></span></div>`;
      if (isT2) return `<div class="ev-row">${time}<span></span>${tag}<span class="ev-right">${team}</span></div>`;
      return '';
    }

    if (type === 'Game Start') {
      halves++;
      return `<div class="ev-row ev-marker">${time}<span class="ev-marker-label">— ${ordinal(halves)} half start —</span></div>`;
    }
    if (type === 'Game End') {
      const n = halves || 1;
      return `<div class="ev-row ev-marker">${time}<span class="ev-marker-label">— end of ${ordinal(n)} half —</span></div>`;
    }
    return '';
  }).join('');
  return `<div class="ev-section">
    <div class="ev-section-label">Event Log</div>
    ${rows}
  </div>`;
}

function metaLineHtml(g) {
  const parts = (g.name || '').split('_');
  const date  = fmtDate(g.updatedAt);
  const start = fmtStartTime(g.updatedAt, g.timeSeconds);
  let year = '', division = '', competition = '';
  if (parts.length >= 3) {
    year        = parts[0];
    division    = parts[1];
    competition = parts.slice(2, parts.length - 2).join(' ');
  }
  const labels = [date, start, competition, year, division].filter(Boolean);
  return labels.length ? `<div class="card-meta">${labels.join(' · ')}</div>` : '';
}

function scoreboardHtml(g, bumped) {
  const bump1 = bumped && bumped.t1 ? ' bump' : '';
  const bump2 = bumped && bumped.t2 ? ' bump' : '';
  return `
    <div class="team">
      <div class="team-name">${g.team1 || 'Team 1'}</div>
      <div class="score${bump1}">${g.score1}</div>
    </div>
    <div class="divider">–</div>
    <div class="team">
      <div class="team-name">${g.team2 || 'Team 2'}</div>
      <div class="score${bump2}">${g.score2}</div>
    </div>`;
}

function statsInnerHtml(g) {
  const fmt = (n, d) => d > 0 ? `${n}/${d}` : '–';
  return `
    <div class="stats-row">
      <div class="stats-label">Tries</div>
      <div class="stats-val">${fmt(g.score1, g.poss1)}</div>
      <div class="stats-val">${fmt(g.score2, g.poss2)}</div>
    </div>
    <div class="stats-row">
      <div class="stats-label">Completions</div>
      <div class="stats-val">${fmt(g.comps1, g.poss1)}</div>
      <div class="stats-val">${fmt(g.comps2, g.poss2)}</div>
    </div>
    ${eventTimeline(g)}`;
}

function renderCard(g, isLive, bumped) {
  const badge = isLive
    ? `<span class="live-badge">LIVE</span>`
    : `<span class="ended-badge">FT</span>`;
  const expandBtn = TR.extractVideoId(g.youtubelink)
    ? `<button class="expand-btn" onclick="event.stopPropagation(); openTheater('${g.name}')">▶ Watch</button>`
    : '';
  return `
  <div class="card" onclick="this.querySelector('.stats-panel').classList.toggle('open')">
    <div class="card-header">
      ${badge}
      ${expandBtn}
      <span class="game-time">${fmtTime(g.timeSeconds)}</span>
    </div>
    ${metaLineHtml(g)}
    <div class="scoreboard">${scoreboardHtml(g, bumped)}</div>
    <div class="stats-panel">${statsInnerHtml(g)}</div>
  </div>`;
}

const prevScores = {};
let lastGames    = [];

function bumpFor(g) {
  const prev = prevScores[g.name];
  return prev ? { t1: g.score1 > prev.score1, t2: g.score2 > prev.score2 } : null;
}

// ── Theater overlay (large video + scoreboard/stats) ──────────────
let theaterGame = null; // sheet name of the game currently expanded

function theaterSideHtml(g, isLive, bumped) {
  const badge = isLive
    ? `<span class="live-badge">LIVE</span>`
    : `<span class="ended-badge">FT</span>`;
  return `
    <div class="card-header">
      ${badge}
      <span class="game-time">${fmtTime(g.timeSeconds)}</span>
    </div>
    ${metaLineHtml(g)}
    <div class="scoreboard">${scoreboardHtml(g, bumped)}</div>
    <div class="theater-stats">${statsInnerHtml(g)}</div>`;
}

function openTheater(name) {
  const g = lastGames.find(x => x.name === name);
  if (!g) return;
  const id = TR.extractVideoId(g.youtubelink);
  if (!id) return;
  theaterGame = name;
  const frame = document.getElementById('theaterFrame');
  // Only (re)build the iframe when the video changes, so refreshes don't reload it.
  if (frame.dataset.vid !== id) {
    frame.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    frame.dataset.vid = id;
  }
  document.getElementById('theaterSide').innerHTML = theaterSideHtml(g, isGameLive(g), bumpFor(g));
  document.getElementById('theater').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeTheater() {
  const frame = document.getElementById('theaterFrame');
  frame.innerHTML = '';        // stop playback
  frame.dataset.vid = '';
  theaterGame = null;
  document.getElementById('theater').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeTheater(); });

function render(games) {
  const grid          = document.getElementById('grid');
  const empty         = document.getElementById('empty');
  const recentSection = document.getElementById('recent-section');
  const recentGrid    = document.getElementById('recent-grid');
  const liveCount     = document.getElementById('liveCount');
  const now           = Date.now();

  const active = games.filter(g => {
    if (g.finished) return false;
    if (!g.updatedAt) return true;
    return (now - new Date(g.updatedAt).getTime()) < STALE_MS;
  });

  const recent = games.filter(g => {
    const age = g.updatedAt ? (now - new Date(g.updatedAt).getTime()) : 0;
    return g.finished || age >= STALE_MS;
  }).sort((a, b) => {
    const ta = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
    const tb = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
    return tb - ta; // most recently updated first
  });

  if (active.length) {
    liveCount.textContent   = `${active.length} live`;
    liveCount.style.display = '';
  } else {
    liveCount.style.display = 'none';
  }

  if (active.length) {
    empty.style.display = 'none';
    grid.innerHTML = active.map(g => renderCard(g, true, bumpFor(g))).join('');
  } else {
    grid.innerHTML = '';
    empty.style.display = recent.length ? 'none' : 'block';
  }

  if (recent.length) {
    recentSection.style.display = 'block';
    recentGrid.innerHTML = recent.map(g => renderCard(g, false, bumpFor(g))).join('');
  } else {
    recentSection.style.display = 'none';
  }

  // Keep the open theater's scoreboard/stats fresh (but not the video iframe).
  // Done before the prevScores snapshot so bumpFor() still sees the prior scores.
  lastGames = games;
  if (theaterGame) {
    const g = games.find(x => x.name === theaterGame);
    if (g) {
      document.getElementById('theaterSide').innerHTML = theaterSideHtml(g, isGameLive(g), bumpFor(g));
    }
  }

  // Snapshot scores AFTER rendering so the next refresh diff is accurate.
  for (const g of games) prevScores[g.name] = { score1: g.score1, score2: g.score2 };
}

let firstLoad = true;
async function fetchLive() {
  try {
    const resp   = await fetch(`${TR.APPS_SCRIPT_URL}?secret=${encodeURIComponent(TR.secret() || 'm30')}&action=live`);
    const result = await resp.json();
    if (result.ok) {
      if (firstLoad) {
        document.getElementById('loading').style.display = 'none';
        firstLoad = false;
      }
      render(result.games);
    }
  } catch (err) {
    // keep showing last state on network error
    if (firstLoad) {
      document.getElementById('loading').innerHTML =
        '<div style="color:#ef4444">Couldn\'t reach the server. Retrying…</div>';
    }
  }
}

const REFRESH_INTERVAL = 30;
let countdown = REFRESH_INTERVAL;
let tickTimer  = null;
let paused     = false;

function setRefreshInfo(text) {
  document.getElementById('refreshInfo').textContent = text;
}

function startCountdown() {
  clearInterval(tickTimer);
  if (paused) { setRefreshInfo('paused'); return; }
  countdown = REFRESH_INTERVAL;
  tickTimer = setInterval(() => {
    countdown--;
    if (countdown <= 0) {
      clearInterval(tickTimer);
      doRefresh();
    } else {
      setRefreshInfo(`refresh in ${countdown}s`);
    }
  }, 1000);
}

async function doRefresh() {
  const btn   = document.getElementById('refreshBtn');
  const label = document.getElementById('refreshLabel');
  btn.classList.add('spinning');
  label.textContent = 'Refreshing';
  setRefreshInfo('updating…');
  await fetchLive();
  btn.classList.remove('spinning');
  label.textContent = 'Refresh';
  startCountdown();
}

function manualRefresh() {
  clearInterval(tickTimer);
  doRefresh();
}

function togglePause() {
  paused = !paused;
  document.getElementById('pauseIcon').style.display  = paused ? 'none' : '';
  document.getElementById('playIcon').style.display   = paused ? '' : 'none';
  document.getElementById('pauseLabel').textContent   = paused ? 'Resume' : 'Pause';
  document.getElementById('pauseBtn').title           = paused ? 'Resume auto-refresh' : 'Pause auto-refresh';
  document.querySelector('.dot').style.animationPlayState = paused ? 'paused' : 'running';
  if (paused) {
    clearInterval(tickTimer);
    setRefreshInfo('paused');
  } else {
    startCountdown();
  }
}

doRefresh();
</script>
