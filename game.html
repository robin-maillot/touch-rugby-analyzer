// Missing refs are dropped from the draft the moment it is edited, so the
// buttons' indices and the stored refs can't drift apart. A playlist you edit
// is a playlist you've seen, so silently shedding a ref you were just told
// about is honest.
function plLive(){
  return TR.playlists.resolve(plDraft.refs,rows).events.map(TR.evId);
}
// Reordering rebuilds the whole body, so the ↑ / ↓ / ✕ just pressed is a
// destroyed node and focus falls to <body> — the next Tab then restarts at the
// top of the page. plDrill, plSaveAndBack, plDelete and drill all place focus
// explicitly for this reason; this is the screen where the control is pressed
// repeatedly, so it is the one where losing focus hurts most.
//
// The button is found by comparing dataset values rather than by interpolating
// an index into a selector — the convention this file settled on in 00b52a3 /
// 6892607 — and the attribute for each key is a fixed literal here, never built
// from data either.
function plOrdFocus(key,n){
  const q={plup:'[data-plup]',pldown:'[data-pldown]',pldrop:'[data-pldrop]'}[key];
  const t=[...$('sheetBody').querySelectorAll(q)].find(el=>el.dataset[key]===String(n));
  // At either end the matching button renders disabled and refuses focus, so
  // the sheet container takes it instead — plDrill's own no-target fallback.
  ((t&&!t.disabled)?t:$('sheet')).focus();
}
function plMove(n,d){ plDraft.refs=TR.playlists.reorder(plLive(),n,n+d);
  $('sheetBody').innerHTML=playlistSheet();
  // Follow the row: the same control, at the index the event moved to.
  plOrdFocus(d<0?'plup':'pldown',n+d); }
function plDrop(n){ const r=plLive(); r.splice(n,1); plDraft.refs=r;
  $('sheetBody').innerHTML=playlistSheet();
  // That row is gone, so ✕ at the same index is now the row that took its
  // place — or, when the last row was removed, the one before it.
  plOrdFocus('pldrop',Math.min(n,r.length-1)); }

// The save half of leaving the reorder screen, on its own so that every exit
// shares it — the ‹ Playlists title, Done, the scrim and Escape (the last three
// via closeSheet). Resolves true when the draft has been dealt with and may be
// cleared, false when it must be kept and the user left where they are.
//
// Mirrors plDelete()'s shape: await the server call BEFORE the caller clears
// plEdit/plDraft or repaints, so a rejection (offline, or the lock path in
// Code.gs) leaves the draft untouched instead of silently losing the
// rename/reorder/removals just made. d is captured up front, before anything
// can destroy the #plName input that oninput keeps it in sync with, so a retry
// after a failure still saves the name the user actually typed.
async function plCommit(){
  const id=plEdit, d=plDraft;
  const p=plById(id);
  if(!p||!d) return true;
  if(d.name===p.name&&(d.note||'')===(p.note||'')&&d.refs.join('\n')===p.refs.join('\n')) return true;
  if(!d.name.trim()){ alert('A playlist needs a name.'); return false; }
  plSaving=true;
  try{
    await TR.playlists.save(TR.secret(),{id,name:d.name.trim(),note:d.note,refs:d.refs});
    PL=await TR.playlists.load(TR.secret());
  }catch(e){ alert(e.message); return false; }
  finally{ plSaving=false; }
  if(plOpen===id) render();
  return true;
}

async function plSaveAndBack(){
  // One leave, one save: a scrim tap and an Escape can land within a round
  // trip of each other, and the second must not write the draft again.
  if(plSaving) return;
  const id=plEdit;
  if(!await plCommit()) return;
  plEdit=null; plDraft=null;
  $('sheetBody').innerHTML=playlistSheet(); paintPlHead();
  // Same reason as the filter sheet's drill(): the row being left is gone
  // after the innerHTML swap, so focus must be placed explicitly or it
  // falls to <body> and the next Tab restarts from the top of the page.
  const t=[...$('sheetBody').querySelectorAll('[data-pledit]')]
    .find(el=>el.dataset.pledit===id);
  (t||$('sheet')).focus();
}

async function plDelete(){
  const id=plEdit;
  if(!confirm('Delete this playlist? This cannot be undone.')) return;
  try{
    await TR.playlists.remove(TR.secret(),id);
    PL=await TR.playlists.load(TR.secret());
  }catch(e){ alert(e.message); return; }
  // Never leave the page playing a list that no longer exists.
  if(plOpen===id){ plOpen=null; render(); }
  plEdit=null; plDraft=null;
  $('sheetBody').innerHTML=playlistSheet(); paintPlHead();
  // Same reason as plDrill/plSaveAndBack: the "Delete this playlist" button
  // that had focus is gone after the innerHTML swap, so focus falls to
  // <body> and the next Tab restarts from the top of the page. Unlike those
  // paths there's no row to return to — id itself no longer exists — so
  // land on the sheet container, same as plDrill's own no-target case.
  $('sheet').focus();
}

// Committing is one write, however many filters the collection was gathered
// across.
// A naming field rather than prompt(): prompt() appears nowhere in this
// codebase, and iOS standalone web apps handle it badly.
function addToBody(){
  return `<p class="win-note">Adding <b>${sel.size}</b> event${sel.size===1?'':'s'}.</p>`+
    '<div class="glist">'+PL.map(p=>`<button data-addto="${esc(p.id)}">
        ${esc(p.name)}<span class="gs">${p.refs.length} events</span></button>`).join('')+
    '</div>'+
    `<div class="grp"><h3>New playlist</h3>
      <input class="srch" id="newPlName" placeholder="Name it…">
      <button class="icon-btn" style="width:100%;height:38px" data-addnew="1">
        ＋ Create and add ${sel.size}</button></div>`;
}

async function addTo(id){
  const pl=id?plById(id):null;
  const name=pl?pl.name:($('newPlName').value||'').trim();
  if(!pl&&!name){ $('newPlName').focus(); return; }
  // Existing refs first, new ones appended in the order they were ticked — the
  // reorder screen is where an order is chosen deliberately. The Set drops a
  // re-tick of something already in the playlist.
  const refs=[...new Set([...(pl?pl.refs:[]),...sel])];
  if(refs.length>TR.playlists.MAX_REFS){
    alert(`A playlist holds at most ${TR.playlists.MAX_REFS} events.`); return;
  }
  const n=sel.size;
  try{
    await TR.playlists.save(TR.secret(),{id:pl?pl.id:'',name,note:pl?pl.note:'',refs});
    PL=await TR.playlists.load(TR.secret());
  }catch(e){ alert(e.message); return; }
  // exitCollect(), not toggleCollect(): the collection has just been committed,
  // so leaving the mode is the intent — toggle only happened to do that because
  // collect was necessarily on. Every other path that leaves the mode says so
  // the same way.
  closeSheet(); exitCollect(); render();
  // #count only exists in the non-playlist filter bar (render()'s `if(pl)`
  // branch never creates it), so don't assume it survived whatever render()
  // just did — a save can legitimately land with no such element on screen.
  const countEl=$('count');
  if(countEl) countEl.textContent=`Added ${n} to ${name}`;
}

function gameSheet(){
  const keys=[...new Set(rows.map(r=>r.game))].filter(Boolean)
    .sort((a,b)=>(order[a]??999)-(order[b]??999));
  if(!keys.length)return '<div class="empty">No games loaded yet.</div>';
  const allBtn=`<button class="${picked&&game===''?'on':''}" data-game="">
      All games
      <span class="gs">${rows.length} events</span>
    </button>`;
  return '<div class="glist">'+allBtn+keys.map(k=>{
    const m=meta[k]||{}, has=!!TR.player.providerFor(m);
    return `<button class="${k===game?'on':''}" data-game="${esc(k)}">
      ${esc(labels[k]||k)}
      <span class="gs">${has?'▶ video':'no video'} · ${rows.filter(r=>r.game===k).length} events</span>
    </button>`}).join('')+'</div>';
}

function catVals(c){return [...new Set(events.map(c.of).filter(Boolean))]}

// A category with one option can't narrow anything — every event already shares
// that value — so it's noise. Kept if it's actively filtered, so a live filter
// never becomes invisible and unremovable.
function catShown(c){return catVals(c).length>1||F[c.key].size>0}

function filterSheet(){
  if(!picked)return '<div class="empty">Pick a game first.</div>';
  // Spec §8: the filters are suppressed while a playlist plays, and the Filter
  // button is hidden to say so. This is the sheet refusing to be a second way
  // in — a chip tapped here would mutate F and light up while render() ignores
  // F entirely, then collapse the list to that filter on leaving the playlist.
  if(plOpen)return '<div class="empty">Filters are off while a playlist is playing.<br>'+
    'Tap the playlist’s ✕ to go back to the filtered list.</div>';
  return fCat?catOpts(fCat):catList();
}

function catList(){
  return `<input class="srch" id="q" placeholder="Search name, comment, move…" value="${esc(F.q)}"
      oninput="F.q=this.value;render()">`+
    '<div class="glist">'+FCATS.filter(catShown).map(c=>{
      const set=F[c.key].size>0;
      return `<button class="fcat${set?' on':''}" data-cat="${c.key}" onclick="drill('${c.key}')">
        <span class="fc-t">${c.title}</span>
        <span class="fc-v${set?' set':''}">${esc(TR.filterSummary([...F[c.key]]))}</span>
        <span class="fc-x">›</span>
      </button>`}).join('')+'</div>'+
    `<button class="icon-btn" style="width:100%;height:40px" onclick="clearF()">Clear all filters</button>`;
}

// The title doubles as the back control when drilled in. Painted rather than
// re-rendered so drilling doesn't have to reopen the sheet.
function paintFilterHead(){
  const c=FCATS.find(x=>x.key===fCat), h=$('sheetTitle');
  h.innerHTML=c?`‹ ${c.title}`:'Filter events';
  h.className=c?'back':'';
  h.onclick=c?()=>drill(null):null;
  backCtl(h,!!c,c?`Back to all filters, ${c.title}`:'',()=>drill(null));
}

// A heading is not a control, so while it doubles as one it has to say so and
// answer the keyboard too — tapping it is otherwise the only way out of a
// category. Shared with openSheet, which resets the head for the other kinds.
//
// label and onBack are passed because two sheets drill now: the filter sheet's
// categories and the playlists sheet's reorder screen. A screen reader must
// hear which one it is leaving, and Enter must do the same thing the tap does.
function backCtl(h,on,label,onBack){
  if(!on){['role','tabindex','aria-label'].forEach(a=>h.removeAttribute(a)); h.onkeydown=null; return}
  h.setAttribute('role','button');
  h.setAttribute('tabindex','0');
  h.setAttribute('aria-label',label||'Back');
  h.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault(); onBack()}};
}

function drill(key){
  const from=fCat;
  fCat=key; fNarrow='';
  $('sheetBody').innerHTML=filterSheet();
  paintFilterHead();
  // The control that was just activated has been rendered out of existence, and
  // focus falls to <body> unless it is put somewhere — which would make the next
  // Tab restart at the top of the page. Going in: the first option. Coming back:
  // the row you came from. Never a search box, for openSheet's keyboard reason.
  const t = key ? $('sheetBody').querySelector('.opts .chip')
                : from && $('sheetBody').querySelector(`.fcat[data-cat="${from}"]`);
  (t||$('sheet')).focus();
}

function catOpts(key){
  const c=FCATS.find(x=>x.key===key);
  if(!c)return '<div class="empty">No such filter.</div>';
  const all=catVals(c);
  const vals=all.filter(v=>TR.optMatch(v,fNarrow));
  const box=all.length>NARROW_AT
    ? `<input class="srch" id="narrow" placeholder="Narrow ${c.title.toLowerCase()}…"
        value="${esc(fNarrow)}" oninput="narrow(this.value)">` : '';
  return box+`<div class="grp"><div class="opts" id="optWrap">${optChips(key,vals)}</div></div>`;
}

// Shared by the first paint and every keystroke, so the two can't drift.
function optChips(key,vals){
  if(!vals.length)return `<div class="empty">Nothing matches “${esc(fNarrow)}”.</div>`;
  return vals.map(v=>`<button class="chip ${F[key].has(v)?'on':''}"
    data-k="${esc(key)}" data-v="${esc(String(v))}">${esc(v)}</button>`).join('');
}

// Redraws only the chips: re-rendering the body would blow away focus and the
// caret mid-keystroke, the same reason paintWin exists.
function narrow(v){
  fNarrow=v;
  const c=FCATS.find(x=>x.key===fCat);
  $('optWrap').innerHTML=optChips(fCat,catVals(c).filter(x=>TR.optMatch(x,fNarrow)));
}

function tog(k,v,el){F[k].has(v)?F[k].delete(v):F[k].add(v);el.classList.toggle('on');render()}
function clearF(){F={type:new Set(),team:new Set(),name:new Set(),move:new Set(),
    comp:new Set(),div:new Set(),year:new Set(),q:''};
  drill(null); render()}
</script>
</body>
</html>
