<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game — Touch Rugby Analyzer</title>
<link rel="icon" href="favicon-32x32.png">
<style>
  :root{
    --bg:#0b0e14; --surface:#141925; --surface2:#1b2230; --border:#242c3d;
    --text:#e9ecf3; --dim:#8a93a6; --accent:#3b82f6;
    --try:#22c55e; --turn:#f97316; --patk:#ef4444; --pdef:#b91c1c; --game:#3b82f6; --review:#a855f7;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;flex-direction:column;height:100dvh}

  /* ── Top bar: one row, 48px, never wraps ───────────────────── */
  .topbar{display:flex;align-items:center;gap:8px;padding:0 10px;height:48px;
    flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border)}
  .topbar img{width:24px;height:24px;border-radius:5px;flex-shrink:0}
  .game-btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;
    background:none;border:none;color:var(--text);font:inherit;padding:0;cursor:pointer;text-align:left}
  .game-btn .g-name{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%}
  .game-btn .g-sub{font-size:.65rem;color:var(--dim);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;max-width:100%}
  .icon-btn{flex-shrink:0;background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;min-width:40px;height:36px;font-size:.8rem;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 8px}
  .icon-btn:active{background:var(--accent)}
  .badge{background:var(--accent);color:#fff;border-radius:9px;font-size:.62rem;
    padding:1px 5px;font-weight:700;line-height:1.4}

  /* Collapsed events: unlike cinema (which hides everything), the list header
     stays visible — it carries the counts, the filters and the way back. The
     video absorbs the height the rows gave up. In landscape the frame drops
     back to a column so the video gets the full width too, rather than leaving
     a stranded one-row column beside it. */
  body.list-collapsed .list{display:none}
  body.list-collapsed .left{flex:1 1 auto;min-height:0}
  body.list-collapsed .stage{flex:1 1 auto;aspect-ratio:auto;height:auto;min-height:0}
  /* The collapsed .right is one header row tall, so it must stop claiming a
     share of the frame — otherwise it splits the space with the video and the
     collapse buys almost nothing. */
  body.list-collapsed .right{flex:0 0 auto}
  @media (orientation:landscape){
    body.list-collapsed .frame{flex-direction:column}
    body.list-collapsed .left{width:100%;border-right:none}
  }

  /* Layout skeleton. Declared for ALL widths, not just landscape, so that
     cinema mode has a flex axis to grow the stage along on a phone. */
  .frame{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .left{display:flex;flex-direction:column;flex-shrink:0;min-height:0}
  .right{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}

  /* ── Video: sized by ASPECT RATIO, not a vh fraction ───────── */
  .stage{flex-shrink:0;background:#000;position:relative;width:100%;
    aspect-ratio:16/9;overflow:hidden;touch-action:none}
  .stage.zoomed{cursor:grab}
  .stage.zoomed.panning{cursor:grabbing}
  #ytZoom{position:absolute;inset:0;transform-origin:center center;transition:transform .18s ease}
  /* While panning, the transform must track the finger with no easing or the
     frame lags behind it. */
  .stage.panning #ytZoom{transition:none}
  #ytZoom iframe{width:100%;height:100%;display:block;border:0}
  /* Zoomed, the drag belongs to us, not to YouTube's own controls — otherwise
     the iframe swallows every pointermove and the frame can't be moved. Our own
     transport drives playback, so nothing is lost. */
  .stage.zoomed #ytZoom iframe{pointer-events:none}
  .stage-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--dim);font-size:.8rem;text-align:center;padding:20px}
  /* Sized to its text, not to the frame: a full-width bar over the picture hides
     more of the play than the label is worth. */
  .now-pill{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);
    display:inline-flex;width:auto;align-items:center;gap:6px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
    background:rgba(11,14,20,.82);backdrop-filter:blur(6px);border-radius:8px;padding:5px 8px;
    font-size:.7rem;pointer-events:none;opacity:0;transition:opacity .2s}
  .now-pill.show{opacity:1}
  .zoom-tag{position:absolute;top:8px;right:8px;background:rgba(11,14,20,.82);border-radius:6px;
    padding:2px 7px;font-size:.66rem;color:var(--dim);opacity:0;transition:opacity .2s}
  .zoom-tag.show{opacity:1}
  .cine-btn{position:absolute;top:8px;left:8px;background:rgba(11,14,20,.82);border:1px solid var(--border);
    color:var(--text);border-radius:6px;width:34px;height:30px;font-size:.8rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  body.cinema .cine-btn{top:auto;bottom:12px;left:12px}
  /* Zoom is an action on the picture, so it lives on the picture — and moving it
     off the transport made room there for prev/next/loop. */
  .zoom-btn{position:absolute;top:8px;left:48px;background:rgba(11,14,20,.82);
    border:1px solid var(--border);color:var(--text);border-radius:6px;
    width:34px;height:30px;font-size:.8rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .zoom-btn:disabled{opacity:.4}
  body.cinema .zoom-btn{top:auto;bottom:12px;left:52px}
  .t-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* fullscreen-ish: video eats the whole screen */
  body.cinema .topbar,body.cinema .listhead,body.cinema .list,body.cinema .scrub{display:none}
  /* the whole right column goes, not just its children — an empty flex column
     would still claim its share of the frame and starve the stage */
  body.cinema .right{display:none}
  body.cinema .left{flex:1 1 auto;min-height:0}
  body.cinema .stage{flex:1 1 auto;aspect-ratio:auto;height:auto;min-height:0}

  /* ── Transport: ONE row ────────────────────────────────────── */
  .transport{display:flex;align-items:center;gap:6px;padding:6px 8px;flex-shrink:0;
    background:var(--surface);border-bottom:1px solid var(--border)}
  .t-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;
    height:38px;min-width:42px;padding:0 6px;font-size:.75rem;cursor:pointer;display:inline-flex;
    align-items:center;justify-content:center;flex-shrink:0}
  .t-btn:disabled{opacity:.4}
  .t-btn.play{background:var(--accent);border-color:var(--accent);min-width:52px;font-size:.9rem}
  /* On the seek bar, not in the transport — and pointer-events:none so it can
     never swallow a drag on the bar underneath it. */
  /* Above the event marks (which are appended after it) and on an opaque
     ground, or the two print over each other and neither reads. It masks the
     marks it covers, so on a phone it shows elapsed only — half the width, and
     the position matters more than the duration. */
  .scrub-time{position:absolute;right:0;top:0;height:100%;display:flex;align-items:center;
    z-index:2;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.64rem;
    color:var(--dim);font-variant-numeric:tabular-nums;pointer-events:none;
    padding:0 6px 0 12px;
    background:linear-gradient(90deg,transparent,var(--surface) 12px)}
  .scrub-time b{color:var(--text);font-weight:600}
  .scrub-time .dur{display:none}
  @media (min-width:600px){ .scrub-time .dur{display:inline} }
  .t-time{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.68rem;color:var(--dim);
    flex:1 1 auto;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t-time b{color:var(--text);font-weight:600}
  .seek{height:100%;flex-shrink:0}
  .scrub{width:100%;height:22px;position:relative;background:var(--surface);flex-shrink:0;
    border-bottom:1px solid var(--border);cursor:pointer;touch-action:none}
  .scrub-fill{position:absolute;left:0;top:9px;height:4px;background:var(--accent);border-radius:2px}
  .scrub-track{position:absolute;left:0;right:0;top:9px;height:4px;background:var(--surface2);border-radius:2px}
  .scrub-thumb{position:absolute;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;
    margin-left:-6px;pointer-events:none}
  .scrub-mark{position:absolute;top:8px;width:2px;height:6px;border-radius:1px;opacity:.85}

  /* ── Filter bar ────────────────────────────────────────────── */
  /* The chips scroll sideways; the collapse control must not scroll away with
     them, so it sits outside the scroller in a shared header row. */
  .listhead{display:flex;align-items:center;flex-shrink:0;background:var(--bg);
    border-bottom:1px solid var(--border)}
  .filterbar{display:flex;align-items:center;gap:6px;padding:7px 8px;
    flex:1 1 auto;min-width:0;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .filterbar::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:16px;padding:5px 11px;font-size:.72rem;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:5px;min-height:32px}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip .x{opacity:.75;font-size:.8rem}
  /* Drill entry chip: distinct from the on/off filter chips beside it — its
     own accent (matches the .move tag in event cards) rather than the
     blue "filter applied" accent. */
  .chip.drill{border-color:#7dd3fc}
  .chip.drill b{color:#7dd3fc;font-weight:700;margin-left:3px}
  /* Playing a playlist: its own accent (the --review purple), distinct from
     both the blue "filter applied" chips and the drill chip's cyan. */
  .chip.pl{background:#231733;border-color:var(--review);color:#e9d5ff}
  .count.warn{color:var(--turn)}
  .count{color:var(--dim);font-size:.7rem;flex-shrink:0;padding-left:2px;white-space:nowrap}
  .collapse-btn{flex-shrink:0;background:none;border:none;border-left:1px solid var(--border);
    color:var(--dim);font-size:.9rem;line-height:1;cursor:pointer;
    width:40px;height:38px;display:flex;align-items:center;justify-content:center}
  .collapse-btn:active{color:var(--text)}

  /* ── Event list: cards, never a sideways table ─────────────── */
  .list{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:6px 8px calc(12px + var(--safe-b))}
  .ev{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;
    background:var(--surface);border-left:3px solid var(--border);border-radius:8px;
    padding:9px 10px;margin-bottom:6px;cursor:pointer;min-height:52px}
  .ev:active{background:var(--surface2)}
  .ev.active{outline:2px solid var(--accent);background:var(--surface2)}
  .ev-t{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;color:var(--dim)}
  .ev-main{min-width:0}
  .ev-name{font-size:.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev-meta{font-size:.66rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-top:1px;display:flex;gap:5px;align-items:center}
  .tag{font-size:.6rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:2px 6px;border-radius:4px;flex-shrink:0}
  .team{font-size:.66rem;color:var(--text);flex-shrink:0;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:11ch}
  /* Names which match a card belongs to — shown in all-games mode, and while a
     playlist plays, because a playlist spans matches whatever game is picked
     (the headline case is eleven backdoors from four different matches, which
     would otherwise be eleven indistinguishable rows under one match's header).
     Its own class, not a reuse of .team (which is bold/light and sized for a
     team name) — this wants the dimmer, wider treatment a match label needs. */
  .gmatch{font-size:.66rem;color:var(--dim);flex-shrink:0;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:18ch}
  .move{background:var(--surface2);border:1px solid var(--border);border-radius:4px;
    padding:1px 5px;font-size:.62rem;color:#7dd3fc;flex-shrink:0}
  .empty{color:var(--dim);text-align:center;padding:36px 20px;font-size:.82rem}

  /* ── Collect mode ──────────────────────────────────────────── */
  /* The tick replaces the timestamp column rather than adding one, so a row
     gains no width here and loses none when not collecting. */
  body.collect .ev{grid-template-columns:34px 1fr}
  body.collect .list{padding-bottom:64px}
  .tick{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:.75rem;color:transparent}
  .ev.sel .tick{background:var(--review);border-color:var(--review);color:#fff}
  .ev.sel{background:var(--surface2);border-left-color:var(--review)!important}
  .tray{display:none;background:#231733;border:1px solid var(--review);border-radius:8px;
    padding:8px 11px;margin:6px 8px 0;font-size:.72rem;color:#e9d5ff;line-height:1.45}
  body.collect .tray{display:block}
  .tray b{color:#fff}
  /* Pinned, so the count and the commit never scroll away from the rows being
     ticked. */
  .actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;
    align-items:center;gap:8px;padding:9px 10px;background:var(--surface);
    border-top:1px solid var(--review);padding-bottom:calc(9px + var(--safe-b))}
  body.collect .actionbar{display:flex}
  /* Collapsing the list hides only #list — .tray and .actionbar are its
     siblings, not its children — so without this the tray text and the pinned
     bar float over rows that aren't there. Hiding them, rather than exiting
     collect mode, is what lets a collection survive a collapse: ⌄ sits right
     beside ☑ in the same header row, and one mis-tap used to destroy an
     unbounded amount of collecting with no warning. Declared AFTER the
     body.collect rules above because it matches at the same specificity and
     has to win on source order. */
  body.list-collapsed .tray,
  body.list-collapsed .actionbar{display:none}
  /* .icon-btn declares its own `display`, and an author rule always beats the
     UA stylesheet's [hidden]{display:none} regardless of specificity — so
     without this, setting collectBtn.hidden (or filterBtn.hidden) would
     silently do nothing while a playlist plays. */
  #collectBtn[hidden],#filterBtn[hidden]{display:none}
  .actionbar .n{font-size:.75rem;font-weight:700;color:var(--review);white-space:nowrap}
  .actionbar .sp{flex:1 1 auto}
  .ab-go{background:var(--review);border:1px solid var(--review);color:#fff;border-radius:8px;
    height:36px;padding:0 13px;font-size:.78rem;font-weight:600;cursor:pointer}
  .ab-go:disabled{opacity:.35}

  /* ── Bottom sheet ──────────────────────────────────────────── */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
  .scrim.open{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
    border-radius:16px 16px 0 0;max-height:82dvh;display:none;flex-direction:column;
    padding-bottom:var(--safe-b)}
  .sheet.open{display:flex}
  .sheet-grab{width:36px;height:4px;background:var(--border);border-radius:2px;margin:8px auto 4px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 14px 10px;
    border-bottom:1px solid var(--border)}
  .sheet-head h2{margin:0;font-size:.92rem}
  /* Drilled in, the title is the only way back, so it needs a thumb-sized box
     like the Done button beside it. The negative margin cancels the padding,
     so the box grows around the text rather than shoving it. */
  .sheet-head h2.back{cursor:pointer;color:var(--accent);
    padding:10px 12px;margin:-10px -12px;border-radius:8px}
  .sheet-head h2.back:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .sheet-body{overflow-y:auto;overflow-x:hidden;padding:10px 14px calc(14px + var(--safe-b))}
  .opts{min-width:0}
  .grp{margin-bottom:14px}
  .grp h3{margin:0 0 7px;font-size:.68rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .srch{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:10px 12px;font-size:.85rem;margin-bottom:12px}
  .glist button{display:block;width:100%;text-align:left;background:var(--surface2);
    border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;
    margin-bottom:6px;font-size:.8rem;cursor:pointer}
  .glist button.on{border-color:var(--accent);background:#16233c}
  .glist .gs{display:block;font-size:.66rem;color:var(--dim);margin-top:2px}

  /* Filter sheet category rows: a .glist button with the selection summary
     pulled onto the same line as the title, and a chevron at the end. The
     selector carries `.glist button` because the block rule above it is a
     class-plus-element and would otherwise win over a bare `.fcat`. */
  .glist button.fcat{display:flex;align-items:center;gap:8px}
  .fcat .fc-t{flex:1;min-width:0}
  .fcat .fc-v{color:var(--dim);font-size:.72rem;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;max-width:52%}
  .fcat .fc-v.set{color:var(--accent)}
  .fcat .fc-x{color:var(--dim);font-size:.8rem;flex-shrink:0}

  /* Window sheet: the custom field sits in the same row as the preset chips,
     sized to the three digits it can ever hold rather than stretching. */
  .win-num{width:62px;background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:0 8px;height:32px;font-size:.78rem}
  .win-note{color:var(--dim);font-size:.72rem;line-height:1.5;margin:2px 0 0}
  .win-note b{color:var(--text);font-weight:600}

  /* ── Moves sheet: reuses .grp/h3 for the section header, new minimal
     row styling of its own rather than the field annotators' .moves-* classes ── */
  .mv-scope{color:var(--dim);font-size:.7rem;margin:0 0 10px;line-height:1.4}
  .mv-row{display:grid;grid-template-columns:20px 1fr auto auto;gap:8px;align-items:center;
    padding:7px 0;border-bottom:1px solid var(--border);font-size:.8rem}
  .mv-row:last-child{border-bottom:none}
  .mv-rank{color:var(--dim);font-size:.7rem}
  .mv-count{color:var(--dim);font-size:.72rem;white-space:nowrap}
  .mv-rate{font-size:.78rem;font-weight:700;min-width:3.2em;text-align:right}
  .mv-rate.thin{color:var(--dim);font-weight:400}
  .mv-empty{color:var(--dim);text-align:center;padding:20px 0;font-size:.8rem}

  /* ── Playlists sheet ───────────────────────────────────────── */
  .pl-row{display:grid;grid-template-columns:1fr 44px;gap:6px;align-items:stretch;margin-bottom:6px}
  .pl-row button{background:var(--surface2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;font-size:.8rem;cursor:pointer;font-family:inherit}
  .pl-go{text-align:left;padding:10px 12px}
  .pl-go .gs{display:block;font-size:.66rem;color:var(--dim);margin-top:2px}
  .pl-row.on .pl-go{border-color:var(--review);background:#231733}
  .pl-edit{font-size:1rem;color:var(--dim)}
  /* Reorder rows: the label takes the timestamp's column too, ↑↓✕ take the
     right. Scoped to .sheet-body so it also outranks `body.collect .ev`, which
     would otherwise impose the two-column tick layout on a reorder row when the
     playlists sheet is opened mid-collection. */
  .sheet-body .ev.ord{grid-template-columns:1fr 70px;cursor:default}
  .ord-btns{display:flex;gap:3px;justify-self:end}
  .ord-btns button{width:30px;height:30px;border-radius:7px;background:var(--surface2);
    border:1px solid var(--border);color:var(--dim);font-size:.75rem;cursor:pointer}
  .pl-danger{width:100%;height:38px;margin-top:12px;background:var(--surface2);
    border:1px solid var(--pdef);color:#fca5a5;border-radius:8px;font-size:.78rem;
    cursor:pointer;font-family:inherit}
  /* Same footprint as .pl-danger below it, but this is not destructive, so it
     keeps the ordinary button colours. */
  .pl-export{width:100%;height:38px;margin-top:12px}

  /* ── Landscape: video beside the list ───────────────────────
     No min-width gate. A 667px-wide phone in landscape used to fall through to
     the portrait column, where a full-width 16:9 video is 375px tall — the whole
     viewport — putting the transport 115px below a body that can't scroll. */
  @media (orientation:landscape){
    .frame{flex-direction:row}
    .left{width:58%;min-width:0;border-right:1px solid var(--border)}
    .right{min-width:0}
    body.cinema .left{width:100%}
  }

  /* Eight transport buttons at 42px with 6px gaps want 394px of row; a 375px
     phone has 359px inside the padding. Tightening both to 38/4 brings it to
     348 and keeps every control reachable without a scroll. */
  @media (max-width:400px){
    .transport{gap:4px}
    .t-btn{min-width:38px;padding:0 4px}
  }

  /* Short and wide — a phone on its side. Aspect-ratio sizing is what makes the
     video big in portrait, but here it inverts: 16:9 across 58% of 812px is
     264px tall, and 48 + 264 + 16 + 51 = 379 in a 375px viewport, which clips
     the play button off the bottom. So in a short viewport the stage takes
     whatever height is left after the controls instead of dictating it, and the
     video letterboxes inside that box rather than pushing anything off screen. */
  @media (orientation:landscape) and (max-height:560px){
    .stage{aspect-ratio:auto;height:auto;flex:1 1 auto;min-height:0}
  }

  /* Roomier rows, but only where the row is actually roomy: a landscape phone
     matches min-width:760px while giving the list a ~340px column, too narrow
     to push the team to its own edge. */
  @media (min-width:760px) and (min-height:600px){
    .ev{grid-template-columns:64px 1fr}
    .ev-name{font-size:.88rem}
    /* Wide enough to give the team its own edge again, so a column of teams
       reads down the right the way it does on desktop. */
    .ev-meta .team{margin-left:auto;padding-left:10px}
  }
</style>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/playlists.js"></script>
<script src="js/events.js"></script>
<script src="js/strike_moves.js"></script>
<script src="js/player.js"></script>
</head>
<body>

<div class="topbar">
  <tr-logo compact></tr-logo>
  <button class="game-btn" id="gameBtn" onclick="openSheet('game')">
    <span class="g-name" id="gName">Choose a game</span>
    <span class="g-sub"  id="gSub">tap to pick</span>
  </button>
  <button class="icon-btn" onclick="openSheet('playlists')" title="Playlists">📋</button>
  <button class="icon-btn" id="filterBtn" onclick="openSheet('filter')">Filter <span class="badge" id="fCount" hidden>0</span></button>
</div>

<div class="frame" id="frame">
 <div class="left">
  <div class="stage" id="stage">
    <div id="ytZoom"></div>
    <div class="stage-empty" id="stageEmpty">Pick a game, then tap any event to watch it</div>
    <div class="now-pill" id="nowPill"></div>
    <div class="zoom-tag" id="zoomTag">1.0×</div>
    <button class="cine-btn" id="bCine" onclick="event.stopPropagation();toggleCinema()">⤢</button>
    <button class="zoom-btn" id="bZoom" onclick="event.stopPropagation();cycleZoom()" disabled>⛶</button>
  </div>

  <div class="scrub" id="scrub">
    <div class="scrub-track"></div>
    <span class="scrub-time" id="tTime"><b>0:00</b><span class="dur"> / 0:00</span></span>
    <div class="scrub-fill" id="scrubFill" style="width:0"></div>
    <div class="scrub-thumb" id="scrubThumb" style="left:0"></div>
  </div>

  <div class="transport">
    <button class="t-btn" id="bPrev"  onclick="stepEvent(-1)" title="Previous event" disabled>⏮</button>
    <button class="t-btn" id="bBack"  onclick="skip(-5)" title="Back 5 seconds" disabled>−5</button>
    <button class="t-btn play" id="bPlay" onclick="togglePlay()" disabled>▶</button>
    <button class="t-btn" id="bFwd"   onclick="skip(5)" title="Forward 5 seconds" disabled>+5</button>
    <button class="t-btn" id="bNext"  onclick="stepEvent(1)" title="Next event" disabled>⏭</button>
    <button class="t-btn" id="bLoop"  onclick="toggleLoop()" title="Loop this event" disabled>⟲</button>
    <button class="t-btn" id="bRate"  onclick="cycleRate()" title="Playback speed" disabled>1×</button>
    <button class="t-btn" id="bWin"   onclick="openSheet('window')" title="Seconds of video before and after each event">5/3</button>
  </div>
 </div>

 <div class="right">
  <div class="listhead">
    <div class="filterbar" id="filterbar">
      <span class="count" id="count">—</span>
    </div>
    <button class="icon-btn" id="collectBtn" onclick="toggleCollect()"
            title="Collect events into a playlist">☑</button>
    <button class="collapse-btn" id="collapseBtn" onclick="toggleList()"
            aria-expanded="true" title="Collapse the event list">⌄</button>
  </div>
  <div class="tray" id="tray"></div>
  <div class="list" id="list">
    <div class="empty" id="empty">Loading…</div>
  </div>
 </div>
</div>

<div class="actionbar">
  <span class="n" id="selN">0 selected</span>
  <button class="icon-btn" id="selAll" onclick="selectAll()">All</button>
  <span class="sp"></span>
  <button class="icon-btn" onclick="toggleCollect()">Cancel</button>
  <button class="ab-go" id="abGo" onclick="openSheet('addto')" disabled>Add to…</button>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
  <div class="sheet-grab"></div>
  <div class="sheet-head"><h2 id="sheetTitle">Filter</h2>
    <button class="icon-btn" onclick="closeSheet()">Done</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script>
TR.auth('viewer');

const TAGCOL = {'Try':'--try','Turnover':'--turn','Penalty Attack':'--patk',
  'Penalty Defence':'--pdef','Game Event':'--game','To Review':'--review'};
function col(t){return `var(${TAGCOL[t]||'--dim'})`}

let rows=[], headers=[], meta={}, labels={}, order={};
let game='', events=[], shown=[], picked=false;
let player=null, ready=false, dur=0, tick=null, pendingSeek=null, videoGame='';
let activeId=null, rate=1, zoom=1, renderLimit=200;
// The active event's own coordinates, so the window can be re-derived when it
// changes without making the user re-tap the event.
let activeSecs=null, activeGame='';
let panX=0, panY=0;                 // frame offset while zoomed, in px
let looping=false, loopStart=null, loopEnd=null;
// Slow-mo for reading a move, normal for watching. Zoom is a plain in/out.
const RATES=[1,0.5], ZOOMS=[1,2];
// How much video surrounds an event: the lookback decides where playback starts
// on every tap, the tail decides where a loop turns around. Both are the
// viewer's own setting, restored from LS below once that helper exists.
let winBefore=5, winAfter=3;
const WIN_BEFORE_CHIPS=[3,5,10,15], WIN_AFTER_CHIPS=[2,3,5,10];
let F={type:new Set(),team:new Set(),name:new Set(),move:new Set(),
       comp:new Set(),div:new Set(),year:new Set(),q:''};

// Saved playlists for this account, and which one is currently playing.
// A playlist is a fixed, ordered list of hand-picked events; while one plays it
// IS the list, so the filters are suppressed rather than allowed to narrow it.
let PL=[], plOpen=null, plMissing=0;
// Set when TR.playlists.load rejects, so the empty-state message can tell "you
// have none" from "the server was unreachable" — PL=[] alone can't, since a
// genuine zero-playlists account leaves PL looking exactly the same.
let plLoadError=null;

function plById(id){return PL.find(p=>p.id===id)||null}

// Collect mode: tick events into a pending selection, then commit the lot to a
// playlist in one write.
//
// sel holds full TR.evId refs, never list indices. An index is a position in
// `shown`, and `shown` is rebuilt by every filter change — so an index-based
// selection would silently repoint at different events the moment the user
// filtered, which is exactly the motion this mode exists to support.
let collecting=false;
const sel=new Set();

// Categories ordered by how much they narrow: Competition/Division/Year first
// (the ones that matter most once you're browsing across every game), then the
// original per-event groups. One table so the category list and the option
// screen can't drift apart.
const FCATS=[
  {key:'comp', title:'Competition', of:e=>e.comp},
  {key:'div',  title:'Division',    of:e=>e.div},
  {key:'year', title:'Year',        of:e=>e.year},
  {key:'type', title:'Type',        of:e=>e.type},
  {key:'team', title:'Team',        of:e=>e.team},
  {key:'name', title:'Name',        of:e=>e.name},
  {key:'move', title:'Move',        of:e=>e.move},
];
// null at the category list, otherwise the FCATS key being browsed. Reset on
// every open, so the sheet never reopens stranded inside a category.
let fCat=null, fNarrow='';
// null at the playlist list, otherwise the playlist id being edited. Reset on
// every open, for the same reason fCat is: reopening the sheet must never
// strand the user inside a playlist.
let plEdit=null, plDraft=null;
// What had focus when the sheet was opened, so closeSheet can hand it back.
// Declared up here with the rest of the state rather than beside the sheet
// functions, because the load path closes a sheet before that far down the
// script has run and a `let` in its own dead zone throws.
let sheetOpener=null;
// Which kind of sheet is currently open, or null when none is. The load path
// finishes after the sheet may already be on screen, and needs to know whether
// what it just changed is what the user is looking at.
let sheetKind=null;
// Set while a reorder-screen commit is in flight, so a second exit (Escape on
// top of a scrim tap) can't fire a second save for the same leave.
let plSaving=false;

// Twelve chips is about two phone rows — past that, scanning for one costs
// more than typing three letters of it.
const NARROW_AT=12;

const LS={get(k){try{return JSON.parse(localStorage.getItem('trl2_'+k))}catch(e){return null}},
          set(k,v){try{localStorage.setItem('trl2_'+k,JSON.stringify(v))}catch(e){}}};
function $(id){return document.getElementById(id)}
// Restored and painted here rather than in restore(), which waits on the data
// fetch: the window is a local setting and shouldn't show a stale label until
// the network answers.
winBefore=TR.player.clampWindow(LS.get('winBefore'),5);
winAfter =TR.player.clampWindow(LS.get('winAfter'), 3);
paintWin();
function fmtS(s){s=Math.max(0,Math.floor(s||0));const m=Math.floor(s/60);
  return (m>=60?Math.floor(m/60)+':'+String(m%60).padStart(2,'0'):String(m))+':'+String(s%60).padStart(2,'0')}
function toSecs(t){const p=String(t||'').trim().split(':').map(Number);
  return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:0}

// ── Load ──────────────────────────────────────────────────────
(async function(){
  const ca=LS.get('all'), cl=LS.get('list');
  if(cl) buildMeta(cl.sheets);
  if(ca){ ingest(ca.rows); restore(); }
  try{
    const [a,l]=await Promise.all([
      fetch(`${TR.APPS_SCRIPT_URL}?secret=${TR.enc(TR.secret())}&action=all`),
      fetch(`${TR.APPS_SCRIPT_URL}?secret=${TR.enc(TR.secret())}&action=list`)]);
    const [ar,lr]=await Promise.all([a.json(),l.json()]);
    if(ar.ok){LS.set('all',ar); ingest(ar.rows);}
    if(lr.ok){LS.set('list',lr); buildMeta(lr.sheets); if(picked) paintGame();}
    try{ PL=await TR.playlists.load(TR.secret()); plLoadError=null; }
    catch(e){ PL=[]; plLoadError=e.message; }
    // A warm cache runs restore() — and so applyHash() — above, before this
    // resolves. A #playlists deep link has therefore already rendered plList()
    // against PL=[] and plLoadError=null: the "No playlists yet" empty state,
    // which is simply wrong for the repeat visitor who is the normal phone
    // case. Nothing else repaints it (the second restore() returns early on
    // `picked`), so the sheet is repainted here if it is still the one open.
    // Covers the failed-load message too, which otherwise never reaches an
    // already-open sheet either.
    if(sheetKind==='playlists'&&!plEdit){ $('sheetBody').innerHTML=playlistSheet(); paintPlHead(); }
  }catch(e){ if(!ca) $('empty').textContent='Could not load events: '+e.message; }
  restore();
  if(!picked) openSheet('game');
})();

// ?game= wins, else the last game this device looked at. On a phone you come
// back to the same match rather than re-picking it every time. '' means "all
// games" (both from ?game= and from a stored lastgame) and must round-trip
// just like a real game name — so this checks presence, not truthiness.
function restore(){
  if(LS.get('looping')&&!looping){looping=true;
    $('bLoop').classList.add('on'); $('bLoop').title='Stop looping';}
  if(LS.get('listCollapsed') && !document.body.classList.contains('list-collapsed')) toggleList();
  if(picked) return;
  const params=new URLSearchParams(location.search);
  const want = params.has('game') ? params.get('game') : LS.get('lastgame');
  if(want==='' ){ if(rows.length) pickGame(''); }
  else if(want && rows.some(r=>r.game===want)) pickGame(want);
  applyHash();
}

// #cinema / #filter / #moves make the full-screen states linkable and restorable,
// so a teammate can be sent straight to what you were looking at.
function applyHash(){
  const h=(location.hash||'').replace('#','');
  if(h==='cinema' && !document.body.classList.contains('cinema')) toggleCinema();
  // Not while a playlist plays: spec §8 suppresses the filters then, and the
  // Filter button is hidden for the same reason — the hash is the only other
  // way in.
  if(h==='filter' && picked && !plOpen) openSheet('filter');
  if(h==='moves'  && picked) openSheet('moves');
  if(h==='playlists' && picked) openSheet('playlists');
}
window.addEventListener('hashchange',applyHash);

function buildMeta(sheets){ meta={};labels={};order={};
  (sheets||[]).forEach((s,i)=>{meta[s.name]=s;labels[s.name]=TR.sheetNameToLabel(s);order[s.name]=i;}); }

function ingest(r){
  if(!r||r.length<2)return;
  headers=r[0].map(h=>h.trim());
  const hi=n=>headers.findIndex(h=>h.toLowerCase()===n);
  const I={t:hi('time'),ty:hi('type'),nm:hi('name'),ao:hi('action owner'),
    cm:hi('comment'),sm:hi('strike move'),g:hi('game'),t1:hi('team 1'),t2:hi('team 2'),
    cp:hi('competition'),yr:hi('year'),dv:hi('division')};
  const sub=(v,a,b)=>{const s=(v||'').trim();return s==='Team 1'?a:s==='Team 2'?b:s};
  rows=r.slice(1).filter(x=>x.some(c=>c!=='')).map(x=>{
    const type=(x[I.ty]||'').trim(), name=(x[I.nm]||'').trim();
    const rawMove=I.sm>=0?(x[I.sm]||'').trim():'';
    return {
      time:toSecs(x[I.t]), timeStr:x[I.t]||'', type, name,
      team:sub(x[I.ao],x[I.t1],x[I.t2]), comment:I.cm>=0?(x[I.cm]||''):'',
      // Derived, not read raw: a Try's move IS its name, and the viewer's inline
      // edit can leave the stored Strike Move column stale after a rename.
      // Same fix as viewer.html f14dbee.
      move:TR.recordedMoveOf(type,name,rawMove), game:x[I.g],
      comp:I.cp>=0?(x[I.cp]||'').trim():'', year:I.yr>=0?(x[I.yr]||'').trim():'',
      div:I.dv>=0?(x[I.dv]||'').trim():''};
  }).filter(e=>e.type);
  if(picked) paintGame();
}

// ── Game selection ────────────────────────────────────────────
// game==='' means "all games", a real pick like any other — distinguished from
// "nothing chosen yet" by the `picked` flag, not by truthiness.
function pickGame(k){ game=k; picked=true; renderLimit=200;
  F={type:new Set(),team:new Set(),name:new Set(),move:new Set(),
     comp:new Set(),div:new Set(),year:new Set(),q:''};
  activeId=null; plOpen=null; closeSheet(); LS.set('lastgame',k);
  // Video first: paintGame() renders the list, and a throw in there used to
  // leave the page with no video and no error to show for it.
  if(k) loadVideo(k); else clearVideo();
  paintGame(); }

function paintGame(){
  if(game===''){
    // Every row, grouped by match (API order) rather than interleaved by time.
    events=rows.slice().sort((a,b)=>(order[a.game]??999)-(order[b.game]??999)||a.time-b.time);
    $('gName').textContent='All games';
    $('gSub').textContent=`${events.length} events`;
  }else{
    events=rows.filter(e=>e.game===game).sort((a,b)=>a.time-b.time);
    const m=meta[game]||{};
    $('gName').textContent=labels[game]||game||'Choose a game';
    const tries=events.filter(e=>e.type==='Try');
    const t1=m.team1||'Team 1', t2=m.team2||'Team 2';
    const s1=tries.filter(e=>e.team===t1).length, s2=tries.filter(e=>e.team===t2).length;
    $('gSub').textContent = events.length? `${s1}–${s2} · ${events.length} events` : 'no events';
  }
  render();
}

// Compact match label for all-games cards — team names only, never the full
// sheetNameToLabel (which can carry competition/year/division/#id too).
function shortLabel(g){
  const m=meta[g]||{};
  if(m.team1&&m.team2) return `${m.team1} v ${m.team2}`;
  const parts=(g||'').split('_');
  return parts.length>=2 ? `${parts[parts.length-2]} v ${parts[parts.length-1]}` : (g||'');
}

// ── Filtering ─────────────────────────────────────────────────
// keepWindow: pass true only when re-rendering without a game/filter change
// (e.g. after playEvent's active-highlight update) — every other caller wants
// a fresh filter to start back at the top of the rendered window.
function render(keepWindow){
  if(!keepWindow) renderLimit=200;
  const q=F.q.toLowerCase();
  // A playlist deleted on another device is gone from PL the next time it
  // loads, and plOpen would then name nothing: no chip and so no ✕ is drawn,
  // while paintCollect() keeps the ☑ hidden on the strength of plOpen — a
  // state with nothing on screen able to leave it. Drop the stale id instead.
  if(plOpen&&!plById(plOpen)) plOpen=null;
  const pl=plOpen?plById(plOpen):null;
  if(pl){
    // A playlist is already a hand-picked set. Letting the filters narrow it
    // further would leave the chips describing a list that isn't on screen.
    const r=TR.playlists.resolve(pl.refs,rows);
    shown=r.events; plMissing=r.missing;
  }else{
    plMissing=0;
    shown=events.filter(e=>
    (!F.comp.size||F.comp.has(e.comp)) &&
    (!F.div.size||F.div.has(e.div)) &&
    (!F.year.size||F.year.has(e.year)) &&
    (!F.type.size||F.type.has(e.type)) &&
    (!F.team.size||F.team.has(e.team)) &&
    (!F.name.size||F.name.has(e.name)) &&
    (!F.move.size||F.move.has(e.move)) &&
    (!q||(e.name+' '+e.type+' '+e.team+' '+e.comment+' '+e.move).toLowerCase().includes(q)));
  }
  const n=F.comp.size+F.div.size+F.year.size+F.type.size+F.team.size+F.name.size+F.move.size+(F.q?1:0);

  const bar=$('filterbar');
  if(pl){
    bar.innerHTML=`<button class="chip pl" data-plleave="1">
        ${esc(pl.name)} <span class="x">✕</span></button>`+
      `<span class="count">${shown.length} events</span>`+
      (plMissing?`<span class="count warn">${plMissing} no longer in the data</span>`:'');
    $('fCount').hidden=true;
    // Spec §8: the filters are suppressed while a playlist plays, so the way
    // into them goes too. Leaving the button live let a user tap Filter, watch
    // a chip light up, see nothing happen (render() ignores F here), and then
    // find the list collapsed to a filter they never knowingly applied the
    // moment they tapped the playlist's ✕.
    $('filterBtn').hidden=true;
  }else{
    $('filterBtn').hidden=false;
    $('fCount').hidden=!n; $('fCount').textContent=n;
    // No #count write here: bar.innerHTML two lines down rebuilds the whole bar,
    // including a fresh #count span with this same text baked in — so this
    // assignment was always overwritten immediately. Worse, right after a
    // playlist closes, the bar still holds the playlist's #count-less markup at
    // this point, so $('count') is null and the assignment threw, aborting
    // render() before the filter bar, event list, or scrub marks were rebuilt.
    const ms=TR.strikeMoveStats(moveEventsFor(shown));
    bar.innerHTML='<button class="chip drill" onclick="openSheet(\'moves\')">Moves '+
      `<b>${esc(movesSummary(ms))}</b></button>`+
      '<span class="count" id="count">'+
      `${shown.length}${shown.length!==events.length?' of '+events.length:''} events</span>`;
    // label is raw sheet data, so it goes through esc() like every other value
    // written as markup — the ✕ is the only markup this chip is allowed to carry.
    const add=(label,fn)=>{const b=document.createElement('button');b.className='chip on';
      b.innerHTML=esc(label)+' <span class="x">✕</span>';b.onclick=fn;bar.appendChild(b)};
    F.comp.forEach(v=>add(v,()=>{F.comp.delete(v);render()}));
    F.div.forEach(v=>add(v,()=>{F.div.delete(v);render()}));
    F.year.forEach(v=>add(v,()=>{F.year.delete(v);render()}));
    F.type.forEach(v=>add(v,()=>{F.type.delete(v);render()}));
    F.team.forEach(v=>add(v,()=>{F.team.delete(v);render()}));
    F.name.forEach(v=>add(v,()=>{F.name.delete(v);render()}));
    F.move.forEach(v=>add(v,()=>{F.move.delete(v);render()}));
    if(F.q) add('“'+F.q+'”',()=>{F.q='';render()});
    if(!n){ // quick-access type chips when nothing is filtered
      ['Try','Turnover','Penalty Attack','Penalty Defence'].forEach(t=>{
        if(!events.some(e=>e.type===t))return;
        const b=document.createElement('button');b.className='chip';b.textContent=t;
        b.onclick=()=>{F.type.add(t);render()};bar.appendChild(b)});
    }
  }

  const L=$('list');
  if(!shown.length){L.innerHTML='<div class="empty">'+
    // A playlist's empty state can't be about filters — they're suppressed
    // while one plays — so it says which of the two things happened instead.
    (pl?(plMissing?'None of this playlist’s events are still in the data.'
                  :'This playlist has no events in it yet.')
       :events.length?'No events match these filters.':'Pick a game to see its events.')+'</div>';
    paintCollect();return}
  const windowed=shown.slice(0,renderLimit);
  L.innerHTML=windowed.map(e=>{
    const id=TR.evId(e);
    const cls=collecting?(sel.has(id)?' sel':''):(activeId===id?' active':'');
    return `<div class="ev${cls}" style="border-left-color:${col(e.type)}"
      data-t="${e.time}" data-id="${esc(id)}" data-game="${esc(String(e.game))}">
      ${collecting?'<span class="tick">✓</span>':`<span class="ev-t">${esc(shortT(e.timeStr))}</span>`}
      <span class="ev-main">
        <span class="ev-name">${esc(e.name||e.type)}</span>
        <span class="ev-meta"><span class="tag" style="background:${col(e.type)}22;color:${col(e.type)}">${esc(e.type)}</span>
        ${(game===''||pl)?`<span class="gmatch">${esc(shortLabel(e.game))}</span>`:''}
        ${e.team?`<span class="team">${esc(e.team)}</span>`:''}
        ${e.move?`<span class="move">${esc(e.move)}</span>`:''}
        ${e.comment?esc(e.comment.slice(0,32)):''}</span>
      </span>
    </div>`}).join('');
  if(shown.length>renderLimit){
    L.innerHTML+=`<button class="icon-btn" style="width:100%;height:40px;margin:4px 0 0"
      onclick="loadMore()">Load more (${shown.length-renderLimit} more)</button>`;
  }
  paintCollect();
  paintMarks();
}
function loadMore(){renderLimit+=200;render(true)}

// The ☑ is hidden while a playlist plays: a playing playlist is not a pool to
// collect from, and editing one has a home already in the reorder screen.
function paintCollect(){
  $('collectBtn').hidden = !!plOpen;
  $('selN').textContent=`${sel.size} selected`;
  $('selAll').textContent=`All ${shown.length}`;
  $('abGo').disabled=!sel.size;
  $('abGo').textContent=sel.size?`Add ${sel.size} to…`:'Add to…';
  $('tray').innerHTML=sel.size
    ? `<b>${sel.size} collected.</b> Change the filter and keep tapping — the collection is kept until you save it.`
    : 'Tap events to collect them. Filters can change while you do.';
}

function toggleCollect(){
  collecting=!collecting;
  document.body.classList.toggle('collect',collecting);
  $('collectBtn').classList.toggle('on',collecting);
  if(!collecting) sel.clear();
  render();
}

// Collect mode's UI (the tick marks in #list, the #tray strip, the fixed
// .actionbar) only makes sense over the ordinary filtered list. Opening a
// playlist and entering cinema each swap that surface for something collect
// can't render over, so every path that does one of those must force collect
// mode off first — call this rather than adding another one-off
// `if(collecting) toggleCollect()` at the next such call site.
//
// Collapsing the list is NOT one of them: it hides the rows but keeps the page
// underneath, so it hides the tray and the bar in CSS and keeps the selection.
function exitCollect(){
  if(!collecting) return;
  collecting=false;
  document.body.classList.remove('collect');
  $('collectBtn').classList.remove('on');
  sel.clear();
}

// Named tickRow, not tick: `tick` is already the video-progress interval
// handle declared with the rest of the player state above, and the two are
// both top-level in a non-module script.
function tickRow(id){ sel.has(id)?sel.delete(id):sel.add(id); render(true); }
function selectAll(){ shown.forEach(e=>sel.add(TR.evId(e))); render(true); }
// Function declarations, not const arrows: restoring a cached game calls
// render() from the top-level IIFE before a const at this point in the file has
// been evaluated, and a TDZ ReferenceError there silently leaves the list on
// "Loading…". Only reproduces when localStorage already holds a cached game.
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
// Game clocks run well under an hour, so the leading 0: / 00: is noise on a phone.
function shortT(t){return String(t||'').replace(/^0?0:/,'')}

// ── Video ─────────────────────────────────────────────────────
// loadVideo takes the game explicitly rather than reading the global `game` —
// in all-games mode there is no single game, so the loaded video's game is
// tracked separately in `videoGame` and driven by whichever event was tapped.
function loadVideo(g){
  videoGame=g;
  const m=meta[g]||{};
  if(player){player.destroy();player=null}
  ready=false; if(tick){clearInterval(tick);tick=null}
  if(!TR.player.providerFor(m)){
    $('stageEmpty').style.display='flex';
    $('stageEmpty').textContent='This game has no video linked yet.';
    ['bPlay','bBack','bFwd','bRate','bZoom','bPrev','bNext','bLoop'].forEach(i=>$(i).disabled=true);
    return;
  }
  $('stageEmpty').style.display='none';
  $('ytZoom').innerHTML='';
  player=TR.player.create({provider:'youtube',container:$('ytZoom'),
    videoId:TR.extractVideoId(m.youtubelink),
    onReady(){ready=true;dur=player.getDuration()||0;
      ['bPlay','bBack','bFwd','bRate','bZoom','bPrev','bNext','bLoop'].forEach(i=>$(i).disabled=false);
      if(pendingSeek!=null){player.seek(pendingSeek);player.play();pendingSeek=null}
      tick=setInterval(progress,250); paintMarks();},
    onStateChange(s){$('bPlay').textContent=s==='playing'?'⏸':'▶'}});
}

// No game picked / all-games mode with nothing tapped yet: no video to show,
// as opposed to loadVideo's "this specific game has none".
function clearVideo(){
  videoGame=''; if(player){player.destroy();player=null}
  ready=false; dur=0; if(tick){clearInterval(tick);tick=null}
  $('stageEmpty').style.display='flex';
  $('stageEmpty').textContent='Pick a game, then tap any event to watch it';
  ['bPlay','bBack','bFwd','bRate','bZoom','bPrev','bNext','bLoop'].forEach(i=>$(i).disabled=true);
  paintMarks();
}

function playEvent(gameSecs,id,evGame){
  const m=meta[evGame]||{};
  if(!TR.player.providerFor(m)){alert('This game has no video linked yet.');return}
  activeId=id; activeSecs=gameSecs; activeGame=evGame;
  const t=Math.max(0,TR.player.videoTimeAt(m,gameSecs)-winBefore);   // lookback
  // Whether or not looping is on, remember this event's window so toggling the
  // loop mid-event doesn't need the event re-tapped.
  loopStart=t; loopEnd=TR.player.videoTimeAt(m,gameSecs)+winAfter;
  // The video follows the event, not the picker: load evGame's video whenever
  // it differs from what's currently loaded, regardless of what `game` is.
  if(evGame!==videoGame){pendingSeek=t;loadVideo(evGame)}
  else if(!player){pendingSeek=t;loadVideo(evGame)}
  else if(!ready){pendingSeek=t}
  else{player.seek(t);player.play()}
  // rows, not events: events is only the picked game's rows (paintGame), but a
  // playing playlist can jump to any game regardless of what's picked, so the
  // lookup has to search everything or the pill goes stale on a cross-game tap.
  const ev=rows.find(x=>x.game===evGame&&x.time===gameSecs);
  if(ev){$('nowPill').innerHTML=
    `<span class="tag" style="background:${col(ev.type)}22;color:${col(ev.type)}">${esc(ev.type)}</span>`+
    `<b>${esc(ev.name||'')}</b> <span style="color:var(--dim)">${esc(ev.team||'')}</span>`;
    $('nowPill').classList.add('show');}
  document.querySelectorAll('.ev').forEach(n=>n.classList.remove('active'));
  render(true);
}

// Steps through the FILTERED list, not the whole game — so "next" after
// filtering to tries is the next try, which is the point of filtering.
function stepEvent(d){
  if(!shown.length)return;
  let i=shown.findIndex(e=>TR.evId(e)===activeId);
  i = i<0 ? (d>0?0:shown.length-1) : i+d;
  if(i<0||i>=shown.length)return;                 // stop at the ends, don't wrap
  const e=shown[i];
  playEvent(e.time,TR.evId(e),e.game);
}

function toggleLoop(){
  looping=!looping;
  $('bLoop').classList.toggle('on',looping);
  $('bLoop').title=looping?'Stop looping':'Loop this event';
  LS.set('looping',looping);
  // Turning it on mid-event should start the loop now, not at the next tap.
  if(looping&&ready&&loopStart!=null){player.seek(loopStart);player.play()}
}

// ── Playback window ──────────────────────────────────────────
// One window for every event rather than a per-event setting: the point is a
// house style for watching ("give me a run-up, cut it just after"), not a
// per-clip trim.
function windowSheet(){
  const grp=(title,label,key,chips,val)=>
    `<div class="grp"><h3>${title}</h3><div class="opts">`+
    chips.map(n=>`<button class="chip win-chip ${n===val?'on':''}" data-key="${key}" data-val="${n}"
      onclick="setWin('${key}',${n},true)">${n}s</button>`).join('')+
    `<input class="win-num" id="${key}Num" type="number" inputmode="numeric" min="0" max="120"
      aria-label="${label}" value="${val}" oninput="setWin('${key}',this.value)"></div></div>`;
  return grp('Before the event','Custom seconds before','winBefore',WIN_BEFORE_CHIPS,winBefore)+
         grp('After the event','Custom seconds after','winAfter',WIN_AFTER_CHIPS,winAfter)+
         `<p class="win-note" id="winNote"></p>`;
}

// Repaints the label and the sheet in place. Deliberately not a re-render of
// the sheet body: that would blow away focus and the caret mid-keystroke.
function paintWin(){
  $('bWin').textContent=winBefore+'/'+winAfter;
  $('bWin').title=`${winBefore}s before, ${winAfter}s after each event`;
  document.querySelectorAll('#sheetBody .win-chip').forEach(c=>
    c.classList.toggle('on',+c.dataset.val===(c.dataset.key==='winBefore'?winBefore:winAfter)));
  const note=$('winNote');
  if(note)note.innerHTML=`Playback starts <b>${winBefore}s</b> before each event`+
    `, and a loop runs to <b>${winAfter}s</b> after it.`;
}

function setWin(key,val,fromChip){
  const n=TR.player.clampWindow(val,key==='winBefore'?5:3);
  if(key==='winBefore')winBefore=n; else winAfter=n;
  LS.set(key,n);
  // A chip press has to be mirrored into the custom field; typing must not be.
  if(fromChip){const inp=$(key+'Num'); if(inp)inp.value=n;}
  paintWin(); reWindow();
}

// Apply a changed window to the event already on screen, so the difference is
// audible now rather than at the next tap.
function reWindow(){
  if(activeSecs==null)return;
  const at=TR.player.videoTimeAt(meta[activeGame]||{},activeSecs);
  loopStart=Math.max(0,at-winBefore); loopEnd=at+winAfter;
  if(!ready||!player||!looping||loopEnd<=loopStart)return;
  // Only yank the playhead when it has fallen outside the new window; a seek
  // that lands somewhere already inside it just interrupts watching.
  const t=player.getTime()||0;
  if(t<loopStart||t>loopEnd)player.seek(loopStart);
}

function progress(){
  if(!ready||!player)return;
  const t=player.getTime()||0; dur=player.getDuration()||dur;
  // Checked here rather than on a timer of its own: this already ticks at 250ms,
  // which is tight enough that the jump back reads as a loop.
  if(looping&&loopStart!=null&&loopEnd!=null&&loopEnd>loopStart&&t>=loopEnd){player.seek(loopStart);return}
  $('tTime').innerHTML=`<b>${fmtS(t)}</b><span class="dur"> / ${fmtS(dur)}</span>`;
  const p=dur?Math.min(100,t/dur*100):0;
  $('scrubFill').style.width=p+'%'; $('scrubThumb').style.left=p+'%';
}
function togglePlay(){if(!ready)return;player.isPaused()?player.play():player.pause()}
function skip(d){if(!ready)return;player.seek(Math.max(0,(player.getTime()||0)+d))}
function cycleRate(){rate=RATES[(RATES.indexOf(rate)+1)%RATES.length];
  if(ready)player.setRate(rate);$('bRate').textContent=rate+'×'}
function cycleZoom(){zoom=ZOOMS[(ZOOMS.indexOf(zoom)+1)%ZOOMS.length];applyZoom()}
// Clamp the offset so the frame can never be dragged past its own edges —
// at 2x there is exactly half a frame of slack in each direction.
function clampPan(){
  const r=$('stage').getBoundingClientRect();
  const mx=Math.max(0,(zoom-1)*r.width/2), my=Math.max(0,(zoom-1)*r.height/2);
  panX=Math.min(mx,Math.max(-mx,panX)); panY=Math.min(my,Math.max(-my,panY));
}

function applyZoom(){
  if(zoom===1){panX=0;panY=0;} else clampPan();
  $('ytZoom').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  $('stage').classList.toggle('zoomed',zoom>1);
  const z=$('zoomTag');
  z.textContent=zoom>1?zoom+'× · drag to move':zoom.toFixed(1)+'×';
  z.classList.toggle('show',zoom>1);
  $('bZoom').textContent=zoom>1?zoom+'×':'⛶';
}
// Persisted, not linkable: this is a per-device preference like the last game,
// not a shareable view of a moment.
function toggleList(){
  const on = document.body.classList.toggle('list-collapsed');
  // Deliberately NOT exitCollect(): ⌄ sits beside ☑ in the same header row, and
  // discarding an unbounded collection on a mis-tap is a far worse outcome than
  // a stray tray. The tray and the pinned bar are hidden in CSS under
  // body.list-collapsed instead, so the selection simply survives the collapse
  // and comes back with it.
  const b  = $('collapseBtn');
  b.textContent = on ? '⌃' : '⌄';
  b.title = on ? 'Show the event list' : 'Collapse the event list';
  b.setAttribute('aria-expanded', String(!on));
  LS.set('listCollapsed', on);
}

function toggleCinema(){
  // The pinned action bar would float over a full-screen video with no list
  // behind it.
  if(collecting){ exitCollect(); render(); }
  const on=document.body.classList.toggle('cinema');
  $('bCine').textContent=on?'⤡':'⤢';
  history.replaceState(null,'',on?'#cinema':location.pathname+location.search)}

// double-tap to zoom
let lastTap=0, dragged=false;
// Double-tap toggles zoom; a drag while zoomed moves the frame. The two share
// this surface, so a drag has to suppress the tap that follows it — otherwise
// every pan ended by zooming back out.
$('stage').addEventListener('click',()=>{
  if(dragged){dragged=false;return}
  const n=Date.now();
  if(n-lastTap<300){cycleZoom()}
  lastTap=n;
});

$('stage').addEventListener('pointerdown',ev=>{
  if(zoom===1)return;                       // nothing to move at 1x
  const st=$('stage');
  const x0=ev.clientX, y0=ev.clientY, px=panX, py=panY;
  let moved=false;
  st.setPointerCapture?.(ev.pointerId);
  st.classList.add('panning');
  const mv=m=>{
    const dx=m.clientX-x0, dy=m.clientY-y0;
    if(!moved && Math.hypot(dx,dy)>4) moved=true;   // ignore a shaky tap
    if(!moved)return;
    panX=px+dx; panY=py+dy; clampPan();
    $('ytZoom').style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  };
  const up=()=>{
    st.classList.remove('panning');
    dragged=moved;
    window.removeEventListener('pointermove',mv);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',up);
  };
  window.addEventListener('pointermove',mv);
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
});

// scrub
function scrubTo(clientX){
  if(!ready||!dur)return;
  const r=$('scrub').getBoundingClientRect();
  player.seek(Math.max(0,Math.min(1,(clientX-r.left)/r.width))*dur);
}
$('scrub').addEventListener('pointerdown',e=>{scrubTo(e.clientX);
  const mv=m=>scrubTo(m.clientX);
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)});

// The rows and chips below are rebuilt from sheet data on every render, so their
// handlers are delegated rather than inlined: an inline onclick has to encode a
// value as source code, and a value carrying a quote then escapes its own
// attribute. Data attributes go through esc() and come back off dataset as the
// exact original string.
//
// closest() would keep walking past the container to document, so each match is
// bounded to the container it was delegated from: a data-game landing on some
// ancestor later must not turn every click in here into that hook.
const within=(ev,el)=>el&&ev.currentTarget.contains(el)?el:null;

$('list').addEventListener('click',ev=>{
  const row=within(ev,ev.target.closest('.ev')); if(!row)return;
  // Same row, same data — collect mode only changes what a tap means.
  if(collecting) tickRow(row.dataset.id);
  else playEvent(+row.dataset.t,row.dataset.id,row.dataset.game);
});

$('sheetBody').addEventListener('click',ev=>{
  const chip=within(ev,ev.target.closest('.chip[data-k]'));
  if(chip){tog(chip.dataset.k,chip.dataset.v,chip);return}
  // data-pledit is checked before data-pl even though .pl-edit and .pl-go
  // are siblings under .pl-row (never nested), so closest() can't actually
  // confuse the two today. Checking the more specific hook first is just
  // cheap insurance in case the markup is ever restructured so the row
  // itself carries the play hook.
  const pe=within(ev,ev.target.closest('[data-pledit]'));
  if(pe){plDrill(pe.dataset.pledit);return}
  const up=within(ev,ev.target.closest('[data-plup]'));
  if(up){plMove(+up.dataset.plup,-1);return}
  const dn=within(ev,ev.target.closest('[data-pldown]'));
  if(dn){plMove(+dn.dataset.pldown,1);return}
  const dr=within(ev,ev.target.closest('[data-pldrop]'));
  if(dr){plDrop(+dr.dataset.pldrop);return}
  const p=within(ev,ev.target.closest('[data-pl]'));
  if(p){playPlaylist(p.dataset.pl);return}
  const g=within(ev,ev.target.closest('[data-game]'));
  if(g){pickGame(g.dataset.game);return}
  const a=within(ev,ev.target.closest('[data-addto]'));
  if(a){addTo(a.dataset.addto);return}
  if(within(ev,ev.target.closest('[data-addnew]'))){addTo(null);return}
  if(within(ev,ev.target.closest('[data-plnew]'))){plNew();return}
  if(within(ev,ev.target.closest('[data-plexport]'))){plExport();return}
});

// Enter in either naming field commits it, so the on-screen keyboard's own
// return key finishes the job rather than needing a reach back to the button.
$('sheetBody').addEventListener('keydown',ev=>{
  if(ev.key!=='Enter')return;
  if(ev.target.id==='newPlName'){ev.preventDefault();addTo(null)}
  else if(ev.target.id==='plNewName'){ev.preventDefault();plNew()}
});

// The filter bar is rebuilt wholesale by render(), so its controls are
// delegated too rather than re-bound on every paint.
$('filterbar').addEventListener('click',ev=>{
  if(within(ev,ev.target.closest('[data-plleave]'))) playPlaylist(null);
});

// Escape is the keyboard's version of tapping the scrim, so it has to work
// wherever focus happens to be — a playing YouTube iframe on the stage can hold
// it outside the sheet, and a listener on the sheet would leave that user with
// no way out at all. Hence the document, guarded on the sheet being open.
document.addEventListener('keydown',ev=>{
  if(ev.key!=='Escape' || !$('sheet').classList.contains('open'))return;
  ev.preventDefault(); closeSheet();
});

// The sheet is modal, so Tab must not wander behind the scrim into a page the
// pointer can't reach. Bound once, to the container, because everything inside
// it is rebuilt from sheet data on every render. Escape is deliberately not
// handled here: one listener owns it, so it can't close the sheet twice.
$('sheet').addEventListener('keydown',ev=>{
  if(ev.key!=='Tab')return;
  const f=sheetFocusables(); if(!f.length){ev.preventDefault(); return}
  const i=f.indexOf(document.activeElement);
  // Wrapping is worked out here rather than left to the browser so that the two
  // ends meet, and so a Tab pressed on the container itself — where focus starts
  // — enters the list from whichever end the direction implies.
  const n = ev.shiftKey ? (i<=0 ? f.length-1 : i-1)
                        : (i===-1 || i===f.length-1 ? 0 : i+1);
  ev.preventDefault(); f[n].focus();
});

function paintMarks(){
  const s=$('scrub'); s.querySelectorAll('.scrub-mark').forEach(n=>n.remove());
  const m=meta[videoGame]||{}; if(!dur||!videoGame)return;
  shown.filter(e=>e.game===videoGame&&(e.type==='Try'||e.type==='Turnover')).slice(0,180).forEach(e=>{
    const t=TR.player.videoTimeAt(m,e.time); if(t<0||t>dur)return;
    const d=document.createElement('div'); d.className='scrub-mark';
    d.style.left=(t/dur*100)+'%'; d.style.background=col(e.type); s.appendChild(d)});
}

// ── Strike moves ──────────────────────────────────────────────
// Reshapes normalised events back into the {type,name,strikeMove,actionOwner}
// shape TR.strikeMoveStats expects. e.move is already the derived value (see
// ingest()), so this just hands it back through — TR.strikeMoveOf is
// idempotent on an already-derived move, it never re-derives to something else.
// ingest() derives with TR.recordedMoveOf, which is the wider of the two: a
// defensive penalty carries a move here so the card and filters can show it.
// That is safe to pass through — strikeMoveStats gates on TR.isAttackEnd, so
// the penalty is dropped before any rate sees it, which is what keeps one
// attack out of the denominator twice.
function moveEventsFor(list){
  return list.map(e=>({type:e.type,name:e.name,strikeMove:e.move,actionOwner:e.team}));
}

// Mirrors annotator_field.html renderMoves()'s four-state drill meta text —
// same dialect, just scoped to what's currently filtered rather than a whole
// game, since the chip answers "what's working in what I'm looking at".
function movesSummary(s){
  if(s.ratesMeaningful){
    const best=s.topByRate||s.topByTries;
    return best
      ? (best.rateKnown
          ? `${best.move} · ${Math.round(best.rate*100)}%`
          // topByRate excludes an untested move, so falling back to topByTries
          // means this leader has never itself failed — quote tries, not a
          // rate that only reads 100% by construction.
          : `${best.move} · ${best.tries} ${best.tries===1?'try':'tries'}`)
      : s.moves.length ? `${s.moves.length} tagged · no rate yet`
      : (s.coverage.fails.total?'none tagged yet':'—');
  }
  // No failure has ever been tagged in view, so a rate would only ever read
  // 100% — quote the most-scored move by tries instead.
  const best=s.topByTries;
  return best ? `${best.move} · ${best.tries} ${best.tries===1?'try':'tries'}`
    : s.moves.length ? `${s.moves.length} tagged · no tries yet`
    : (s.coverage.fails.total?'none tagged yet':'—');
}

// The moves sheet: every move tried in the current filter, in order of
// success. Scoped to `shown`, not `events` — it answers "what worked in what
// I'm looking at", and says so, so a filtered figure is never mistaken for a
// whole-game one.
function movesSheetBody(){
  const s=TR.strikeMoveStats(moveEventsFor(shown));
  const scope = shown.length===events.length
    ? `All ${events.length} events in this game (no filters applied).`
    : `${shown.length} of ${events.length} events currently in view — not the whole game.`;

  if(!s.moves.length){
    return `<div class="grp"><h3>Moves — order of success</h3>
      <div class="mv-scope">${scope}</div>
      <div class="mv-empty">No strike moves tagged in view yet.</div></div>`;
  }

  if(!s.ratesMeaningful){
    // Rate cannot order or describe anything here — no failure has ever been
    // tagged in view, so every move would read 100% by construction. Sort a
    // COPY by tries; s.moves is shared and must not be mutated.
    const byTries=s.moves.slice().sort((a,b)=>b.tries-a.tries||a.move.localeCompare(b.move));
    const f=s.coverage.fails;
    return `<div class="grp"><h3>Moves — by tries</h3>
      <div class="mv-scope">${scope}</div>
      <div class="mv-scope">Try rates need failures tagged to mean anything — every move
        below would otherwise show 100%, because no turnover or attack penalty in view has
        been tagged with a move yet${f.total?` (0 of ${f.total})`:''}. Counts only, not a
        rate ranking.</div>`+
      byTries.map((m,i)=>`<div class="mv-row">
          <span class="mv-rank">${i+1}</span><span>${esc(m.move)}</span>
          <span class="mv-count">${m.tries}/${m.attempts}</span><span></span>
        </div>`).join('')+
      '</div>';
  }

  const f=s.coverage.fails;
  return `<div class="grp"><h3>Moves — order of success</h3>
    <div class="mv-scope">${scope}</div>
    <div class="mv-scope">${f.tagged} of ${f.total} failed attempts tagged in view
      (${Math.round(f.pct*100)}%) · ${TR.MIN_MOVE_ATTEMPTS}+ attempts to rank
      · Other and Interception are not ranked</div>`+
    s.moves.map((m,i)=>{
      // Thin: too few attempts to rank, OR this move has never itself failed —
      // its rate reads 100% by construction, not performance.
      const thin = m.attempts<TR.MIN_MOVE_ATTEMPTS || !m.rateKnown;
      return `<div class="mv-row">
          <span class="mv-rank">${i+1}</span><span>${esc(m.move)}</span>
          <span class="mv-count">${m.tries}/${m.attempts}</span>
          <span class="mv-rate${thin?' thin':''}">${Math.round(m.rate*100)}%</span>
        </div>`;
    }).join('')+
    '</div>';
}

// ── Sheets ────────────────────────────────────────────────────
// The scrim puts the page behind the sheet out of the thumb's reach, so the
// keyboard has to be held to the same bargain: remember what opened the sheet
// (`sheetOpener`, declared with the rest of the state above), keep Tab inside
// it, and hand focus back on the way out.
//
// Queried afresh on every keypress rather than cached: drilling rebuilds the
// body, narrowing swaps the chips inside it, and the title is only a focusable
// back control some of the time — so the set changes under any cache.
function sheetFocusables(){
  return [...$('sheet').querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
    .filter(el=>!el.disabled && el.offsetParent!==null);
}

function openSheet(kind){
  // Taken before the sheet opens so closeSheet has somewhere to hand focus back
  // to. Two open paths are hash restores with no opener at all, and a sheet
  // that swaps kind while open keeps the control that opened it in the first
  // place — hence both guards.
  const o=document.activeElement;
  if(!$('sheet').contains(o)) sheetOpener = o && o!==document.body && o.focus ? o : null;
  $('scrim').classList.add('open'); $('sheet').classList.add('open');
  sheetKind=kind;
  if(kind==='filter')fCat=null;               // always open at the category list
  if(kind==='playlists'){plEdit=null;plDraft=null;}   // never reopen stranded in a playlist
  $('sheetTitle').className=''; $('sheetTitle').onclick=null; backCtl($('sheetTitle'),false);
  $('sheetTitle').textContent = kind==='game'?'Choose a game':kind==='moves'?'Strike moves'
    :kind==='window'?'Playback window':kind==='playlists'?'Playlists':kind==='addto'?'Add to playlist':'Filter events';
  $('sheetBody').innerHTML = kind==='game'?gameSheet():kind==='moves'?movesSheetBody()
    :kind==='window'?windowSheet():kind==='playlists'?playlistSheet():kind==='addto'?addToBody():filterSheet();
  // The window sheet is painted rather than rendered with its state inlined, so
  // that a keystroke can update the chips without re-rendering the field.
  if(kind==='window')paintWin();
  if(kind==='playlists')paintPlHead();
  // The container, never the first control: the filter sheet leads with a search
  // box, and focusing that would throw up the on-screen keyboard every time a
  // phone user taps Filter. Last, because a display:none element refuses focus.
  $('sheet').focus();
}
function closeSheet(){
  // Spec §7: the reorder screen's edits are written with one save on LEAVING
  // the screen — and Done, the scrim and Escape are all leaves, not just the
  // ‹ Playlists title. They all arrive here, and used to close over the draft
  // without a save and without a word, which is worst of all under Done: the
  // button sits right beside the back control and its label means "commit".
  //
  // Routed through plSaveAndBack so all four exits are one behaviour: it awaits
  // the write before clearing plEdit/plDraft, so a rejection leaves the user on
  // the edit screen with the draft intact and the sheet still open, and the
  // close only happens on the success it returns to.
  if(plEdit){ plSaveAndBack().then(()=>{ if(!plEdit) closeSheet() }); return }
  $('scrim').classList.remove('open');$('sheet').classList.remove('open');sheetKind=null;
  // Back to whatever opened it — by Done, by scrim, by Escape, or as the side
  // effect of picking a game — so the next Tab carries on from there instead of
  // restarting at the top of the page. Skipped if a render has since replaced it.
  // render() rebuilds #filterbar wholesale, so the Moves chip that opened the
  // moves sheet is routinely a detached node by the time it closes — a
  // background fetch resolving while the sheet is open is enough. The freshly
  // rendered chip is the same control, so hand focus to that instead.
  let o=sheetOpener; sheetOpener=null;
  if(o && !o.isConnected && o.classList.contains('drill')) o=$('filterbar').querySelector('.chip.drill');
  if(o && o.isConnected) o.focus();
  // #filter and #moves hash restores open the sheet with no opener at all, so
  // there's nothing to hand back to above. Left alone, activeElement stays on
  // whatever was focused inside the sheet — now a display:none subtree — which
  // strands a screen reader there and makes the next Tab restart from the top.
  else if($('sheet').contains(document.activeElement)) document.activeElement.blur();
}

// null leaves the playlist and returns to the ordinary filtered view.
function playPlaylist(id){
  // A playing playlist is not a pool to collect from, and editing one already
  // has a home in the reorder screen — see exitCollect().
  exitCollect();
  plOpen=id; activeId=null; closeSheet(); render();
}

function playlistSheet(){ return plEdit?plEditBody():plList(); }

// Spec §7 level 1: the rows, then ＋ New playlist. Creating one only from
// inside the collect flow's "Add to…" sheet meant an empty playlist could not
// be started at all — you had to have something to put in it first.
function plNewBody(){
  return `<div class="grp"><h3>New playlist</h3>
    <input class="srch" id="plNewName" placeholder="Name it…">
    <button class="icon-btn" style="width:100%;height:38px" data-plnew="1">
      ＋ New playlist</button></div>`;
}

function plList(){
  // Both a real empty account and a failed fetch leave PL===[], but they need
  // different messages: telling someone with saved playlists to go make one
  // just because the server didn't answer would send them looking for a
  // feature they already used.
  if(plLoadError)return '<div class="empty">Couldn\'t load playlists: '+
    esc(plLoadError)+'</div>';
  if(!PL.length)return '<div class="empty">No playlists yet.<br>'+
    'Tap ☑ in the filter bar to start collecting events into one.</div>'+plNewBody();
  return '<div class="pl-list">'+PL.map(p=>{
    const r=TR.playlists.resolve(p.refs,rows);
    const gone=r.missing?` · ${r.missing} missing`:'';
    return `<div class="pl-row${p.id===plOpen?' on':''}">
      <button class="pl-go" data-pl="${esc(p.id)}">
        ${esc(p.name)}
        <span class="gs">${r.events.length} events${gone}${p.note?' · '+esc(p.note):''}</span>
      </button>
      <button class="pl-edit" data-pledit="${esc(p.id)}" title="Edit">⠿</button>
    </div>`}).join('')+'</div>'+plNewBody();
}

// A brand-new playlist is empty, so it goes straight to the screen that can
// name it, note it and (once events are added) order it. plDrill's own guard
// covers the case where the reload can't see what was just created — another
// device deleting it in between, or a stale read — by landing on the list.
async function plNew(){
  // Same guard as plCommit: a create is the one non-idempotent playlist write,
  // and two taps within one round trip must not produce two playlists. Set
  // before the await, cleared in finally so a rejection can't strand it.
  if(plSaving) return;
  const name=($('plNewName').value||'').trim();
  if(!name){ $('plNewName').focus(); return; }
  let id;
  plSaving=true;
  try{
    ({id}=await TR.playlists.save(TR.secret(),{name,note:'',refs:[]}));
    PL=await TR.playlists.load(TR.secret());
  }catch(e){ alert(e.message); return; }
  finally{ plSaving=false; }
  plDrill(id);
}

function plDrill(id){
  // The lookup is guarded the way plCommit guards its own: an id that has since
  // vanished (deleted on another device, then PL reloaded under a sheet still
  // showing the old row) must land back on the list, not throw.
  const p=id?plById(id):null;
  plEdit=p?id:null;
  // A draft, so five moves are one write on leaving rather than five.
  plDraft=p?{name:p.name,note:p.note||'',refs:p.refs.slice()}:null;
  $('sheetBody').innerHTML=playlistSheet();
  paintPlHead();
  // Same reason as the filter sheet's drill(): the ⠿ button just tapped is
  // gone after the innerHTML swap, so focus falls to <body> and the next Tab
  // would restart from the top of the page. Going in: the name field.
  const t = plEdit ? $('sheetBody').querySelector('#plName') : $('sheet');
  (t||$('sheet')).focus();
}

// The title doubles as the back control when drilled in, the same shape the
// filter sheet uses — and through the same backCtl(), so it is reachable by
// keyboard and announced, rather than being a bare h2 nothing can focus.
function paintPlHead(){
  const h=$('sheetTitle');
  h.innerHTML=plEdit?'‹ Playlists':'Playlists';
  h.className=plEdit?'back':'';
  h.onclick=plEdit?()=>plSaveAndBack():null;
  backCtl(h,!!plEdit,'Back to playlists, saving changes',()=>plSaveAndBack());
}

function plEditBody(){
  const r=TR.playlists.resolve(plDraft.refs,rows);
  // The note is optional, and is the only place in the app that can set it —
  // without a field here the Note column, its header constant, its request
  // field and the list row's render branch were all carrying a value that was
  // permanently ''.
  return `<input class="srch" id="plName" value="${esc(plDraft.name)}"
      placeholder="Playlist name" oninput="plDraft.name=this.value">`+
    `<input class="srch" id="plNote" value="${esc(plDraft.note||'')}"
      placeholder="Note (optional)" oninput="plDraft.note=this.value">`+
    (r.missing?`<p class="win-note">${r.missing} event${r.missing===1?'':'s'} in this playlist `+
      `${r.missing===1?'is':'are'} no longer in the data.</p>`:'')+
    (r.events.length?r.events.map((e,n)=>
      // No ⠿ handle here: it was never wired to anything, and the same glyph
      // already means "drill in" one screen up — one symbol with two meanings,
      // one of them a lie. The ↑↓ buttons do the reordering, deliberately (a
      // 52px row in a scrolling sheet is a poor drag target).
      `<div class="ev ord" style="border-left-color:${col(e.type)}">
        <span class="ev-main">
          <span class="ev-name">${esc(e.name||e.type)}</span>
          <span class="ev-meta">
            <span class="tag" style="background:${col(e.type)}22;color:${col(e.type)}">${esc(e.type)}</span>
            <span class="gmatch">${esc(shortLabel(e.game))}</span>
            ${e.team?`<span class="team">${esc(e.team)}</span>`:''}
          </span>
        </span>
        <span class="ord-btns">
          <button data-plup="${n}" ${n===0?'disabled':''}>↑</button>
          <button data-pldown="${n}" ${n===r.events.length-1?'disabled':''}>↓</button>
          <button data-pldrop="${n}">✕</button>
        </span>
      </div>`).join('')
      :'<div class="empty">Nothing in here yet.</div>')+
    `<button class="icon-btn pl-export" data-plexport="1"
       ${r.events.length?'':'disabled'}>⬇ Export CSV</button>`+
    `<button class="pl-danger" onclick="plDelete()">Delete this playlist</button>`;
}

// Exports the DRAFT, not the saved row: what is on screen is what comes out, so
// a reorder the user hasn't left the screen with still exports in the order
// they're looking at.
function plExport(){
  if(!plDraft) return;
  const r=TR.playlists.resolve(plDraft.refs,rows);
  if(!r.events.length) return;          // the button is disabled too; belt and braces
  const head=['#','Game','Time','Type','Name','Team','Move','Comment','YouTube Link'];
  const body=r.events.map((e,n)=>[
    // Position in the FILE, not in the stored ref list — a ref that no longer
    // resolves is absent here, and a # that skipped 4 would send the reader
    // hunting for a row that isn't coming.
    n+1,
    // The full label, not shortLabel: a playlist spans matches, and two
    // "France vs England" rows from different years must be tellable apart.
    labels[e.game]||e.game,
    e.timeStr, e.type, e.name, e.team, e.move, e.comment,
    // seekLink applies the game's videoOffset and the 5s lookback, and returns
    // '' when the game has no video or the moment predates the recording. The
    // row still exports, so the file's length always matches the list above it.
    TR.player.seekLink(meta[e.game],e.time)
  ]);
  // BOM: without it Excel reads the file as the system codepage and mangles
  // every accented team name, and this dataset is largely French.
  const blob=new Blob(['﻿'+TR.toCSV([head,...body])],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  const url=URL.createObjectURL(blob);
  a.href=url;
  a.download=TR.slugify(plDraft.name,'playlist')+'.csv';
  // In the document, and revoked on a later turn of the loop. A detached anchor
  // is enough on desktop — annotator.html has shipped that way for a long time —
  // but this is the phone page, and iOS Safari is the browser most likely to
  // ignore a click on an element that was never in the tree, then hand the blob
  // to a viewer that reads the URL after the click returns. Both are cheap to
  // rule out; a download that silently does nothing is the worst failure this
  // feature has.
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
