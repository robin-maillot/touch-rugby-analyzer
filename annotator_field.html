<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Field Annotator</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="cb7fd4f2-fcd5-44d7-a8e4-70e9068870bb" data-auto-track="false"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #181b26;
      --surface-2: #22253a;
      --border:    #2a2d3a;
      --text:      #e0e0e0;
      --text-muted:#888;
      --accent:    #3b82f6;
      --green:     #22c55e;
      --orange:    #f97316;
      --red:       #ef4444;
      --red-dark:  #b91c1c;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    header h1 { font-size: 0.9rem; font-weight: 600; }
    .header-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .btn-icon {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-icon:active   { background: var(--surface-2); }
    .btn-icon:disabled { opacity: 0.5; }
    .btn-hdr-push     { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-hdr-override { background: #7f1d1d; color: #fff; border-color: #7f1d1d; }
    .btn-live.active  { color: var(--red); border-color: var(--red); background: rgba(239,68,68,0.08); }
    .btn-hdr-swap.active { color: var(--accent); border-color: var(--accent); }

    /* ── Settings panel ─────────────────────────────────────────── */
    #settingsPanel {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }
    #settingsPanel.open { display: flex; }
    .settings-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .settings-row input,
    .settings-row select {
      flex: 1;
      min-width: 80px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.85rem;
      outline: none;
    }
    .settings-row input:focus,
    .settings-row select:focus { border-color: var(--accent); }
    .settings-row input::placeholder { color: #444; }
    .settings-label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 2px; }
    #sheetPreview {
      font-size: 0.72rem;
      font-family: monospace;
      color: var(--text-muted);
      padding: 4px 0;
    }

    /* ── Scoreboard ─────────────────────────────────────────────── */
    #scoreboard {
      background: var(--surface);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .score-team { flex: 1; text-align: center; }
    .score-name { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .score-val  { font-size: 2.2rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .score-sep        { font-size: 1.2rem; color: var(--border); padding: 0 6px; }
    .clock-half-label { font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 4px; }
    #halfClock        { font-size: 0.9rem; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; margin-top: 1px; }
    #totalClock       { font-size: 0.62rem; color: var(--text-muted); font-variant-numeric: tabular-nums; margin-top: 2px; }

    /* ── Main content ───────────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 14px 12px;
      overflow-y: auto;
    }

    /* ── Possession toggle ──────────────────────────────────────── */
    .section-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.06em; color: var(--text-muted); text-transform: uppercase; margin-bottom: 6px; }
    .poss-toggle { display: flex; gap: 6px; }
    .poss-btn {
      flex: 1;
      padding: 14px 8px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .poss-btn.active { border-color: var(--accent); background: rgba(59,130,246,0.12); color: var(--text); }

    /* ── Event buttons ──────────────────────────────────────────── */
    .event-grid { display: grid; gap: 8px; }
    .event-grid.two-col   { grid-template-columns: 1fr 1fr; }
    .event-grid.three-col { grid-template-columns: 1fr 1fr 1fr; }

    .gated-section, .gated-label, .gated-button, .gated-grid { display: none; }
    body.game-running .gated-section,
    body.game-running .gated-label    { display: block; }
    body.game-running .gated-grid     { display: grid; }
    body.game-running .gated-button   { display: revert; }
    body:not(.game-running) .btn-undo-big { grid-column: 1 / -1; }

    .start-btn {
      flex: 1;
      padding: 14px 8px;
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }
    .start-btn:active { filter: brightness(0.85); transform: scale(0.97); }
    .start-btn.running {
      background: rgba(34,197,94,0.12);
      border-color: var(--green);
      color: var(--green);
    }

    .evt-btn {
      padding: 18px 12px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: filter 0.1s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .evt-btn:active { filter: brightness(0.85); transform: scale(0.97); }
    .evt-btn:disabled { opacity: 0.35 !important; cursor: not-allowed; }
    .evt-btn:disabled:active { filter: none; transform: none; }

    .btn-try1    { background: var(--green);      color: #000; }
    .btn-turn    { background: var(--orange);     color: #fff; }
    .btn-pen-atk { background: var(--red);        color: #fff; }
    .btn-pen-def { background: var(--red-dark);   color: #fff; }
    .btn-game    { background: var(--surface-2);  color: var(--text); border: 1px solid var(--border); }
    .btn-review  { background: #4c1d95; color: #c4b5fd; border: 1px solid #6d28d9; }
    .btn-undo-big{ background: var(--surface-2);  color: var(--text-muted); border: 1px solid var(--border); }

    /* ── Recent events ──────────────────────────────────────────── */
    #recentList { display: flex; flex-direction: column; gap: 4px; }
    .recent-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.82rem;
    }
    .recent-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .recent-time { font-variant-numeric: tabular-nums; color: var(--text-muted); font-size: 0.75rem; min-width: 52px; }
    .recent-text { flex: 1; }


    /* ── Stats modal v2 ─────────────────────────────────────────── */
    #statsOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    #statsOverlay.open { display: flex; }

    /* Sheet up from bottom on mobile; centred dialog on wider screens */
    #statsCard {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 90dvh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (min-width: 600px) {
      #statsOverlay { align-items: center; padding: 24px; }
      #statsCard { border-radius: 16px; max-width: 520px; max-height: 85dvh; }
    }

    /* drag handle hint */
    .stats-handle {
      width: 36px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 10px auto 0;
      flex-shrink: 0;
    }
    @media (min-width: 600px) { .stats-handle { display: none; } }

    /* hero score at top of modal */
    .stats-hero {
      padding: 16px 20px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stats-hero-team { flex: 1; text-align: center; }
    .stats-hero-name {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stats-hero-score {
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .stats-hero-score.win { color: var(--green); }
    .stats-hero-sep { font-size: 1.4rem; color: var(--border); padding: 0 8px; flex-shrink: 0; }

    /* game status line */
    .stats-status {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      padding: 0 20px 14px;
      border-bottom: 1px solid var(--border);
    }
    .stats-status .dot-live {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--red);
      margin-right: 5px;
      animation: pulse 1.4s ease-in-out infinite;
      vertical-align: middle;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* section divider */
    .stats-section {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 14px 16px 4px;
    }

    /* individual stat row */
    .stat-row {
      padding: 10px 16px 11px;
      border-top: 1px solid var(--border);
    }
    .stat-row-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .stat-row-values {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 8px;
    }
    .stat-cell { display: flex; flex-direction: column; }
    .stat-cell:last-child { align-items: flex-end; }
    .stat-num {
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .stat-num.win { color: var(--green); }
    .stat-num.bad { color: var(--red); }
    .stat-pct  { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .stat-team { font-size: 0.7rem;  color: var(--text-muted); margin-top: 3px; }

    /* proportion bar */
    .stat-bar {
      height: 5px;
      border-radius: 3px;
      background: var(--bg);
      overflow: hidden;
      display: flex;
      gap: 1px;
    }
    .stat-bar-seg {
      height: 100%;
      border-radius: 3px;
      transition: width 0.35s ease;
    }

    /* close button */
    .stats-close-btn {
      margin: 12px 16px 16px;
      padding: 14px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      width: calc(100% - 32px);
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .stats-close-btn:active { background: var(--border); }

    /* ── Edit event modal ───────────────────────────────────────── */
    #editOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }
    #editOverlay.open { display: flex; }
    #editCard {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-height: 90dvh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (min-width: 600px) {
      #editOverlay { align-items: center; padding: 24px; }
      #editCard { border-radius: 16px; max-width: 520px; }
    }
    .recent-item { cursor: pointer; }
    .recent-item:active { background: var(--surface-2); }
  </style>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/events.js"></script>
<script src="js/possession.js"></script>
</head>
<body>

<header>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2" style="flex-shrink:0"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
  <h1>Field Annotator</h1>
  <div class="header-actions">
    <a href="index.html" class="btn-icon" onclick="return confirmLeave()">← Back</a>
    <button class="btn-icon btn-hdr-push" id="pushBtn"     onclick="pushToSheet()">⬆ Push</button>
    <button class="btn-icon btn-hdr-swap" id="swapBtn"     onclick="toggleSwap()">⇆ Swap</button>
    <button class="btn-icon btn-hdr-override" id="overrideBtn" style="display:none" onclick="pushToSheet(true)">⚠ Override</button>
    <button class="btn-icon"              onclick="openStats()">Stats</button>
    <button class="btn-icon btn-live"     id="liveBtn"     onclick="toggleLive()">⚫ Live</button>
    <button class="btn-icon"              onclick="toggleSettings()" id="settingsBtn">⚙ Setup</button>
  </div>
</header>

<div id="settingsPanel" class="open">
  <div>
    <div class="settings-label">Teams</div>
    <div class="settings-row">
      <input id="metaTeam1" placeholder="Team 1" oninput="onMetaChange()">
      <input id="metaTeam2" placeholder="Team 2" oninput="onMetaChange()">
    </div>
  </div>
  <div>
    <div class="settings-row">
      <input id="metaYear"        placeholder="Year"        style="max-width:80px" oninput="onMetaChange()">
      <select id="metaDivision" style="max-width:90px" onchange="onMetaChange()">
        <option value="MXO">MXO</option>
        <option value="MO">MO</option>
        <option value="WO">WO</option>
        <option value="M30">M30</option>
        <option value="W27">W27</option>
        <option value="M40">M40</option>
        <option value="W35">W35</option>
        <option value="" selected>NONE</option>
      </select>
      <input id="metaCompetition" placeholder="Competition" oninput="onMetaChange()">
      <input id="metaId" placeholder="ID" style="max-width:70px" title="Optional disambiguator for repeat fixtures" oninput="onMetaChange()">
    </div>
  </div>
  <div>
    <div class="settings-label">Click delay (s) — subtracted from every tag after the first, to compensate for reaction time</div>
    <div class="settings-row">
      <input id="clickDelayInput" type="number" min="0" max="9" step="1" value="0" style="max-width:90px" oninput="setClickDelay(this.value)">
    </div>
  </div>
  <div id="sheetPreview">fill metadata to generate tab name</div>
  <div>
    <div class="settings-label">Saved Session</div>
    <button class="btn-icon" onclick="clearSession()" style="background:#7f1d1d;color:#fff;border-color:#7f1d1d">🗑 Clear all data</button>
  </div>
</div>

<div id="scoreboard">
  <div class="score-team">
    <div class="score-name" id="scoreName1">Team 1</div>
    <div class="score-val"  id="scoreVal1">0</div>
  </div>
  <div style="text-align:center">
    <div class="score-sep">–</div>
    <div class="clock-half-label" id="halfLabel">—</div>
    <div id="halfClock">00:00</div>
    <div id="totalClock">00:00</div>
  </div>
  <div class="score-team">
    <div class="score-name" id="scoreName2">Team 2</div>
    <div class="score-val"  id="scoreVal2">0</div>
  </div>
</div>

<main>

  <div>
    <div class="poss-toggle">
      <button class="poss-btn active" id="possBtn1" onclick="setPossession('Team 1')">Team 1</button>
      <button class="start-btn"       id="gameEventBtn" onclick="tagGameEventToggle()">Start</button>
      <button class="poss-btn"        id="possBtn2" onclick="setPossession('Team 2')">Team 2</button>
    </div>
  </div>

  <div class="gated-section">
    <div class="section-label">Events</div>
    <div class="event-grid three-col">
      <button class="evt-btn btn-try1"    onclick="tagWithPossession('Try','Other')">Try</button>
      <button class="evt-btn btn-turn"    onclick="tagWithPossession('Turnover','Other')">Turnover</button>
      <button class="evt-btn btn-turn"    onclick="tagWithPossession('Turnover','6th Touch')">6th Touch</button>
      <button class="evt-btn btn-pen-atk" onclick="tagWithPossession('Penalty Attack','Other')">Pen Attack</button>
      <button class="evt-btn btn-pen-def" onclick="tagWithPossession('Penalty Defence','Other')">Pen Defence</button>
      <button class="evt-btn btn-turn"    style="opacity:0.65" onclick="tagWithPossession('Turnover','6 Again')">6 Again</button>
    </div>
  </div>

  <div>
    <div class="section-label gated-label">Game Events</div>
    <div class="event-grid two-col gated-grid" style="margin-bottom: 8px">
      <button class="evt-btn btn-try1"    onclick="tagGameEvent('Drive - Good')">Drive +</button>
      <button class="evt-btn btn-pen-atk" onclick="tagGameEvent('Drive - Bad')">Drive −</button>
    </div>
    <div class="event-grid three-col">
      <button class="evt-btn btn-game     gated-button" onclick="tagGameEvent('Ball Live')">Ball Live</button>
      <button class="evt-btn btn-review   gated-button" onclick="tagToReview()">To Review</button>
      <button class="evt-btn btn-undo-big" onclick="undoLast()">↩ Undo</button>
    </div>
  </div>

  <div>
    <div class="section-label">Recent</div>
    <div id="recentList"><div style="color:var(--text-muted);font-size:0.82rem;padding:8px 0">No events yet</div></div>
  </div>

</main>

<!-- Edit event modal -->
<div id="editOverlay" onclick="if(event.target===this)closeEdit()">
  <div id="editCard">
    <div class="stats-handle"></div>
    <div style="padding:16px 20px 12px;border-bottom:1px solid var(--border)">
      <div style="font-size:0.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px">Change Event</div>
      <div id="editCurrentLabel" style="font-size:1rem;font-weight:600"></div>
    </div>
    <div style="padding:16px">
      <div class="event-grid two-col">
        <button class="evt-btn btn-try1"    onclick="applyEdit('Try','Other')">Try</button>
        <button class="evt-btn btn-turn"    onclick="applyEdit('Turnover','Other')">Turnover</button>
        <button class="evt-btn btn-pen-atk" onclick="applyEdit('Penalty Attack','Other')">Pen Attack</button>
        <button class="evt-btn btn-turn"    onclick="applyEdit('Turnover','6th Touch')">6th Touch</button>
        <button class="evt-btn btn-pen-def" onclick="applyEdit('Penalty Defence','Other')">Pen Defence</button>
        <button class="evt-btn btn-turn"    style="opacity:0.65" onclick="applyEdit('Turnover','6 Again')">6 Again</button>
        <button class="evt-btn btn-game"    onclick="applyEdit('Game Event','Ball Live')">Ball Live</button>
        <button class="evt-btn btn-review"  onclick="applyEdit('To Review','To Review')">To Review</button>
        <button class="evt-btn btn-try1"    onclick="applyEdit('Game Event','Drive - Good')">Drive +</button>
        <button class="evt-btn btn-pen-atk" onclick="applyEdit('Game Event','Drive - Bad')">Drive −</button>
        <button class="evt-btn btn-game"    onclick="applyEdit('Game Event','Game Start')">Game Start</button>
        <button class="evt-btn btn-game"    onclick="applyEdit('Game Event','Game End')">Game End</button>
      </div>
    </div>
    <button class="stats-close-btn" onclick="closeEdit()">Cancel</button>
  </div>
</div>

<!-- Stats modal -->
<div id="statsOverlay" onclick="if(event.target===this)closeStats()">
  <div id="statsCard">
    <div class="stats-handle"></div>
    <div class="stats-hero">
      <div class="stats-hero-team">
        <div class="stats-hero-name"  id="heroName1">Team 1</div>
        <div class="stats-hero-score" id="heroScore1">0</div>
      </div>
      <div class="stats-hero-sep">–</div>
      <div class="stats-hero-team">
        <div class="stats-hero-name"  id="heroName2">Team 2</div>
        <div class="stats-hero-score" id="heroScore2">0</div>
      </div>
    </div>
    <div class="stats-status" id="statsStatus"></div>
    <div id="statsBody"></div>
    <button class="stats-close-btn" onclick="closeStats()">Close</button>
  </div>
</div>

<script>
TR.auth('staff');

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('metaYear').value = String(new Date().getFullYear());
  document.getElementById('clickDelayInput').value = String(clickDelay);
  maybeRestoreSession();
  updateUI();
});

// ── State ──────────────────────────────────────────────────────
let annotations  = [];
let possession   = 'Team 1';
let wallStart    = null;
let liveMode     = false;
let liveInterval = null;
let clickDelay   = Math.min(9, Math.max(0, parseInt(localStorage.getItem('fieldClickDelay') || '0', 10) || 0));

function setClickDelay(v) {
  const n = Math.min(9, Math.max(0, parseInt(v, 10) || 0));
  clickDelay = n;
  localStorage.setItem('fieldClickDelay', String(n));
}

// ── Session persistence ───────────────────────────────────────
const SESSION_KEY = 'fieldAnnotatorSession';

function saveSession() {
  try {
    const state = {
      annotations,
      possession,
      wallStart,
      teamsSwapped,
      meta: {
        team1:       document.getElementById('metaTeam1').value,
        team2:       document.getElementById('metaTeam2').value,
        year:        document.getElementById('metaYear').value,
        division:    document.getElementById('metaDivision').value,
        competition: document.getElementById('metaCompetition').value,
        id:          document.getElementById('metaId').value,
      },
    };
    localStorage.setItem(SESSION_KEY, JSON.stringify(state));
  } catch (e) { /* quota or disabled — ignore */ }
}

function clearSavedSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
}

function maybeRestoreSession() {
  let saved;
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return;
    saved = JSON.parse(raw);
  } catch (e) { return; }
  if (!saved || !Array.isArray(saved.annotations) || !saved.annotations.length) return;

  const m = saved.meta || {};
  const label = `${m.team1 || 'Team 1'} vs ${m.team2 || 'Team 2'} — ${saved.annotations.length} event${saved.annotations.length === 1 ? '' : 's'}`;
  if (!confirm(`Restore previous session?\n\n${label}`)) {
    clearSavedSession();
    return;
  }

  annotations = saved.annotations;
  possession  = saved.possession || 'Team 1';
  wallStart   = saved.wallStart || null;
  if (m.team1       != null) document.getElementById('metaTeam1').value       = m.team1;
  if (m.team2       != null) document.getElementById('metaTeam2').value       = m.team2;
  if (m.year        != null) document.getElementById('metaYear').value        = m.year;
  if (m.division    != null) document.getElementById('metaDivision').value    = m.division;
  if (m.competition != null) document.getElementById('metaCompetition').value = m.competition;
  if (m.id          != null) document.getElementById('metaId').value          = m.id;
  document.getElementById('possBtn1').textContent = (m.team1 || '').trim() || 'Team 1';
  document.getElementById('possBtn2').textContent = (m.team2 || '').trim() || 'Team 2';
  setPossession(possession);
  if (saved.teamsSwapped) toggleSwap();
  updateSheetPreview();
}

function clearSession() {
  const n = annotations.length;
  if (!confirm(`Delete all session data?\n\n${n} event${n === 1 ? '' : 's'} and metadata will be erased. This cannot be undone.`)) return;
  if (!confirm('Are you sure? This is permanent.')) return;
  annotations  = [];
  possession   = 'Team 1';
  wallStart    = null;
  if (teamsSwapped) toggleSwap();
  ['metaTeam1','metaTeam2','metaCompetition','metaId'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('metaYear').value = String(new Date().getFullYear());
  document.getElementById('metaDivision').value = '';
  document.getElementById('possBtn1').textContent = 'Team 1';
  document.getElementById('possBtn2').textContent = 'Team 2';
  setPossession('Team 1');
  clearSavedSession();
  updateSheetPreview();
  updateUI();
}

function confirmLeave() {
  if (!annotations.length) return true;
  const n = annotations.length;
  return confirm(`You have ${n} event${n === 1 ? '' : 's'} saved. They'll be restored when you return. Leave?`);
}

// ── Time helpers ───────────────────────────────────────────────
function nowSeconds() {
  if (wallStart === null) { wallStart = Date.now(); return 0; }
  return (Date.now() - wallStart) / 1000;
}

function fmtClock(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

function ordinal(n) {
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

// ── Team swap ──────────────────────────────────────────────────
let teamsSwapped = false;
function toggleSwap() {
  teamsSwapped = !teamsSwapped;

  // Possession + Start/End buttons (3-column row, Start/End stays in middle)
  const poss    = document.querySelector('.poss-toggle');
  const btn1    = document.getElementById('possBtn1');
  const btn2    = document.getElementById('possBtn2');
  const gameBtn = document.getElementById('gameEventBtn');
  if (teamsSwapped) {
    poss.appendChild(btn2);
    poss.appendChild(gameBtn);
    poss.appendChild(btn1);
  } else {
    poss.appendChild(btn1);
    poss.appendChild(gameBtn);
    poss.appendChild(btn2);
  }

  // Scoreboard (flex order; center div stays at default order:0)
  const s1 = document.getElementById('scoreName1').closest('.score-team');
  const s2 = document.getElementById('scoreName2').closest('.score-team');
  s1.style.order = teamsSwapped ? '1' : '-1';
  s2.style.order = teamsSwapped ? '-1' : '1';

  // Stats hero (same technique)
  const h1 = document.getElementById('heroName1').closest('.stats-hero-team');
  const h2 = document.getElementById('heroName2').closest('.stats-hero-team');
  h1.style.order = teamsSwapped ? '1' : '-1';
  h2.style.order = teamsSwapped ? '-1' : '1';

  document.getElementById('swapBtn').classList.toggle('active', teamsSwapped);
  saveSession();
}

// ── Possession ─────────────────────────────────────────────────
function setPossession(team) {
  possession = team;
  document.getElementById('possBtn1').classList.toggle('active', team === 'Team 1');
  document.getElementById('possBtn2').classList.toggle('active', team === 'Team 2');
  saveSession();
}

// ── Tagging ────────────────────────────────────────────────────
function tag(type, name, possessionOwner) {
  let t = nowSeconds();
  if (annotations.length > 0) t = Math.max(0, t - clickDelay);
  const actionOwner = TR.inferActionOwner(possessionOwner, type, name);
  annotations.push({ id: Date.now() + Math.random(), type, name, possessionOwner, actionOwner, comment: '', time: t, timeStr: TR.fmt(t) });

  const next = TR.inferPossessionAfter(possessionOwner, type, name);
  if (next !== possessionOwner) setPossession(next);

  updateUI();
  saveSession();
  if (liveMode) pushLiveUpdate();
}

function tagWithPossession(type, name) { tag(type, name, possession); }
function tagGameEvent(name)            { tag('Game Event', name, possession); }

function tagGameEventToggle() {
  const gameEventAnnots = annotations.filter(a => a.name === 'Game Start' || a.name === 'Game End');
  const last = gameEventAnnots[gameEventAnnots.length - 1];
  tagGameEvent(last && last.name === 'Game Start' ? 'Game End' : 'Game Start');
}

function tagToReview() {
  let t = nowSeconds();
  if (annotations.length > 0) t = Math.max(0, t - clickDelay);
  annotations.push({ id: Date.now() + Math.random(), type: 'To Review', name: 'To Review', possessionOwner: possession, actionOwner: possession, comment: '?', time: t, timeStr: TR.fmt(t) });
  updateUI();
  saveSession();
  if (liveMode) pushLiveUpdate();
}

function undoLast() {
  if (!annotations.length) return;
  const removed = annotations.pop();
  setPossession(removed.possessionOwner);
  updateUI();
  saveSession();
}

// ── Edit event ─────────────────────────────────────────────────
let editingIndex = null;

function computePossAfter(a) {
  return TR.inferPossessionAfter(a.possessionOwner, a.type, a.name);
}

function replayPossessionFrom(startIndex) {
  for (let i = startIndex; i < annotations.length; i++) {
    const newPoss = computePossAfter(annotations[i - 1]);
    annotations[i].possessionOwner = newPoss;
    annotations[i].actionOwner = TR.inferActionOwner(newPoss, annotations[i].type, annotations[i].name);
  }
  const last = annotations[annotations.length - 1];
  setPossession(last ? computePossAfter(last) : 'Team 1');
}

function openEdit(index) {
  editingIndex = index;
  const a = annotations[index];
  document.getElementById('editCurrentLabel').textContent = eventLabel(a) + ' · ' + fmtClock(a.time);
  document.getElementById('editOverlay').classList.add('open');
}

function closeEdit() {
  editingIndex = null;
  document.getElementById('editOverlay').classList.remove('open');
}

function applyEdit(type, name) {
  if (editingIndex === null) return;
  const a = annotations[editingIndex];
  a.type = type;
  a.name = name;
  a.actionOwner = TR.inferActionOwner(a.possessionOwner, type, name);
  replayPossessionFrom(editingIndex + 1);
  closeEdit();
  updateUI();
  saveSession();
}

// ── UI update ──────────────────────────────────────────────────
const EVENT_LABELS = { 'Try': 'Try', 'Turnover': 'Turnover', 'Penalty Attack': 'Pen Attack', 'Penalty Defence': 'Pen Defence' };
function eventLabel(a) {
  if (a.name !== 'Other') return a.name;
  return EVENT_LABELS[a.type] || a.type;
}

function updateUI() {
  const t1 = document.getElementById('metaTeam1').value.trim() || 'Team 1';
  const t2 = document.getElementById('metaTeam2').value.trim() || 'Team 2';
  document.getElementById('scoreName1').textContent = t1;
  document.getElementById('scoreName2').textContent = t2;
  document.getElementById('scoreVal1').textContent  = annotations.filter(a => a.type === 'Try' && a.actionOwner === 'Team 1').length;
  document.getElementById('scoreVal2').textContent  = annotations.filter(a => a.type === 'Try' && a.actionOwner === 'Team 2').length;

  const gameStarts   = annotations.filter(a => a.name === 'Game Start');
  const firstStart   = gameStarts[0];
  const lastStart    = gameStarts[gameStarts.length - 1];
  const lastTime     = annotations.length ? annotations[annotations.length - 1].time : 0;
  const halfElapsed  = lastStart  ? Math.max(0, lastTime - lastStart.time)  : 0;
  const totalElapsed = firstStart ? Math.max(0, lastTime - firstStart.time) : 0;
  const isOnBreak = lastStart && annotations.some(a => a.name === 'Game End' && a.time > lastStart.time);
  document.getElementById('halfLabel').textContent  = !gameStarts.length ? '—' : isOnBreak ? 'Break' : ordinal(gameStarts.length) + ' Half';
  document.getElementById('halfClock').textContent  = fmtClock(halfElapsed);
  document.getElementById('totalClock').textContent = 'Total ' + fmtClock(totalElapsed);

  const COLORS = { 'Try': '#22c55e', 'Turnover': '#f97316', 'Penalty Attack': '#ef4444', 'Penalty Defence': '#b91c1c', 'Game Event': '#3b82f6', 'To Review': '#7c3aed' };
  const el = document.getElementById('recentList');
  const gameEventAnnots = annotations.filter(a => a.name === 'Game Start' || a.name === 'Game End');
  const lastGameEvent   = gameEventAnnots[gameEventAnnots.length - 1];
  const gameRunning     = !!(lastGameEvent && lastGameEvent.name === 'Game Start');
  const gameBtn = document.getElementById('gameEventBtn');
  gameBtn.textContent = gameRunning ? 'End' : 'Start';
  gameBtn.classList.toggle('running', gameRunning);
  document.body.classList.toggle('game-running', gameRunning);

  if (!annotations.length) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:0.82rem;padding:8px 0">No events yet</div>';
    return;
  }
  const recent = [...annotations].reverse().slice(0, 5);
  el.innerHTML = recent.map((a, ri) => {
    const idx     = annotations.length - 1 - ri;
    const color   = COLORS[a.type] || '#888';
    const team    = a.actionOwner === 'Team 1' ? (document.getElementById('metaTeam1').value.trim() || 'Team 1')
                                                : (document.getElementById('metaTeam2').value.trim() || 'Team 2');
    const teamStr = a.type !== 'Game Event' ? ` · ${team}` : '';
    return `<div class="recent-item" onclick="openEdit(${idx})">
      <div class="recent-dot" style="background:${color}"></div>
      <span class="recent-time">${fmtClock(a.time)}</span>
      <span class="recent-text">${eventLabel(a)}${teamStr}</span>
      <span style="color:var(--border);font-size:0.9rem;flex-shrink:0">›</span>
    </div>`;
  }).join('');
}

function onMetaChange() {
  const t1 = document.getElementById('metaTeam1').value.trim() || 'Team 1';
  const t2 = document.getElementById('metaTeam2').value.trim() || 'Team 2';
  document.getElementById('possBtn1').textContent = t1;
  document.getElementById('possBtn2').textContent = t2;
  updateUI();
  updateSheetPreview();
  saveSession();
}

// ── Settings panel ─────────────────────────────────────────────
function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('open');
}

function metaToSheetName() {
  const slug = s => s.trim().toLowerCase().replace(/\s+/g, '-');
  const year  = slug(document.getElementById('metaYear').value);
  const div   = slug(document.getElementById('metaDivision').value);
  const comp  = slug(document.getElementById('metaCompetition').value);
  const t1    = slug(document.getElementById('metaTeam1').value);
  const t2    = slug(document.getElementById('metaTeam2').value);
  const id    = slug(document.getElementById('metaId').value);
  const base  = [year, div, comp, t1, t2].filter(Boolean).join('_');
  return id ? `${base}_${id}` : base;
}

function updateSheetPreview() {
  const name = metaToSheetName();
  const el   = document.getElementById('sheetPreview');
  el.textContent = name || 'fill metadata to generate tab name';
  el.style.color = name ? '#3b82f6' : 'var(--text-muted)';
}

// ── Clock ticker ───────────────────────────────────────────────
setInterval(() => {
  if (!wallStart) return;
  const gameStarts = annotations.filter(a => a.name === 'Game Start');
  if (!gameStarts.length) return;
  const now            = Date.now();
  const firstStartWall = wallStart + gameStarts[0].time * 1000;
  const lastStartWall  = wallStart + gameStarts[gameStarts.length - 1].time * 1000;
  document.getElementById('halfClock').textContent  = fmtClock(Math.max(0, (now - lastStartWall)  / 1000));
  document.getElementById('totalClock').textContent = 'Total ' + fmtClock(Math.max(0, (now - firstStartWall) / 1000));
}, 1000);

// ── Live mode ──────────────────────────────────────────────────
function toggleLive() {
  const sheetName = metaToSheetName();
  if (!sheetName) { alert('Fill in team/competition details first.'); return; }
  liveMode = !liveMode;
  const btn = document.getElementById('liveBtn');
  if (liveMode) {
    btn.textContent = '🔴 Live';
    btn.classList.add('active');
    pushLiveUpdate();
    liveInterval = setInterval(pushLiveUpdate, 30000);
    window.addEventListener('beforeunload', stopLive);
  } else {
    stopLive();
  }
}

function stopLive() {
  liveMode = false;
  clearInterval(liveInterval);
  liveInterval = null;
  const btn = document.getElementById('liveBtn');
  if (btn) { btn.textContent = '⚫ Live'; btn.classList.remove('active'); }
  const sheetName = metaToSheetName();
  if (sheetName) {
    fetch(TR.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ secret: TR.secret(), action: 'live_clear', sheetName }),
    }).catch(() => {});
  }
}

function pushLiveUpdate() {
  const sheetName = metaToSheetName();
  if (!sheetName) return;
  const team1 = document.getElementById('metaTeam1').value.trim() || 'Team 1';
  const team2 = document.getElementById('metaTeam2').value.trim() || 'Team 2';
  const score1 = annotations.filter(a => a.type === 'Try' && a.actionOwner === 'Team 1').length;
  const score2 = annotations.filter(a => a.type === 'Try' && a.actionOwner === 'Team 2').length;
  const gameStart     = annotations.find(a => a.name === 'Game Start');
  const gameStartWall = gameStart ? wallStart + gameStart.time * 1000 : (wallStart || Date.now());
  const timeSeconds   = Math.max(0, (Date.now() - gameStartWall) / 1000);
  const { t1, t2 } = computeStats();
  // Event log surfaced on live.html: tries (for running score), penalties, and
  // half markers. Old `{scorer,time}` rows (no `type`) are still rendered as tries.
  const LIVE_EVENT_TYPES = new Set(['Try', 'Penalty Attack', 'Penalty Defence']);
  const events = annotations
    .filter(a => LIVE_EVENT_TYPES.has(a.type) || a.name === 'Game Start' || a.name === 'Game End')
    .map(a => ({
      time:   Math.floor(a.time),
      scorer: a.actionOwner || '',
      type:   (a.name === 'Game Start' || a.name === 'Game End') ? a.name : a.type,
    }))
    .sort((a, b) => a.time - b.time);
  fetch(TR.APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ secret: TR.secret(), action: 'live_update', sheetName, team1, team2, score1, score2, timeSeconds, poss1: t1.possessions, poss2: t2.possessions, comps1: t1.compsNum, comps2: t2.compsNum, triesJson: JSON.stringify(events) }),
  }).catch(() => {});
}

// ── Stats modal ────────────────────────────────────────────────
let statsRefreshInterval = null;

function computeStats() {
  const t1name = document.getElementById('metaTeam1').value.trim() || 'Team 1';
  const t2name = document.getElementById('metaTeam2').value.trim() || 'Team 2';

  const evts = annotations.filter(a => a.type !== 'To Review' && a.type !== 'Game Event');

  // Group consecutive events by possessionOwner into possession segments
  const segs = [];
  let cur = null;
  for (const e of evts) {
    if (!cur || e.possessionOwner !== cur.owner) {
      if (cur) segs.push(cur);
      cur = { owner: e.possessionOwner, events: [e] };
    } else {
      cur.events.push(e);
    }
  }
  if (cur) segs.push(cur);

  // Pre-compute dead-ball intervals: [prev event time → Ball Live time]
  const sorted    = [...annotations].sort((a, b) => a.time - b.time);
  const deadSlots = sorted
    .filter(a => a.name === 'Ball Live')
    .map(bl => {
      const idx  = sorted.indexOf(bl);
      const prev = idx > 0 ? sorted[idx - 1] : null;
      return prev ? { start: prev.time, end: bl.time } : null;
    })
    .filter(Boolean);

  // Each possession starts where the previous ended (or from Game Start)
  const gameStart = annotations.find(a => a.name === 'Game Start');
  const t0 = gameStart ? gameStart.time : (evts.length ? evts[0].time : 0);
  for (let i = 0; i < segs.length; i++) {
    const last      = segs[i].events[segs[i].events.length - 1];
    segs[i].endType = last.type;
    segs[i].endName = last.name;
    segs[i].end     = last.time;
    segs[i].start   = i === 0 ? t0 : segs[i - 1].end;
    const deadInSeg = deadSlots.filter(d => d.start >= segs[i].start && d.end <= segs[i].end);
    const deadTime  = deadInSeg.reduce((s, d) => s + (d.end - d.start), 0);
    segs[i].duration = Math.max(0, segs[i].end - segs[i].start - deadTime);
  }

  // Avg turnover time: dead ball gap after each turnover trigger, attributed to receiving team
  const TO_TRIGGERS = new Set(['Turnover', 'Penalty Attack', 'Penalty Defence']);
  const turnoverTimes = { 'Team 1': [], 'Team 2': [] };
  let sIdx = 0;
  for (let i = 0; i < sorted.length; i++) {
    const evt = sorted[i];
    if (!TO_TRIGGERS.has(evt.type)) continue;
    if (evt.type === 'Turnover' && evt.name === '6 Again') continue;
    while (sIdx < segs.length - 1 && segs[sIdx].end < evt.time) sIdx++;
    const nextSeg = segs[sIdx + 1];
    if (!nextSeg) continue;
    const next = sorted[i + 1];
    const dt = (next && next.name === 'Ball Live') ? Math.max(0, next.time - evt.time) : 0;
    if (turnoverTimes[nextSeg.owner]) turnoverTimes[nextSeg.owner].push(dt);
  }
  const avgTO = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;

  const statFor = key => {
    const mine   = segs.filter(s => s.owner === key);
    const tries  = mine.filter(s => s.endType === 'Try').length;
    const comps  = mine.filter(s => s.endType === 'Try' || s.endName === '6th Touch').length;
    const penAtk = annotations.filter(a => a.type === 'Penalty Attack'  && a.actionOwner === key).length;
    const penDef = annotations.filter(a => a.type === 'Penalty Defence' && a.actionOwner === key).length;
    const driveGood = annotations.filter(a => a.type === 'Game Event' && a.name === 'Drive - Good' && a.actionOwner === key).length;
    const driveBad  = annotations.filter(a => a.type === 'Game Event' && a.name === 'Drive - Bad'  && a.actionOwner === key).length;
    const total    = mine.reduce((s, p) => s + p.duration, 0);
    const avg      = mine.length ? total / mine.length : 0;
    const deadBallRaw = mine.reduce((sum, seg) => {
      const inSeg = deadSlots.filter(d => d.start >= seg.start && d.end <= seg.end);
      return sum + inSeg.reduce((s, d) => s + (d.end - d.start), 0);
    }, 0);
    const avgTurnoverRaw = avgTO(turnoverTimes[key]);
    return {
      score:       annotations.filter(a => a.type === 'Try' && a.actionOwner === key).length,
      possessions: mine.length,
      triesNum:    tries,
      compsNum:    comps,
      compsPct:    mine.length ? Math.round(comps  / mine.length * 100) : null,
      penAtk,      penAtkPct: mine.length ? Math.round(penAtk / mine.length * 100) : null,
      penDef,
      driveGood,   driveGoodPct: mine.length ? Math.round(driveGood / mine.length * 100) : null,
      driveBad,    driveBadPct:  mine.length ? Math.round(driveBad  / mine.length * 100) : null,
      avgTime:     avg.toFixed(1),    avgTimeRaw:  avg,
      totalTime:   total.toFixed(1),  totalTimeRaw:total,
      deadBall:    deadBallRaw.toFixed(1), deadBallRaw,
      avgTurnover: avgTurnoverRaw.toFixed(1), avgTurnoverRaw,
    };
  };

  const t1 = { name: t1name, ...statFor('Team 1') };
  const t2 = { name: t2name, ...statFor('Team 2') };
  t1.penDefPct = t2.possessions ? Math.round(t1.penDef / t2.possessions * 100) : null;
  t2.penDefPct = t1.possessions ? Math.round(t2.penDef / t1.possessions * 100) : null;
  return { t1, t2 };
}

function openStats() {
  refreshStats();
  document.getElementById('statsOverlay').classList.add('open');
  statsRefreshInterval = setInterval(refreshStats, 5000);
}

function closeStats() {
  document.getElementById('statsOverlay').classList.remove('open');
  clearInterval(statsRefreshInterval);
  statsRefreshInterval = null;
}

function refreshStats() {
  const { t1, t2 } = computeStats();

  // Hero scores
  document.getElementById('heroName1').textContent  = t1.name;
  document.getElementById('heroName2').textContent  = t2.name;
  document.getElementById('heroScore1').textContent = t1.score;
  document.getElementById('heroScore2').textContent = t2.score;
  document.getElementById('heroScore1').className   = 'stats-hero-score' + (t1.score > t2.score ? ' win' : '');
  document.getElementById('heroScore2').className   = 'stats-hero-score' + (t2.score > t1.score ? ' win' : '');

  // Game status
  const hasStart  = annotations.some(a => a.name === 'Game Start');
  const hasEnd    = annotations.some(a => a.name === 'Game End');
  const gsAnnot   = annotations.find(a => a.name === 'Game Start');
  const gsWall    = gsAnnot && wallStart ? wallStart + gsAnnot.time * 1000 : null;
  let statusHtml  = '';
  if (!hasStart) {
    statusHtml = 'No game started';
  } else if (hasEnd) {
    statusHtml = 'Full time';
  } else {
    const elapsed = gsWall ? Math.max(0, (Date.now() - gsWall) / 1000) : 0;
    statusHtml = `<span class="dot-live"></span>In progress · ${fmtClock(elapsed)}`;
  }
  document.getElementById('statsStatus').innerHTML = statusHtml;

  // Stat sections — tL/tR respects the swap toggle
  // Each row: { label, n1, pct1, n2, pct2, r1, r2, hib }
  // hib: true = higher better, false = lower better, null = informational
  const [tL, tR] = teamsSwapped ? [t2, t1] : [t1, t2];
  const sections = [
    {
      label: 'Scoring',
      rows: [
        { label: 'Tries',        n1: tL.triesNum + ' / ' + tL.possessions, pct1: null, n2: tR.triesNum + ' / ' + tR.possessions, pct2: null, r1: tL.triesNum, r2: tR.triesNum, hib: true  },
        { label: 'Completions',  n1: tL.compsNum + ' / ' + tL.possessions, pct1: tL.compsPct, n2: tR.compsNum + ' / ' + tR.possessions, pct2: tR.compsPct, r1: tL.compsNum, r2: tR.compsNum, hib: true  },
      ],
    },
    {
      label: 'Possession',
      rows: [
        { label: 'Avg Time (s)',  n1: tL.avgTime,   pct1: null, n2: tR.avgTime,   pct2: null, r1: tL.avgTimeRaw,   r2: tR.avgTimeRaw,   hib: null  },
        { label: 'Total Time (s)',n1: tL.totalTime, pct1: null, n2: tR.totalTime, pct2: null, r1: tL.totalTimeRaw, r2: tR.totalTimeRaw, hib: null  },
        { label: 'Dead Ball (s)', n1: tL.deadBall,  pct1: null, n2: tR.deadBall,  pct2: null, r1: tL.deadBallRaw,  r2: tR.deadBallRaw,  hib: false },
        { label: 'Avg Turnover (s)', n1: tL.avgTurnover, pct1: null, n2: tR.avgTurnover, pct2: null, r1: tL.avgTurnoverRaw, r2: tR.avgTurnoverRaw, hib: false },
      ],
    },
    {
      label: 'Discipline',
      rows: [
        { label: 'Pen Attack',   n1: tL.penAtk + '/' + tL.possessions, pct1: tL.penAtkPct, n2: tR.penAtk + '/' + tR.possessions, pct2: tR.penAtkPct, r1: tL.penAtk, r2: tR.penAtk, hib: false },
        { label: 'Pen Defence',  n1: tL.penDef, pct1: tL.penDefPct, n2: tR.penDef, pct2: tR.penDefPct, r1: tL.penDef, r2: tR.penDef, hib: false },
      ],
    },
    {
      label: 'Drives',
      rows: [
        { label: 'Drive +',  n1: tL.driveGood + ' / ' + tL.possessions, pct1: tL.driveGoodPct, n2: tR.driveGood + ' / ' + tR.possessions, pct2: tR.driveGoodPct, r1: tL.driveGood, r2: tR.driveGood, hib: true  },
        { label: 'Drive −',  n1: tL.driveBad  + ' / ' + tL.possessions, pct1: tL.driveBadPct,  n2: tR.driveBad  + ' / ' + tR.possessions, pct2: tR.driveBadPct,  r1: tL.driveBad,  r2: tR.driveBad,  hib: false },
      ],
    },
  ];

  const html = sections.map(sec => {
    const rowsHtml = sec.rows.map(({ label, n1, pct1, n2, pct2, r1, r2, hib }) => {
      // Value colours
      let c1 = '', c2 = '';
      if (hib === true)  { if (r1 > r2) c1 = 'win'; else if (r2 > r1) c2 = 'win'; }
      if (hib === false) { if (r1 < r2) c1 = 'win'; else if (r2 < r1) c2 = 'bad'; }

      // Proportion bar: left = Team 1's share, right = Team 2's share
      const total   = r1 + r2;
      const share1  = total > 0 ? (r1 / total * 100).toFixed(1) : 50;
      const share2  = total > 0 ? (100 - share1) : 50;

      // Bar segment colours
      let bc1, bc2;
      if (hib === null) {
        bc1 = 'rgba(59,130,246,0.35)'; bc2 = 'rgba(59,130,246,0.2)';
      } else if (r1 === r2) {
        bc1 = 'var(--surface-2)'; bc2 = 'var(--surface-2)';
      } else if (hib === true) {
        bc1 = r1 > r2 ? 'var(--green)' : 'var(--surface-2)';
        bc2 = r2 > r1 ? 'var(--green)' : 'var(--surface-2)';
      } else {
        bc1 = r1 < r2 ? 'var(--green)' : 'var(--red)';
        bc2 = r2 < r1 ? 'var(--green)' : 'var(--red)';
      }

      const pctStr1 = pct1 != null ? `<div class="stat-pct">${pct1}%</div>` : '';
      const pctStr2 = pct2 != null ? `<div class="stat-pct">${pct2}%</div>` : '';

      return `<div class="stat-row">
        <div class="stat-row-label">${label}</div>
        <div class="stat-row-values">
          <div class="stat-cell">
            <div class="stat-num ${c1}">${n1}</div>
            ${pctStr1}
            <div class="stat-team">${tL.name}</div>
          </div>
          <div class="stat-cell">
            <div class="stat-num ${c2}">${n2}</div>
            ${pctStr2}
            <div class="stat-team">${tR.name}</div>
          </div>
        </div>
        <div class="stat-bar">
          <div class="stat-bar-seg" style="width:${share1}%;background:${bc1}"></div>
          <div class="stat-bar-seg" style="width:${share2}%;background:${bc2}"></div>
        </div>
      </div>`;
    }).join('');
    return `<div class="stats-section">${sec.label}</div>${rowsHtml}`;
  }).join('');

  document.getElementById('statsBody').innerHTML = html;
}

// ── Push to sheet ──────────────────────────────────────────────
async function pushToSheet(override = false) {
  if (!annotations.length) { alert('No events to push.'); return; }
  const sheetName = metaToSheetName();
  if (!sheetName) { alert('Fill in team/competition details first.'); return; }

  const btn = override ? document.getElementById('overrideBtn') : document.getElementById('pushBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Pushing…';

  const rows = annotations.map(a => [a.timeStr, a.possessionOwner, a.type, a.name, '', a.comment, a.actionOwner]);

  try {
    const names      = annotations.map(a => a.name);
    const analyzable = names.includes('Game Start') && names.includes('Game End') ? 'TRUE' : 'FALSE';
    const body = {
      secret: TR.secret(), sheetName, rows,
      meta: {
        team1:       document.getElementById('metaTeam1').value.trim(),
        team2:       document.getElementById('metaTeam2').value.trim(),
        year:        document.getElementById('metaYear').value.trim(),
        division:    document.getElementById('metaDivision').value.trim(),
        competition: document.getElementById('metaCompetition').value.trim(),
        id:          document.getElementById('metaId').value.trim(),
        video:       '',
        analyzable,
      },
    };
    if (override) body.override = true;

    const resp   = await fetch(TR.APPS_SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) });
    const result = await resp.json();

    if (!result.ok) {
      if (result.tabExists && !override) {
        if (TR.secret() === 'm30-admin') {
          document.getElementById('overrideBtn').style.display = '';
          alert(`Tab "${sheetName}" already exists. Tap ⚠ Override to replace it.`);
        } else {
          alert(`Tab "${sheetName}" already exists. Admin access required to override.`);
        }
        btn.disabled = false; btn.textContent = '⬆ Push'; return;
      }
      alert('Error: ' + result.error);
      btn.disabled = false; btn.textContent = override ? '⚠ Override' : '⬆ Push'; return;
    }

    document.getElementById('overrideBtn').style.display = 'none';
    btn.textContent = `✓ ${result.appended} rows`;
    clearSavedSession();
    setTimeout(() => { btn.disabled = false; btn.textContent = override ? '⚠ Override' : '⬆ Push'; }, 2500);
  } catch (err) {
    alert('Network error: ' + err.message);
    btn.disabled = false; btn.textContent = override ? '⚠ Override' : '⬆ Push';
  }
}
