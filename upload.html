<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Upload — Touch Rugby Analyzer</title>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="cb7fd4f2-fcd5-44d7-a8e4-70e9068870bb" data-auto-track="false"></script>
  <script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #0f1117;
      --surface:   #181b26;
      --surface-2: #22253a;
      --border:    #2a2d3a;
      --text:      #e0e0e0;
      --text-muted:#888;
      --accent:    #3b82f6;
      --green:     #22c55e;
      --red:       #ef4444;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 0.95rem; font-weight: 600; }
    header a  { margin-left: auto; color: var(--text-muted); text-decoration: none; font-size: 0.8rem; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); }
    header a:hover { background: var(--surface-2); color: var(--text); }
    main { max-width: 640px; margin: 0 auto; padding: 32px 24px; }
    h2 { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }
    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px; margin-bottom: 16px; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 14px; }
    .field label { font-size: 0.72rem; color: var(--text-muted); }
    .field select, .field input[type=text], .field input[type=number], .field input[type=file] {
      background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      color: var(--text); padding: 9px 11px; font-size: 0.88rem; outline: none; width: 100%;
    }
    .field select:focus, .field input:focus { border-color: var(--accent); }
    .checkbox-row { display: flex; align-items: center; gap: 7px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px; }
    .checkbox-row input { accent-color: var(--accent); }
    button.primary {
      padding: 10px 18px; background: var(--accent); color: #fff; border: none;
      border-radius: 6px; font-size: 0.88rem; font-weight: 600; cursor: pointer; width: 100%;
    }
    button.primary:disabled { opacity: 0.5; cursor: default; }
    .progress { height: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; margin-top: 12px; }
    .progress-fill { height: 100%; background: var(--accent); transition: width 0.2s; width: 0%; }
    .status { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; min-height: 18px; }
    .status.success { color: var(--green); }
    .status.error   { color: var(--red); }
    .uid-display { font-family: ui-monospace, monospace; font-size: 0.75rem; color: var(--text); background: var(--bg); padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); margin-top: 8px; word-break: break-all; }
    .hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; line-height: 1.5; }
  </style>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
</head>
<body>

<header>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
  <h1>Cloudflare Stream Upload</h1>
  <a href="index.html">← Back</a>
</header>

<main>
  <div class="panel">
    <h2>Upload a match video</h2>
    <div class="field">
      <label>Game</label>
      <select id="gameSelect"><option>Loading…</option></select>
    </div>
    <div class="field">
      <label>Video file</label>
      <input type="file" id="fileInput" accept="video/*">
    </div>
    <div class="field">
      <label>Max duration (seconds, used by Cloudflare for encoding)</label>
      <input type="number" id="maxDuration" min="60" max="21600" value="7200">
      <div class="hint">Cap on the upload's encoded length. Default 2h covers a full match plus warm-up; bump for longer recordings.</div>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="signedToggle">
      <label for="signedToggle">Require signed URLs (private — only logged-in users can watch)</label>
    </div>
    <button class="primary" id="uploadBtn" onclick="startUpload()">Upload</button>
    <div class="progress" id="progressBar" hidden><div class="progress-fill" id="progressFill"></div></div>
    <div class="status" id="status"></div>
    <div class="uid-display" id="uidDisplay" hidden></div>
  </div>
</main>

<script>
TR.auth('admin');

let sheets = [];

async function loadGames() {
  try {
    const resp   = await fetch(`${TR.APPS_SCRIPT_URL}?secret=${TR.enc(TR.secret())}&action=list`);
    const result = await resp.json();
    if (!result.ok) throw new Error(result.error);
    sheets = result.sheets || [];
    const sel = document.getElementById('gameSelect');
    sel.innerHTML = '';
    if (!sheets.length) {
      sel.innerHTML = '<option value="">(no games found)</option>';
      return;
    }
    sheets
      .slice()
      .sort((a, b) => (TR.sheetNameToLabel(a) || a.name).localeCompare(TR.sheetNameToLabel(b) || b.name))
      .forEach(g => {
        const opt = document.createElement('option');
        opt.value = g.name;
        opt.textContent = TR.sheetNameToLabel(g);
        sel.appendChild(opt);
      });
  } catch (err) {
    document.getElementById('status').textContent = 'Failed to load games: ' + err.message;
    document.getElementById('status').classList.add('error');
  }
}

function setStatus(msg, kind) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

async function startUpload() {
  const sheetName = document.getElementById('gameSelect').value;
  const file      = document.getElementById('fileInput').files[0];
  const maxSec    = parseInt(document.getElementById('maxDuration').value, 10) || 7200;
  const signed    = document.getElementById('signedToggle').checked;

  if (!sheetName) { alert('Pick a game first.'); return; }
  if (!file)      { alert('Choose a video file.'); return; }
  if (typeof tus === 'undefined') { alert('tus client not loaded — check network.'); return; }

  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  btn.textContent = 'Requesting upload URL…';
  setStatus('');
  document.getElementById('uidDisplay').hidden = true;

  // 1. Mint a one-time upload URL from Cloudflare via Apps Script.
  let uploadURL, uid;
  try {
    const url    = `${TR.APPS_SCRIPT_URL}?secret=${TR.enc(TR.secret())}&action=stream_upload_url&maxDurationSeconds=${maxSec}`;
    const resp   = await fetch(url);
    const result = await resp.json();
    if (!result.ok) throw new Error(result.error);
    uploadURL = result.uploadURL;
    uid       = result.uid;
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Upload';
    setStatus('Could not get upload URL: ' + err.message, 'error');
    return;
  }

  // 2. tus-upload the file straight to Cloudflare. The file never touches Apps Script.
  document.getElementById('progressBar').hidden = false;
  btn.textContent = 'Uploading…';
  setStatus('0%');

  const upload = new tus.Upload(file, {
    endpoint: uploadURL,
    uploadUrl: uploadURL,  // direct_upload returns a pre-created tus URL
    chunkSize: 50 * 1024 * 1024,
    retryDelays: [0, 1000, 3000, 5000],
    metadata: { filename: file.name, filetype: file.type },
    onError: err => {
      btn.disabled = false; btn.textContent = 'Upload';
      setStatus('Upload failed: ' + err.message, 'error');
    },
    onProgress: (sent, total) => {
      const pct = total ? Math.round(sent / total * 100) : 0;
      document.getElementById('progressFill').style.width = pct + '%';
      setStatus(`${pct}% (${(sent / 1e6).toFixed(1)} / ${(total / 1e6).toFixed(1)} MB)`);
    },
    onSuccess: async () => {
      setStatus('Upload complete — attaching to game…');
      // 3. Persist the UID + provider onto _metadata via backfill_video.
      try {
        const resp = await fetch(TR.APPS_SCRIPT_URL, {
          method:  'POST',
          headers: { 'Content-Type': 'text/plain' },
          body:    JSON.stringify({
            secret: TR.secret(),
            action: 'backfill_video',
            sheetName,
            provider: 'stream',
            value: uid,
            signed,
            offsetSeconds: 0,
          }),
        });
        const result = await resp.json();
        if (!result.ok) throw new Error(result.error);
        setStatus('✓ Done. The video is encoding; it can take a few minutes before playback works.', 'success');
        document.getElementById('uidDisplay').hidden = false;
        document.getElementById('uidDisplay').textContent = 'Stream UID: ' + uid;
        btn.textContent = 'Upload another';
        btn.disabled = false;
      } catch (err) {
        setStatus('Uploaded but failed to attach to game: ' + err.message + '. UID: ' + uid, 'error');
        btn.textContent = 'Upload';
        btn.disabled = false;
      }
    }
  });
  upload.start();
}

loadGames();
</script>
</body>
</html>
