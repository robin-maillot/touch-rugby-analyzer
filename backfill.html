<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Backfill — Touch Rugby Analyzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #181b26;
      --surface-2: #22253a;
      --border:    #2a2d3a;
      --text:      #e0e0e0;
      --text-muted:#888;
      --accent:    #3b82f6;
      --green:     #22c55e;
      --red:       #ef4444;
    }

    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 0.95rem; font-weight: 600; }
    header a  { margin-left: auto; color: var(--text-muted); text-decoration: none; font-size: 0.8rem; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); }
    header a:hover { background: var(--surface-2); color: var(--text); }

    main { max-width: 760px; margin: 0 auto; padding: 32px 24px; }

    h2 { font-size: 0.8rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px; }

    #loading { color: var(--text-muted); font-size: 0.9rem; padding: 40px 0; text-align: center; }

    .game-list { display: flex; flex-direction: column; gap: 12px; }

    .game-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
    }
    .game-card.done { border-color: #14532d; background: #0d1f14; }

    .game-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 2px; }
    .game-sub   { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 14px; }

    .form-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
    .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 160px; }
    .field label { font-size: 0.72rem; color: var(--text-muted); }
    .field input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.85rem;
      outline: none;
      width: 100%;
    }
    .field input:focus { border-color: var(--accent); }
    .field input::placeholder { color: #444; }
    .field-offset { max-width: 120px; }
    .field-time   { max-width: 120px; }

    .load-time-btn {
      padding: 8px 12px;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      align-self: flex-end;
    }
    .load-time-btn:hover   { color: var(--text); }
    .load-time-btn:disabled { opacity: 0.5; cursor: default; }
    .load-time-btn.loaded  { color: var(--green); border-color: var(--green); }

    .submit-btn {
      padding: 9px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      align-self: flex-end;
    }
    .submit-btn:disabled { opacity: 0.5; cursor: default; }
    .submit-btn.success  { background: var(--green); color: #000; }
    .submit-btn.error    { background: var(--red); }

    .done-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--green);
      margin-bottom: 10px;
    }
    .existing-url {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      word-break: break-all;
    }
    .existing-url a { color: var(--accent); text-decoration: none; }
    .existing-url a:hover { text-decoration: underline; }
    .hint { font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; }

    #allDone {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
      font-size: 0.95rem;
      display: none;
    }
  </style>
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
</head>
<body>

<header>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/><path d="M2 12h20"/></svg>
  <h1>Video Backfill</h1>
  <a href="index.html">← Back</a>
</header>

<main>
  <div id="loading">Loading games…</div>
  <div id="allDone">All games already have a YouTube link ✓</div>
  <div id="needsVideo" style="margin-bottom:32px"></div>
  <div id="hasVideo"   style="margin-bottom:32px"></div>
</main>

<script>
TR.auth('admin');

function gameLabel(g) {
  if (g.team1 && g.team2) {
    const sub = [g.year, g.division, g.competition].filter(Boolean).join(' ');
    const id  = g.id ? ` #${g.id}` : '';
    return { title: `${g.team1} vs ${g.team2}${id}`, sub };
  }
  return { title: g.name, sub: '' };
}

function renderCard(g, container) {
  const { title, sub } = gameLabel(g);
  const card = document.createElement('div');
  card.className = 'game-card' + (g.youtubelink ? ' done' : '');
  card.id = 'card-' + g.name;

  let existingHtml = '';
  if (g.youtubelink) {
    existingHtml = `<div class="done-badge">✓ Video linked</div>
      <div class="existing-url"><a href="${g.youtubelink}" target="_blank" rel="noopener">${g.youtubelink}</a></div>`;
  }

  card.innerHTML = `
    <div class="game-title">${title}</div>
    <div class="game-sub">${sub || g.name}</div>
    ${existingHtml}
    <div class="form-row">
      <div class="field">
        <label>YouTube URL</label>
        <input type="url" class="url-input" placeholder="https://www.youtube.com/watch?v=..." value="${g.youtubelink || ''}">
      </div>
      <button class="submit-btn" onclick="submit(this, '${g.name}')">
        ${g.youtubelink ? 'Update' : 'Apply'}
      </button>
    </div>
    <div class="form-row" style="margin-top:8px">
      <div class="field field-time">
        <label>First event time</label>
        <input type="text" class="first-time-input" placeholder="0:00:00" pattern="\\d+:\\d{2}:\\d{2}">
      </div>
      <button class="load-time-btn" onclick="loadFirstTime(this, '${g.name}')">Load time</button>
    </div>
  `;
  container.appendChild(card);
}

function parseHMS(str) {
  const parts = str.split(':').map(Number);
  if (parts.some(isNaN)) return NaN;
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  return NaN;
}

async function loadFirstTime(btn, sheetName) {
  btn.disabled    = true;
  btn.textContent = '⏳';
  const card = document.getElementById('card-' + sheetName);
  try {
    const resp   = await fetch(`${TR.APPS_SCRIPT_URL}?secret=${TR.enc(TR.secret())}&sheetName=${TR.enc(sheetName)}`);
    const result = await resp.json();
    if (!result.ok) throw new Error(result.error);
    const rows = result.rows;
    if (!rows || rows.length < 2) throw new Error('No events found');
    const timeIdx = rows[0].map(h => h.toLowerCase().trim()).indexOf('time');
    if (timeIdx < 0) throw new Error('No Time column found in sheet');
    const timeStr = rows[1][timeIdx];
    const input = card.querySelector('.first-time-input');
    input.value = timeStr;
    input.dataset.original = timeStr;
    btn.textContent = '✓ Loaded';
    btn.classList.add('loaded');
  } catch (err) {
    btn.textContent = 'Retry';
    btn.disabled = false;
    alert('Failed to load events: ' + err.message);
  }
}

async function submit(btn, sheetName) {
  const card   = document.getElementById('card-' + sheetName);
  const url    = card.querySelector('.url-input').value.trim();

  if (!url) { alert('Enter a YouTube URL first.'); return; }

  const firstTimeInput = card.querySelector('.first-time-input');
  const newTimeStr  = firstTimeInput?.value.trim();
  const origTimeStr = firstTimeInput?.dataset.original;
  let offsetSeconds = 0;
  if (newTimeStr && !origTimeStr) {
    alert('Press "Load time" first so the current first-event time is known, then edit it to set the offset.');
    return;
  }
  if (newTimeStr && origTimeStr && newTimeStr !== origTimeStr) {
    const newSecs  = parseHMS(newTimeStr);
    const origSecs = parseHMS(origTimeStr);
    if (isNaN(newSecs)) { alert(`Invalid time format "${newTimeStr}" — use h:mm:ss or m:ss.`); return; }
    offsetSeconds = newSecs - origSecs;
  }

  btn.disabled    = true;
  btn.textContent = '⏳ Saving…';

  try {
    const resp   = await fetch(TR.APPS_SCRIPT_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'text/plain' },
      body:    JSON.stringify({ secret: TR.secret(), action: 'backfill_youtube', sheetName, youtubeUrl: url, offsetSeconds }),
    });
    const result = await resp.json();
    if (!result.ok) throw new Error(result.error);
    btn.textContent = '✓ Saved';
    btn.classList.add('success');
    card.classList.add('done');
    card.querySelector('.game-sub') && (card.querySelector('.game-sub').textContent || '');
    // Update existing URL display
    let existingEl = card.querySelector('.existing-url');
    if (!existingEl) {
      existingEl = document.createElement('div');
      existingEl.className = 'existing-url';
      card.querySelector('.game-sub').after(existingEl);
    }
    existingEl.innerHTML = `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Update'; btn.classList.remove('success'); }, 3000);
  } catch (err) {
    btn.textContent = '✗ Error';
    btn.classList.add('error');
    alert('Error: ' + err.message);
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Apply'; btn.classList.remove('error'); }, 2500);
  }
}

async function load() {
  try {
    const resp   = await fetch(`${TR.APPS_SCRIPT_URL}?secret=${TR.enc(TR.secret())}&action=list`);
    const result = await resp.json();
    if (!result.ok) throw new Error(result.error);

    document.getElementById('loading').style.display = 'none';

    const missing = result.sheets.filter(g => !g.youtubelink);
    const linked  = result.sheets.filter(g =>  g.youtubelink);

    if (!missing.length && !linked.length) {
      document.getElementById('allDone').style.display = 'block';
      return;
    }

    if (missing.length) {
      const section = document.getElementById('needsVideo');
      const h = document.createElement('h2');
      h.textContent = `Missing video link (${missing.length})`;
      section.appendChild(h);
      const list = document.createElement('div');
      list.className = 'game-list';
      missing.forEach(g => renderCard(g, list));
      section.appendChild(list);
    }

    if (linked.length) {
      const section = document.getElementById('hasVideo');
      const h = document.createElement('h2');
      h.textContent = `Already linked (${linked.length})`;
      section.appendChild(h);
      const list = document.createElement('div');
      list.className = 'game-list';
      linked.forEach(g => renderCard(g, list));
      section.appendChild(list);
    }

  } catch (err) {
    document.getElementById('loading').textContent = 'Failed to load games: ' + err.message;
  }
}

load();
</script>
</body>
</html>
